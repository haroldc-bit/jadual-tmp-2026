<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadual Waktu Mingguan TMP Digital v9.1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @media print {
            @page { size: landscape; margin: 0.5cm; }
            .no-print { display: none !important; }
            body { background: white !important; padding: 0; margin: 0; font-family: 'Times New Roman', serif; color: black !important; }
            main { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            .freeze-container { overflow: visible !important; max-height: none !important; border: none !important; display: block !important; }
            table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse; border: 1px solid black !important; }
            th, td { border: 1px solid black !important; background: white !important; color: black !important; }
            .rounded-3xl, .rounded-[3.5rem], .rounded-2xl { border-radius: 0 !important; }
            input, select, textarea { border: none !important; background: transparent !important; color: black !important; appearance: none; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            thead, .table-to-scroll thead th { position: static !important; }
            .sticky-top-scroll { display: none !important; }
        }
        
        .vertical-text { writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg); display: inline-block; }
        @keyframes high-visibility-flash { 0% { background-color: #3b82f6; color: white; transform: scale(1.02); } 100% { background-color: transparent; transform: scale(1); } }
        .highlight-new { animation: high-visibility-flash 2.5s ease-out forwards; }
        .week-scrollbar::-webkit-scrollbar { height: 8px; display: block; }
        .week-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .week-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .sync-scroll-container { overflow-x: auto; overflow-y: hidden; }
        .sync-scroll-container::-webkit-scrollbar { height: 10px; }
        .sync-scroll-container::-webkit-scrollbar-track { background: #f8fafc; }
        .sync-scroll-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .table-to-scroll thead th { position: sticky; top: 0; z-index: 50; background: #f8fafc !important; box-shadow: inset 0 -2px 0 #000; }
        .font-table-content { font-size: 14px !important; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .freeze-container { max-height: calc(100vh - 280px); overflow: auto; border: 2px solid black; position: relative; background: white; }
    </style>
</head>
<body class="bg-white min-h-screen text-black font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icons = {
            Plus: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            X: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Undo: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-15 9 9 0 0 0-8.31 5.5"></path></svg>,
            Save: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
            Lock: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            External: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>,
            User: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
            Bell: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>,
            Check: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        };

        const App = () => {
            const firebaseConfig = {
                apiKey: "AIzaSyBOCPBrZ-xkwEgi4OnkBwDB8YqGgWEuMVE",
                authDomain: "jadual-tmp-digital.firebaseapp.com",
                projectId: "jadual-tmp-digital",
                storageBucket: "jadual-tmp-digital.firebasestorage.app",
                messagingSenderId: "716895729119",
                appId: "1:716895729119:web:ca75d33c6e07a177ef006a",
                measurementId: "G-THMTY1YPX8"
            };

            const [user, setUser] = useState(null);
            const [isAuthorized, setIsAuthorized] = useState(() => sessionStorage.getItem('tmp_auth') === 'true');
            const [userRole, setUserRole] = useState(() => sessionStorage.getItem('tmp_role') || null);
            const [accessCode, setAccessCode] = useState("");
            const [loginError, setLoginError] = useState("");
            const [isCloudEnabled, setIsCloudEnabled] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [appId] = useState('tmp-jadual-v26-master');

            const [academicCycle, setAcademicCycle] = useState('A'); 
            const [selectedWeek, setSelectedWeek] = useState(1);
            const [sessionStartDate, setSessionStartDate] = useState('2026-01-05');
            const [academicSession, setAcademicSession] = useState('Januari - Jun');
            const [events, setEvents] = useState({});
            const [changeRequests, setChangeRequests] = useState({});
            const [footerData, setFooterData] = useState({ preparedName: '', preparedDate: '', verifiedName: '', verifiedDate: '' });
            const [filterSemester, setFilterSemester] = useState('SEMUA');
            const [saturdayConfigs, setSaturdayConfigs] = useState({});

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isRequestModalOpen, setIsRequestModalOpen] = useState(false);
            const [editingEvent, setEditingEvent] = useState(null);
            const [lastUpdatedKey, setLastUpdatedKey] = useState(null);
            const [isSaving, setIsSaving] = useState(false);

            const topScrollRef = useRef(null);
            const tableContainerRef = useRef(null);
            const tableElementRef = useRef(null);
            const [tableWidth, setTableWidth] = useState(0);

            const semesters = ['T1SI', 'T1SII', 'T2SI', 'T2SII'];
            const courseCodes = ["MTBT 2114", "MTIM 2013", "MTIB 2022", "MTPE 2064", "MTMM 2043", "MTMM 2053", "MTMM 2153", "MTBC 2032", "MTGC 2074", "MTHE 2103", "MTMS 2082", "MTPC 2133", "MTPC 2122", "MTBT 2193", "MTPC 2203", "MTNF 2162", "MTHE 2182", "MTVS 2142", "GCLE 2042", "CCPS 2012", "CCEH 2022", "GCMP 2022", "CCRM 2013", "GCSF 2013", "Lain-lain"];
            
            const instructorList = [
                "HAROLD CRISO ANAK AJIN", "MAXSION BIN BATUT", "ADELINE BONG HUI FEN", "MOHD SYAHID HARRIS ABDULLAH", 
                "INDRAWATI BINTI AMBO", "HAZLIANA BINTI HAZALI", "HARNIYATIE BINTI MOHAMAD", "AHMAD FAIZAL BIN OTHMAN", 
                "ISSYATUL SOFEA ABDULLAH", "JOCELYN CHAN YUNN NING", "NOOR AYUNIE BINTI MOHAMAD", "LING SIEW LING", 
                "WONG SUK CHIE", "TERRYIE BIN EDDIE", "TERRY ANSLEM RIMPA", "MUHAMMAD IQBAL NA’IM BIN ZAMRI", 
                "NURUL NADIAH BINTI MAZLAN", "HANNA ATHIRAH BINTI AMREE", "RAJA NURUL AMIRAH BINTI RAJA ZAMRI", 
                "NUR AMIESHA BINTI ABDULLAH", "NURHIDATUN BINTI ANNUAR RIGOS", "LESAH BINTI ISMAIL", "LEE GIAP BENG", 
                "JAYANTHI A/P MARIMUTHU", "Lain-lain"
            ];

            const days = ['Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
            const timeSlots = ['8.00 - 9.00', '9.00 - 10.00', '10.00 - 10.30', '10.30 - 11.30', '11.30 - 12.30', '12.30 - 1.00', '1.00 - 2.00', '2.00 - 3.00', '3.00 - 4.00', '4.00 - 5.00'];

            const semesterLabels = { 'T1SI': 'Tahun 1 Semester I', 'T1SII': 'Tahun 1 Semester II', 'T2SI': 'Tahun 2 Semester I', 'T2SII': 'Tahun 2 Semester II' };
            const sessionInitials = { 'Kuliah': '(L)', 'Amali': '(P)', 'IL': '(IL)', 'Tutorial': '(T)', 'CA': '(CA)', 'Ulangkaji': '(UK)', 'Lain-lain': '(LL)' };
            
            const sessionTypes = [
                { label: 'Kuliah (L)', value: 'Kuliah', color: 'bg-blue-50 border-blue-500 text-blue-700' },
                { label: 'Amali (P)', value: 'Amali', color: 'bg-emerald-50 border-emerald-500 text-emerald-700' },
                { label: 'IL (Self Learning)', value: 'IL', color: 'bg-amber-50 border-amber-500 text-amber-700' },
                { label: 'Tutorial (T)', value: 'Tutorial', color: 'bg-purple-50 border-purple-400 text-purple-700' },
                { label: 'CA (Assessment)', value: 'CA', color: 'bg-red-50 border-red-400 text-red-700' },
                { label: 'Ulangkaji', value: 'Ulangkaji', color: 'bg-orange-50 border-orange-400 text-orange-700' },
                { label: 'Lain-lain (LL)', value: 'Lain-lain', color: 'bg-slate-50 border-slate-400 text-slate-700' }
            ];

            // FIX: Posisikan fungsi isSlotBreak di bahagian atas untuk elakkan ralat rujukan
            const isSlotBreak = (day, slotIdx) => {
                const slot = timeSlots[slotIdx];
                if (slot === '10.00 - 10.30') return true; 
                if (day !== 'Jumaat' && slot === '1.00 - 2.00') return true; 
                if (day === 'Jumaat') return [5, 6].includes(slotIdx); 
                return false;
            };

            const sessionOptions = useMemo(() => academicCycle === 'A' ? ['Januari - Jun', 'Julai - Disember'] : ['Oktober - Mac', 'April - September'], [academicCycle]);

            useEffect(() => { setAcademicSession(sessionOptions[0]); }, [academicCycle, sessionOptions]);

            const weekStatus = useMemo(() => {
                if (selectedWeek === 10) return "CUTI PERTENGAHAN SEMESTER";
                if ([21, 22, 23].includes(selectedWeek)) return "MINGGU PEPERIKSAAN";
                if ([24, 25, 26].includes(selectedWeek)) return "CUTI AKHIR SEMESTER";
                return "NORMAL";
            }, [selectedWeek]);

            const currentWeekHasSaturday = useMemo(() => saturdayConfigs[`${academicCycle}-${selectedWeek}`] === true, [saturdayConfigs, selectedWeek, academicCycle]);
            const visibleDays = useMemo(() => currentWeekHasSaturday ? days : days.slice(0, 5), [currentWeekHasSaturday]);

            const getDisplayDateForDay = (dayIdx) => {
                const start = new Date(sessionStartDate);
                start.setDate(start.getDate() + (selectedWeek - 1) * 7 + dayIdx);
                return start.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
            };

            const autoWeekRange = useMemo(() => {
                const start = new Date(sessionStartDate);
                start.setDate(start.getDate() + (selectedWeek - 1) * 7);
                const end = new Date(start);
                end.setDate(start.getDate() + (currentWeekHasSaturday ? 5 : 4));
                return `${start.toLocaleDateString('en-GB')} - ${end.toLocaleDateString('en-GB')}`;
            }, [sessionStartDate, selectedWeek, currentWeekHasSaturday]);

            const currentYear = new Date().getFullYear();
            const displayAcademicSession = useMemo(() => {
                if (academicSession === 'Oktober - Mac') return `Oktober ${currentYear} - Mac ${currentYear + 1}`;
                return `${academicSession} ${currentYear}`;
            }, [academicSession, currentYear]);

            const [formData, setFormData] = useState({ id: '', day: '', timeSlotIndex: 0, courseCode: 'MTBT 2114', customCourseCode: '', topic: '', type: 'Kuliah', instructor: '', semester: '', duration: 1, sessionNumber: '' });

            // FIREBASE REALTIME SYNC
            useEffect(() => {
                if (!isAuthorized || !isCloudEnabled || !user) return;
                const db = firebase.firestore();
                setIsSyncing(true);
                const unsubEvents = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_cycle_${academicCycle}`)
                    .onSnapshot((snap) => {
                        const data = {}; snap.forEach(doc => { data[doc.id] = doc.data(); });
                        setEvents(data); setIsSyncing(false);
                    }, () => setIsSyncing(false));
                
                const unsubReq = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('change_requests')
                    .onSnapshot((snap) => {
                        const data = {}; snap.forEach(doc => { data[doc.id] = doc.data(); });
                        setChangeRequests(data);
                    });

                const unsubFooter = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_meta_${academicCycle}`).doc('signatures')
                    .onSnapshot((doc) => { if (doc.exists) setFooterData(doc.data()); });
                
                const unsubSat = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('jadual_meta_shared').doc('saturday_configs')
                    .onSnapshot((doc) => { if (doc.exists) setSaturdayConfigs(doc.data()); });

                return () => { unsubEvents(); unsubReq(); unsubFooter(); unsubSat(); };
            }, [user, isAuthorized, isCloudEnabled, appId, academicCycle]);

            useEffect(() => {
                const initFirebase = async () => {
                    if (!firebase.apps.length) {
                        try {
                            firebase.initializeApp(firebaseConfig);
                            const cred = await firebase.auth().signInAnonymously();
                            setUser(cred.user); setIsCloudEnabled(true);
                        } catch (e) { loadLocalData(); }
                    }
                };
                initFirebase();
            }, []);

            const loadLocalData = () => {
                const saved = localStorage.getItem(`tmp_v9.0_local_${academicCycle}`);
                if (saved) {
                    const p = JSON.parse(saved);
                    setEvents(p.events || {}); setFooterData(p.footer || {}); setSaturdayConfigs(p.saturdayConfigs || {}); setSessionStartDate(p.start || '2026-01-05'); setAcademicSession(p.academicSession || sessionOptions[0]);
                }
            };

            const isLocked = (event) => {
                if (!event || !event.lastUpdate) return false;
                const ONE_DAY = 24 * 60 * 60 * 1000;
                return (Date.now() - event.lastUpdate) > ONE_DAY;
            };

            const handleSave = async () => {
                if (isSaving || userRole === 'viewer') return;
                setIsSaving(true);
                const finalCode = formData.courseCode === 'Lain-lain' ? formData.customCourseCode : formData.courseCode;
                const key = `${academicSession}-${selectedWeek}-${formData.day}-${formData.semester}-${formData.timeSlotIndex}`;
                const data = { ...formData, courseCode: finalCode, cycle: academicCycle, session: academicSession, lastUpdate: editingEvent?.lastUpdate || Date.now() };
                
                try {
                    const db = firebase.firestore();
                    if (userRole === 'admin' && isLocked(editingEvent)) {
                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('change_requests').doc(key).set({...data, requestType: 'EDIT'});
                        alert("Slot terkunci (>24j). Permohonan pindaan dihantar kepada Pentadbir Sistem.");
                    } else {
                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_cycle_${academicCycle}`).doc(key).set(data);
                    }
                    setIsModalOpen(false);
                } catch (e) { alert("Ralat simpan."); } finally { setIsSaving(false); }
            };

            const handleDelete = async () => {
                if (isSaving || !editingEvent || userRole === 'viewer') return;
                const key = `${academicSession}-${selectedWeek}-${formData.day}-${formData.semester}-${formData.timeSlotIndex}`;
                const db = firebase.firestore();

                if (userRole === 'superuser') {
                    if (!confirm("Padam slot ini secara kekal?")) return;
                    try {
                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_cycle_${academicCycle}`).doc(key).delete();
                        setIsModalOpen(false);
                    } catch (e) { alert("Gagal memadam."); }
                } else if (userRole === 'admin') {
                    if (isLocked(editingEvent)) {
                        if (!confirm("Slot telah melebihi 24 jam. Hantar permohonan PADAM kepada Pentadbir?")) return;
                        try {
                            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('change_requests').doc(key).set({...editingEvent, requestType: 'DELETE'});
                            alert("Permohonan memadam telah dihantar.");
                            setIsModalOpen(false);
                        } catch (e) { alert("Ralat menghantar permohonan."); }
                    } else {
                        if (!confirm("Padam slot ini? (Tindakan ini dibenarkan dalam tempoh 24 jam pertama)")) return;
                        try {
                            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_cycle_${academicCycle}`).doc(key).delete();
                            setIsModalOpen(false);
                        } catch (e) { alert("Gagal memadam."); }
                    }
                }
            };

            const approveRequest = async (reqKey, reqData) => {
                const db = firebase.firestore();
                try {
                    if (reqData.requestType === 'DELETE') {
                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_cycle_${reqData.cycle}`).doc(reqKey).delete();
                    } else {
                        const cleanData = { ...reqData };
                        delete cleanData.requestType;
                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_cycle_${reqData.cycle}`).doc(reqKey).set(cleanData);
                    }
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('change_requests').doc(reqKey).delete();
                } catch (e) { alert("Gagal meluluskan."); }
            };

            const rejectRequest = async (reqKey) => {
                const db = firebase.firestore();
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('change_requests').doc(reqKey).delete();
                } catch (e) { alert("Gagal menolak."); }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                setLoginError("");
                if(accessCode === "ADMIN2026"){ 
                    setIsAuthorized(true); setUserRole('superuser'); sessionStorage.setItem('tmp_auth', 'true'); sessionStorage.setItem('tmp_role', 'superuser');
                } else if (accessCode === "DTMP2026") {
                    setIsAuthorized(true); setUserRole('admin'); sessionStorage.setItem('tmp_auth', 'true'); sessionStorage.setItem('tmp_role', 'admin');
                } else if (accessCode === "JTMP2026") {
                    setIsAuthorized(true); setUserRole('viewer'); sessionStorage.setItem('tmp_auth', 'true'); sessionStorage.setItem('tmp_role', 'viewer');
                } else { 
                    setLoginError("Kod Akses Salah");
                }
            };

            const handleOpenModal = (day, sem, slotIdx, event = null) => {
                if (isSlotBreak(day, slotIdx) || userRole === 'viewer') return;
                if (event) {
                    setFormData({ ...event, customCourseCode: courseCodes.includes(event.courseCode) ? '' : event.courseCode, sessionNumber: event.sessionNumber || '' });
                    setEditingEvent(event);
                } else {
                    setFormData({ id: Math.random().toString(36).substr(2, 9), day, semester: sem, timeSlotIndex: slotIdx, courseCode: courseCodes[0], customCourseCode: '', topic: '', type: 'Kuliah', instructor: '', duration: 1, sessionNumber: '' });
                    setEditingEvent(null);
                }
                setIsModalOpen(true);
            };

            const handleFooterChange = async (field, val) => {
                if (userRole === 'viewer') return;
                const next = { ...footerData, [field]: val };
                setFooterData(next);
                if (isCloudEnabled && user) await firebase.firestore().collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_meta_${academicCycle}`).doc('signatures').set(next);
            };

            // SYNC SCROLLBARS
            useEffect(() => {
                const top = topScrollRef.current;
                const bottom = tableContainerRef.current;
                if (!top || !bottom) return;
                const syncTop = () => { bottom.scrollLeft = top.scrollLeft; };
                const syncBottom = () => { top.scrollLeft = bottom.scrollLeft; };
                top.addEventListener('scroll', syncTop);
                bottom.addEventListener('scroll', syncBottom);
                const resizeObserver = new ResizeObserver(() => { if (tableElementRef.current) setTableWidth(tableElementRef.current.scrollWidth); });
                if (tableElementRef.current) resizeObserver.observe(tableElementRef.current);
                return () => {
                    top.removeEventListener('scroll', syncTop);
                    bottom.removeEventListener('scroll', syncBottom);
                    resizeObserver.disconnect();
                };
            }, [isAuthorized, selectedWeek, filterSemester, currentWeekHasSaturday, academicCycle]);

            if (!isAuthorized) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-blue-900 p-6 text-center text-black">
                        <div className="bg-white p-10 rounded-[3rem] shadow-2xl max-w-md w-full border-4 border-white">
                            <div className="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center text-white mx-auto mb-6 shadow-xl"><Icons.Lock /></div>
                            <h2 className="text-xl font-black mb-8 uppercase text-slate-800 tracking-tight">Jadual Waktu Mingguan Program DTMP</h2>
                            <form onSubmit={handleLogin}>
                                <input type="password" value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Kod Akses" className="w-full px-6 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black text-center mb-4 outline-none focus:border-blue-600 transition-all text-black" autoFocus />
                                <button className="w-full py-4 bg-blue-600 text-white rounded-2xl font-black uppercase hover:bg-blue-700 transition-all shadow-md">Masuk Sistem</button>
                                {loginError && <p className="mt-4 text-red-600 font-bold text-xs uppercase">{loginError}</p>}
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="pb-20 bg-white min-h-screen text-black">
                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-[100] px-6 py-4 no-print shadow-sm flex flex-col gap-4 font-sans text-black">
                        <div className="max-w-[98%] mx-auto w-full flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center gap-4 text-black">
                                <div className="bg-blue-700 p-2 rounded-xl text-white font-black italic shadow-lg">TMP</div>
                                <div className="flex flex-col">
                                    <h1 className="font-black text-slate-800 text-lg leading-none uppercase tracking-tight">JWM MASTER</h1>
                                    <div className="flex items-center gap-2 mt-1">
                                        <button onClick={() => setAcademicCycle('A')} className={`px-2 py-0.5 rounded text-[9px] font-black uppercase transition-all ${academicCycle === 'A' ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 text-slate-400'}`}>Kitaran Jan-Dis</button>
                                        <button onClick={() => setAcademicCycle('B')} className={`px-2 py-0.5 rounded text-[9px] font-black uppercase transition-all ${academicCycle === 'B' ? 'bg-orange-600 text-white shadow-md' : 'bg-slate-100 text-slate-400'}`}>Kitaran Apr-Mac</button>
                                        <span className="ml-2 px-2 py-0.5 bg-slate-800 text-white rounded text-[8px] font-black uppercase flex items-center gap-1 shadow-sm"><Icons.User /> {userRole}</span>
                                        {userRole === 'superuser' && Object.keys(changeRequests).length > 0 && (
                                            <button onClick={() => setIsRequestModalOpen(true)} className="ml-2 px-2 py-0.5 bg-red-600 text-white rounded text-[8px] font-black uppercase flex items-center gap-1 shadow-md animate-pulse">
                                                <Icons.Bell /> {Object.keys(changeRequests).length} Permohonan
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>

                            <div className="flex-1 max-w-lg bg-slate-50 p-2 rounded-2xl border border-slate-200 shadow-inner overflow-hidden">
                                <div className="week-scrollbar flex gap-2 overflow-x-auto pb-2 px-1">
                                    {Array.from({length: 26}, (_, i) => i + 1).map(w => (
                                        <button key={w} onClick={() => setSelectedWeek(w)} className={`shrink-0 min-w-[45px] py-2 rounded-xl font-black text-xs transition-all ${selectedWeek === w ? (academicCycle === 'A' ? 'bg-blue-600 text-white shadow-md' : 'bg-orange-600 text-white shadow-md') : 'bg-white text-slate-400 hover:bg-slate-100'}`}>M{w}</button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-3">
                                <div className="flex flex-col gap-1 border-r pr-3 border-slate-100">
                                    <label className="text-[12px] font-black uppercase text-slate-400 leading-none">Sesi Akademik</label>
                                    <select disabled={userRole === 'viewer'} value={academicSession} onChange={e => setAcademicSession(e.target.value)} className={`bg-blue-50 text-blue-800 text-[10px] font-black p-1.5 rounded-lg border border-blue-100 outline-none ${userRole === 'viewer' ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}`}>
                                        {sessionOptions.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                    </select>
                                </div>
                                <div className="flex flex-col gap-1 border-r pr-3 border-slate-100">
                                    <label className="text-[12px] font-black uppercase text-slate-400 leading-none">Mula M1</label>
                                    <input disabled={userRole === 'viewer'} type="date" value={sessionStartDate} onChange={e => setSessionStartDate(e.target.value)} className={`bg-slate-100 text-slate-800 text-[10px] font-black p-1 rounded outline-none ${userRole === 'viewer' ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}`} />
                                </div>
                                {userRole !== 'viewer' && (
                                    <div className="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 text-black">
                                        <span className="text-[9px] font-black uppercase text-slate-400 leading-none">Sabtu</span>
                                        <button onClick={() => {
                                            const satKey = `${academicCycle}-${selectedWeek}`;
                                            const next = !currentWeekHasSaturday;
                                            setSaturdayConfigs({...saturdayConfigs, [satKey]: next});
                                            if(isCloudEnabled) firebase.firestore().collection('artifacts').doc(appId).collection('public').doc('data').collection('jadual_meta_shared').doc('saturday_configs').set({...saturdayConfigs, [satKey]: next});
                                        }} className={`w-8 h-4 rounded-full relative transition-all ${currentWeekHasSaturday ? 'bg-green-500' : 'bg-slate-300'}`}>
                                            <div className={`absolute top-0.5 w-3 h-3 bg-white rounded-full transition-all ${currentWeekHasSaturday ? 'left-4' : 'left-0.5'}`}></div>
                                        </button>
                                    </div>
                                )}
                                <button onClick={() => window.print()} className="bg-slate-800 text-white px-5 py-2.5 rounded-xl text-[10px] font-black hover:bg-black transition-all shadow-md flex items-center gap-2 uppercase">
                                    <Icons.Save /> Cetak
                                </button>
                                <button onClick={() => {setIsAuthorized(false); setUserRole(null); sessionStorage.removeItem('tmp_auth'); sessionStorage.removeItem('tmp_role');}} className="p-3 bg-red-50 text-red-500 rounded-xl hover:bg-red-600 hover:text-white transition-all shadow-sm"><Icons.External /></button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-[99%] mx-auto p-4 md:p-8 print:p-0 bg-white">
                        <div className="relative mb-6 text-center border-b-2 border-black pb-4 bg-white font-sans text-black">
                            <div className="absolute top-0 right-0 text-[12px] font-bold text-black uppercase tracking-tighter">BPL.KKM.PK(T) 048B/17</div>
                            <div className="flex justify-center mb-1 text-black">
                                <img src="JATA_NEGARA_MALAYSIA.jpg" alt="Jata Negara" className="h-24 w-auto object-contain" 
                                    onError={(e) => { e.target.onerror = null; e.target.src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Coat_of_arms_of_Malaysia.svg/400px-Coat_of_arms_of_Malaysia.svg.png"; }} />
                            </div>
                            <h1 className="text-xl font-black text-black uppercase leading-tight">KEMENTERIAN KESIHATAN MALAYSIA</h1>
                            <h2 className="text-lg font-bold text-black mt-1 uppercase underline underline-offset-8 tracking-wide">Jadual Waktu Mingguan</h2>
                            <div className="mt-8 flex flex-col md:flex-row justify-between items-start md:items-end text-left gap-4 font-sans text-black">
                                <div className="space-y-1 flex-1">
                                    <div className="flex gap-2">
                                        <span className="font-black text-[12px] uppercase shrink-0 text-black">NAMA INSTITUSI:</span>
                                        <span className="font-bold text-[12px] uppercase text-black">INSTITUT LATIHAN KEMENTERIAN KESIHATAN MALAYSIA KUCHING, SARAWAK</span>
                                    </div>
                                    <div className="flex flex-wrap items-center gap-10">
                                        <div className="flex items-center gap-2">
                                            <span className="font-black text-[12px] uppercase text-black">TARIKH:</span>
                                            <span className="font-bold text-[12px] text-black uppercase tracking-tight">{autoWeekRange}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="font-black text-[12px] uppercase text-black">SEMESTER:</span>
                                            <select value={filterSemester} onChange={e => setFilterSemester(e.target.value)} className="font-bold text-[12px] uppercase text-black bg-slate-50 px-2 py-0.5 rounded no-print outline-none cursor-pointer border border-slate-200">
                                                <option value="SEMUA">Pilihan Semester (Semua)</option>
                                                {semesters.map(s => <option key={s} value={s}>{semesterLabels[s]}</option>)}
                                            </select>
                                            <span className="hidden print:inline font-bold text-[12px] uppercase">{filterSemester === 'SEMUA' ? 'Tahun 1 Sem II, Tahun 2 Sem I & II' : semesterLabels[filterSemester]}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="font-black text-[12px] uppercase text-black">SESI AKADEMIK:</span>
                                            <span className="font-bold text-[12px] uppercase text-black">{displayAcademicSession}</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <h2 className="text-[16px] font-black text-black uppercase leading-none">MINGGU {selectedWeek}</h2>
                                    {weekStatus !== "NORMAL" && <div className="text-[11px] font-black text-red-600 mt-1 uppercase tracking-widest leading-none">{weekStatus}</div>}
                                </div>
                            </div>
                        </div>

                        <div ref={topScrollRef} className="sync-scroll-container no-print mb-1">
                            <div style={{ width: `${tableWidth}px`, height: '1px' }}></div>
                        </div>

                        <div ref={tableContainerRef} className="freeze-container table-to-scroll bg-white relative">
                            <div ref={tableElementRef}>
                                <table className="w-full border-collapse table-fixed min-w-[1600px] print:min-w-full text-black">
                                    <thead>
                                        <tr className="bg-slate-50 border-b-2 border-black text-center text-black font-black text-[14px] uppercase tracking-tighter">
                                            <th className="w-40 p-4 border-r border-black font-table-content">Hari / Tarikh</th>
                                            <th className="w-20 border-r border-black font-table-content">Sem</th>
                                            {timeSlots.map(slot => (<th key={slot} className="p-3 border-r border-black last:border-0 font-table-content">{slot}</th>))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {visibleDays.map((day, dayIdx) => {
                                            const visibleSemesters = filterSemester === 'SEMUA' ? semesters : [filterSemester];
                                            const displayDate = getDisplayDateForDay(dayIdx);
                                            return (
                                                <React.Fragment key={day}>
                                                    {visibleSemesters.map((sem, semIdx) => {
                                                        const skips = [];
                                                        return (
                                                            <tr key={`${day}-${sem}`} className={`border-b border-black/20 ${semIdx === visibleSemesters.length - 1 ? 'border-b-2 border-black' : ''}`}>
                                                                {semIdx === 0 && (
                                                                    <td rowSpan={visibleSemesters.length} className="p-4 bg-white border-r border-black text-center align-middle">
                                                                        <div className="font-black text-black text-[14px] uppercase mb-1 font-table-content leading-none">{day}</div>
                                                                        <div className="text-[12px] font-black text-blue-700 bg-blue-50/20 px-2 py-1 rounded border border-blue-100 inline-block leading-none">{displayDate}</div>
                                                                    </td>
                                                                )}
                                                                <td className="p-2 bg-white text-center font-black text-[14px] text-slate-500 border-r border-black uppercase font-table-content leading-none font-sans">{sem}</td>
                                                                {timeSlots.map((slot, slotIdx) => {
                                                                    if (skips.includes(slotIdx)) return null;
                                                                    const key = `${academicSession}-${selectedWeek}-${day}-${sem}-${slotIdx}`;
                                                                    const event = events[key];
                                                                    const isBreak = isSlotBreak(day, slotIdx);
                                                                    
                                                                    if (isBreak) {
                                                                        if (semIdx === 0) return (
                                                                            <td key={slotIdx} rowSpan={visibleSemesters.length} className="bg-slate-100 border-r border-black p-2 text-center align-middle">
                                                                                <span className="text-[14px] font-black uppercase vertical-text tracking-[0.4em] opacity-30 text-black font-table-content font-sans">REHAT</span>
                                                                            </td>
                                                                        );
                                                                        return null;
                                                                    }
                                                                    
                                                                    let colSpan = 1;
                                                                    if (event && event.duration > 1) {
                                                                        for(let i=1; i<event.duration; i++) { 
                                                                            if(!((slotIdx+i) < timeSlots.length) || isSlotBreak(day, slotIdx+i)) break; 
                                                                            colSpan++; skips.push(slotIdx+i); 
                                                                        }
                                                                    }
                                                                    return (
                                                                        <td key={slotIdx} colSpan={colSpan} className={`p-1 border-r border-black/20 h-32 align-top transition-all ${key === lastUpdatedKey ? 'highlight-new' : ''}`}>
                                                                            <div onClick={() => handleOpenModal(day, sem, slotIdx, event)} className={`h-full w-full rounded-2xl p-2 text-[10px] ${userRole !== 'viewer' ? 'cursor-pointer active:scale-95' : 'cursor-default'} flex flex-col gap-1 overflow-hidden ${event ? (sessionTypes.find(t => t.value === event.type)?.color || 'bg-white border-l-4') : (userRole !== 'viewer' ? 'border-2 border-dashed border-slate-100 hover:border-blue-400 flex items-center justify-center text-slate-200' : 'bg-slate-50/20')}`}>
                                                                                {event ? (
                                                                                    <React.Fragment>
                                                                                        <div className="font-black truncate uppercase text-black border-b border-black/5 pb-1 mb-1 leading-tight text-[11px] font-sans">
                                                                                            {event.courseCode} {
                                                                                                (event.type === 'Kuliah' || event.type === 'Amali') && event.sessionNumber 
                                                                                                ? sessionInitials[event.type].replace(')', `${event.sessionNumber})`) 
                                                                                                : sessionInitials[event.type]
                                                                                            }
                                                                                            {isLocked(event) && <span className="ml-1 text-red-500" title="Dikunci (>24j)"><Icons.Lock /></span>}
                                                                                        </div>
                                                                                        <div className="font-bold line-clamp-3 leading-snug text-slate-800 flex-1 font-sans">{event.topic}</div>
                                                                                        <div className="mt-1 font-black opacity-60 text-[8px] truncate bg-white/60 rounded px-1.5 py-0.5 uppercase text-black leading-none font-sans">{event.instructor}</div>
                                                                                    </React.Fragment>
                                                                                ) : (
                                                                                    userRole !== 'viewer' && <span className="no-print opacity-50"><Icons.Plus /></span>
                                                                                )}
                                                                            </div>
                                                                        </td>
                                                                    );
                                                                })}
                                                            </tr>
                                                        );
                                                    })}
                                                </React.Fragment>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>

                            <div className="p-10 border-t-2 border-black grid grid-cols-2 gap-40 bg-white relative font-sans text-black">
                                <div className="space-y-1 text-black">
                                    <h4 className="text-[12px] font-black text-black uppercase tracking-[0.2em]">DISEDIAKAN OLEH:</h4>
                                    <div className="pt-10 pb-2 border-b border-black flex items-center gap-2">
                                        <span className="text-[11px] font-black text-black uppercase shrink-0 leading-none">NAMA:</span>
                                        <input disabled={userRole === 'viewer'} type="text" value={footerData.preparedName || ''} onChange={e => handleFooterChange('preparedName', e.target.value)} className={`w-full bg-transparent font-black text-sm outline-none text-black uppercase leading-none ${userRole === 'viewer' ? 'cursor-default' : ''}`} />
                                    </div>
                                    <p className="text-[11px] font-black text-black uppercase mt-1 tracking-tight leading-none font-bold">PENGAJAR PENYELARAS</p>
                                    <div className="flex items-center gap-2 pt-4">
                                        <span className="text-[11px] font-black text-black uppercase leading-none">TARIKH:</span>
                                        <input disabled={userRole === 'viewer'} type="date" value={footerData.preparedDate || ''} onChange={e => handleFooterChange('preparedDate', e.target.value)} className={`bg-transparent font-bold text-[11px] outline-none text-black leading-none ${userRole === 'viewer' ? 'cursor-default' : 'cursor-pointer'}`} />
                                    </div>
                                </div>
                                <div className="space-y-1 text-left text-black">
                                    <h4 className="text-[12px] font-black text-black uppercase tracking-[0.2em]">DISAHKAN OLEH:</h4>
                                    <div className="pt-10 pb-2 border-b border-black flex items-center gap-2">
                                        <span className="text-[11px] font-black text-black uppercase shrink-0 leading-none">NAMA:</span>
                                        <input disabled={userRole === 'viewer'} type="text" value={footerData.verifiedName || ''} onChange={e => handleFooterChange('verifiedName', e.target.value)} className={`w-full bg-transparent font-black text-sm outline-none text-black uppercase leading-none ${userRole === 'viewer' ? 'cursor-default' : ''}`} />
                                    </div>
                                    <p className="text-[11px] font-black text-black uppercase mt-1 leading-tight tracking-tight uppercase leading-none font-bold">TIMBALAN PENGARAH AKADEMIK / KETUA PROGRAM</p>
                                    <div className="flex items-center gap-2 pt-4">
                                        <span className="text-[11px] font-black text-black uppercase leading-none">TARIKH:</span>
                                        <input disabled={userRole === 'viewer'} type="date" value={footerData.verifiedDate || ''} onChange={e => handleFooterChange('verifiedDate', e.target.value)} className={`bg-transparent font-bold text-[11px] outline-none text-black leading-none ${userRole === 'viewer' ? 'cursor-default' : 'cursor-pointer'}`} />
                                    </div>
                                </div>
                                <div className="absolute bottom-4 right-8 text-[10px] text-black">
                                    <span className="font-black italic">**Harold Criso Anak Ajin**</span>
                                </div>
                            </div>
                        </div>
                    </main>

                    {isModalOpen && (userRole === 'admin' || userRole === 'superuser') && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm no-print animate-in fade-in duration-300 font-sans">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-xl max-h-[95vh] overflow-hidden border-4 border-blue-600 flex flex-col scale-100">
                                <div className="bg-white px-10 py-6 border-b-2 border-slate-100 flex justify-between items-center shrink-0">
                                    <h3 className="font-black text-lg uppercase text-slate-800 tracking-tight leading-none">KEMAS KINI SLOT</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="bg-red-600 text-white p-3 rounded-2xl hover:rotate-90 transition-all shadow-md active:scale-75"><Icons.X /></button>
                                </div>
                                <div className="p-10 space-y-6 overflow-y-auto flex-1 bg-white">
                                    {userRole === 'admin' && isLocked(editingEvent) && (
                                        <div className="bg-amber-50 p-4 rounded-2xl border-2 border-amber-200 text-amber-800 text-xs font-bold flex items-center gap-3">
                                            <Icons.Lock /> Slot ini telah dikunci (>24j). Sebarang simpanan/padam akan dihantar sebagai permohonan kepada Pentadbir.
                                        </div>
                                    )}
                                    <div className="grid grid-cols-2 gap-6 text-black">
                                        <div className="space-y-1">
                                            <label className="text-[11px] font-black text-slate-400 uppercase leading-none">Kod Kursus</label>
                                            <select className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-black text-sm outline-none cursor-pointer text-black" value={formData.courseCode} onChange={(e) => setFormData({...formData, courseCode: e.target.value})}>
                                                {courseCodes.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[11px] font-black text-slate-400 uppercase leading-none">Bilangan Slot</label>
                                            <select className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-black text-sm outline-none cursor-pointer text-black" value={formData.duration} onChange={(e) => setFormData({...formData, duration: parseInt(e.target.value)})}>
                                                <option value="1">1 Slot</option><option value="2">2 Slot</option><option value="3">3 Slot</option><option value="4">4 Slot</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <label className="text-[11px] font-black uppercase text-slate-400 leading-none tracking-widest">Jenis Sesi</label>
                                        <div className="flex flex-wrap gap-2 text-black">
                                            {sessionTypes.map(t => (
                                                <button key={t.value} onClick={() => setFormData({...formData, type: t.value})} className={`px-5 py-2 rounded-2xl text-[10px] font-black border-2 transition-all ${formData.type === t.value ? t.color + ' border-blue-600 shadow-md scale-105' : 'bg-white border-slate-100 text-slate-400 hover:bg-slate-50'}`}>
                                                    {t.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    {(formData.type === 'Kuliah' || formData.type === 'Amali') && (
                                        <div className="space-y-1 animate-in slide-in-from-top-2 duration-300">
                                            <label className="text-[11px] font-black text-slate-400 uppercase leading-none">Bilangan {formData.type}</label>
                                            <input type="number" min="1" className="w-full px-6 py-4 bg-blue-50/30 border border-blue-200 rounded-2xl font-black text-sm outline-none focus:border-blue-600 text-black" placeholder="Cth: 1" value={formData.sessionNumber || ''} onChange={(e) => setFormData({...formData, sessionNumber: e.target.value})} />
                                        </div>
                                    )}
                                    <div className="space-y-1 text-black">
                                        <label className="text-[11px] font-black text-slate-400 uppercase tracking-widest leading-none">Tajuk Pembelajaran</label>
                                        <textarea rows="3" className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-bold text-sm shadow-sm text-black" placeholder="Topik..." value={formData.topic} onChange={(e) => setFormData({...formData, topic: e.target.value})}></textarea>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[11px] font-black text-slate-400 uppercase tracking-widest leading-none">Nama Pengajar</label>
                                        <select className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-black text-sm shadow-sm cursor-pointer text-black" value={formData.instructor} onChange={(e) => setFormData({...formData, instructor: e.target.value})}>
                                            <option value="">Sila Pilih Pengajar</option>
                                            {instructorList.map(name => <option key={name} value={name}>{name}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="p-10 bg-slate-50 border-t-2 border-slate-100 flex gap-4 shrink-0 shadow-inner">
                                    <button onClick={() => setFormData(prev => ({...prev, topic: '', instructor: '', sessionNumber: ''}))} className="flex-1 py-5 bg-white text-slate-600 text-xs font-black rounded-2xl border border-slate-200 active:scale-90 shadow-sm uppercase leading-none"><Icons.Undo /> Undo</button>
                                    {editingEvent && (
                                        <button 
                                            onClick={handleDelete} 
                                            className={`p-5 rounded-2xl transition-all border-2 flex items-center justify-center shadow-sm ${ (userRole === 'superuser' || !isLocked(editingEvent)) ? 'bg-white text-red-600 border-red-100 hover:bg-red-600 hover:text-white' : 'bg-orange-50 text-orange-600 border-orange-200' }`}
                                            title={(userRole === 'admin' && isLocked(editingEvent)) ? "Mohon Padam" : "Padam"}
                                        >
                                            {userRole === 'admin' && isLocked(editingEvent) ? <span className="text-[8px] font-black">MOHON PADAM</span> : <Icons.Trash />}
                                        </button>
                                    )}
                                    <button onClick={handleSave} disabled={isSaving} className={`flex-[3] py-5 text-white rounded-2xl text-sm font-black hover:opacity-90 active:scale-95 transition-all shadow-xl leading-none uppercase tracking-widest ${userRole === 'admin' && isLocked(editingEvent) ? 'bg-orange-600' : 'bg-blue-600'}`}>
                                        {isSaving ? 'Memproses...' : (userRole === 'admin' && isLocked(editingEvent) ? 'MOHON PINDAAN' : 'SIMPAN REKOD')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL PEMBERITAHUAN PENTADBIR */}
                    {isRequestModalOpen && userRole === 'superuser' && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm no-print animate-in fade-in duration-300">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden border-4 border-red-600 flex flex-col font-sans">
                                <div className="bg-red-50 px-10 py-6 border-b-2 border-red-100 flex justify-between items-center text-black font-sans">
                                    <div className="flex items-center gap-4 text-black">
                                        <Icons.Bell className="text-red-600" />
                                        <h3 className="font-black text-lg uppercase text-red-800 font-sans">Senarai Permohonan Pindaan Slot</h3>
                                    </div>
                                    <button onClick={() => setIsRequestModalOpen(false)} className="bg-white text-red-600 p-2 rounded-xl shadow-md hover:bg-red-600 hover:text-white transition-all"><Icons.X /></button>
                                </div>
                                <div className="p-8 overflow-y-auto flex-1 space-y-4 text-black font-sans">
                                    {Object.keys(changeRequests).length === 0 ? (
                                        <p className="text-center font-bold text-slate-400 py-10">Tiada permohonan baru buat masa ini.</p>
                                    ) : (
                                        Object.entries(changeRequests).map(([key, data]) => (
                                            <div key={key} className="bg-white border-2 border-slate-100 p-6 rounded-3xl shadow-sm flex items-center justify-between gap-6 hover:border-blue-200 transition-all text-black font-sans">
                                                <div className="flex-1 text-black font-sans">
                                                    <div className="flex items-center gap-2 mb-2">
                                                        <span className="px-2 py-0.5 bg-blue-100 text-blue-800 rounded text-[9px] font-black uppercase font-sans">M{selectedWeek}</span>
                                                        <span className="px-2 py-0.5 bg-slate-100 text-slate-800 rounded text-[9px] font-black uppercase font-sans">{data.day} • {data.semester}</span>
                                                        <span className={`px-2 py-0.5 rounded text-[9px] font-black uppercase font-sans ${data.requestType === 'DELETE' ? 'bg-red-100 text-red-600' : 'bg-orange-100 text-orange-600'}`}>{data.requestType}</span>
                                                    </div>
                                                    <p className="text-[11px] font-black text-slate-800 uppercase mb-1 font-sans">{data.courseCode} ({data.type}{data.sessionNumber ? data.sessionNumber : ''})</p>
                                                    <p className="text-xs font-bold text-slate-500 line-clamp-1 mb-1 italic font-sans">"{data.topic}"</p>
                                                    <p className="text-[10px] font-bold text-blue-600 uppercase font-sans">Oleh: {data.instructor}</p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => rejectRequest(key)} className="p-4 bg-slate-100 text-slate-400 hover:bg-red-50 hover:text-red-600 rounded-2xl transition-all" title="Tolak"><Icons.Trash /></button>
                                                    <button onClick={() => approveRequest(key, data)} className="px-6 py-4 bg-green-600 text-white font-black text-xs rounded-2xl hover:bg-green-700 shadow-md flex items-center gap-2 transition-all font-sans"><Icons.Check /> LULUSKAN</button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
