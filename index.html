        const App = () => {
            const firebaseConfig = {
                apiKey: "AIzaSyBOCPBrZ-xkwEgi4OnkBwDB8YqGgWEuMVE",
                authDomain: "jadual-tmp-digital.firebaseapp.com",
                projectId: "jadual-tmp-digital",
                storageBucket: "jadual-tmp-digital.firebasestorage.app",
                messagingSenderId: "716895729119",
                appId: "1:716895729119:web:ca75d33c6e07a177ef006a",
                measurementId: "G-THMTY1YPX8"
            };

            const [user, setUser] = useState(null);
            const [isAuthorized, setIsAuthorized] = useState(() => sessionStorage.getItem('tmp_auth') === 'true');
            const [userRole, setUserRole] = useState(() => sessionStorage.getItem('tmp_role') || null);
            const [accessCode, setAccessCode] = useState("");
            const [loginError, setLoginError] = useState("");
            const [isCloudEnabled, setIsCloudEnabled] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [appId] = useState('tmp-jadual-v26-master');

            const [academicCycle, setAcademicCycle] = useState('A'); 
            const [selectedWeek, setSelectedWeek] = useState(1);
            const [sessionStartDate, setSessionStartDate] = useState('2026-01-05');
            const [academicSession, setAcademicSession] = useState('Januari - Jun');
            const [events, setEvents] = useState({});
            const [courseLimits, setCourseLimits] = useState({}); 
            const [changeRequests, setChangeRequests] = useState({});
            const [footerData, setFooterData] = useState({ preparedName: '', preparedDate: '', verifiedName: '', verifiedDate: '' });
            const [filterSemester, setFilterSemester] = useState('SEMUA');
            const [saturdayConfigs, setSaturdayConfigs] = useState({});

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isRequestModalOpen, setIsRequestModalOpen] = useState(false);
            const [isLimitModalOpen, setIsLimitModalOpen] = useState(false); 
            const [isDashboardOpen, setIsDashboardOpen] = useState(false); // PENAMBAHBAIKAN: Modal Dashboard
            const [editingEvent, setEditingEvent] = useState(null);
            const [lastUpdatedKey, setLastUpdatedKey] = useState(null);
            const [isSaving, setIsSaving] = useState(false);

            const topScrollRef = useRef(null);
            const tableContainerRef = useRef(null);
            const tableElementRef = useRef(null);
            const [tableWidth, setTableWidth] = useState(0);

            const semesters = ['T1SI', 'T1SII', 'T2SI', 'T2SII'];
            const courseCodes = ["MTBT 2114", "MTIM 2013", "MTIB 2022", "MTPE 2064", "MTMM 2043", "MTMM 2053", "MTMM 2153", "MTBC 2032", "MTGC 2074", "MTHE 2103", "MTMS 2082", "MTPC 2133", "MTPC 2122", "MTBT 2193", "MTPC 2203", "MTNF 2162", "MTHE 2182", "MTVS 2142", "GCLE 2042", "CCPS 2012", "CCEH 2022", "GCMP 2022", "CCRM 2013", "GCSF 2013", "Lain-lain"];
            
            const instructorList = [
                "HAROLD CRISO ANAK AJIN", "MAXSION BIN BATUT", "ADELINE BONG HUI FEN", "MOHD SYAHID HARRIS ABDULLAH", 
                "INDRAWATI BINTI AMBO", "HAZLIANA BINTI HAZALI", "HARNIYATIE BINTI MOHAMAD", "AHMAD FAIZAL BIN OTHMAN", 
                "ISSYATUL SOFEA ABDULLAH", "JOCELYN CHAN YUNN NING", "NOOR AYUNIE BINTI MOHAMAD", "LING SIEW LING", 
                "WONG SUK CHIE", "TERRYIE BIN EDDIE", "TERRY ANSLEM RIMPA", "MUHAMMAD IQBAL NA’IM BIN ZAMRI", 
                "NURUL NADIAH BINTI MAZLAN", "HANNA ATHIRAH BINTI AMREE", "RAJA NURUL AMIRAH BINTI RAJA ZAMRI", 
                "NUR AMIESHA BINTI ABDULLAH", "NURHIDATUN BINTI ANNUAR RIGOS", "LESAH BINTI ISMAIL", "LEE GIAP BENG", 
                "JAYANTHI A/P MARIMUTHU", "Lain-lain"
            ];

            const days = ['Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
            const timeSlots = ['8.00 - 9.00', '9.00 - 10.00', '10.00 - 10.30', '10.30 - 11.30', '11.30 - 12.30', '12.30 - 1.00', '1.00 - 2.00', '2.00 - 3.00', '3.00 - 4.00', '4.00 - 5.00'];

            const semesterLabels = { 'T1SI': 'Tahun 1 Semester I', 'T1SII': 'Tahun 1 Semester II', 'T2SI': 'Tahun 2 Semester I', 'T2SII': 'Tahun 2 Semester II' };
            const sessionInitials = { 'Kuliah': '(L)', 'Amali': '(P)', 'IL': '(IL)', 'Tutorial': '(T)', 'CA': '(CA)', 'Ulangkaji': '(UK)', 'Lain-lain': '(LL)' };
            
            const sessionTypes = [
                { label: 'Kuliah (L)', value: 'Kuliah', color: 'bg-blue-50 border-blue-500 text-blue-700' },
                { label: 'Amali (P)', value: 'Amali', color: 'bg-emerald-50 border-emerald-500 text-emerald-700' },
                { label: 'IL (Self Learning)', value: 'IL', color: 'bg-amber-50 border-amber-500 text-amber-700' },
                { label: 'Tutorial (T)', value: 'Tutorial', color: 'bg-purple-50 border-purple-400 text-purple-700' },
                { label: 'CA (Assessment)', value: 'CA', color: 'bg-red-50 border-red-400 text-red-700' },
                { label: 'Ulangkaji', value: 'Ulangkaji', color: 'bg-orange-50 border-orange-400 text-orange-700' },
                { label: 'Lain-lain (LL)', value: 'Lain-lain', color: 'bg-slate-50 border-slate-400 text-slate-700' }
            ];

            const isSlotBreak = (day, slotIdx) => {
                const slot = timeSlots[slotIdx];
                if (slot === '10.00 - 10.30') return true; 
                if (day !== 'Jumaat' && slot === '1.00 - 2.00') return true; 
                if (day === 'Jumaat') return [5, 6].includes(slotIdx); 
                return false;
            };

            const sessionOptions = useMemo(() => academicCycle === 'A' ? ['Januari - Jun', 'Julai - Disember'] : ['Oktober - Mac', 'April - September'], [academicCycle]);

            useEffect(() => { setAcademicSession(sessionOptions[0]); }, [academicCycle, sessionOptions]);

            const weekStatus = useMemo(() => {
                if (selectedWeek === 10) return "CUTI PERTENGAHAN SEMESTER";
                if ([21, 22, 23].includes(selectedWeek)) return "MINGGU PEPERIKSAAN";
                if ([24, 25, 26].includes(selectedWeek)) return "CUTI AKHIR SEMESTER";
                return "NORMAL";
            }, [selectedWeek]);

            const currentWeekHasSaturday = useMemo(() => saturdayConfigs[`${academicCycle}-${selectedWeek}`] === true, [saturdayConfigs, selectedWeek, academicCycle]);
            const visibleDays = useMemo(() => currentWeekHasSaturday ? days : days.slice(0, 5), [currentWeekHasSaturday]);

            const getDisplayDateForDay = (dayIdx) => {
                const start = new Date(sessionStartDate);
                start.setDate(start.getDate() + (selectedWeek - 1) * 7 + dayIdx);
                return start.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
            };

            const autoWeekRange = useMemo(() => {
                const start = new Date(sessionStartDate);
                start.setDate(start.getDate() + (selectedWeek - 1) * 7);
                const end = new Date(start);
                end.setDate(start.getDate() + (currentWeekHasSaturday ? 5 : 4));
                return `${start.toLocaleDateString('en-GB')} - ${end.toLocaleDateString('en-GB')}`;
            }, [sessionStartDate, selectedWeek, currentWeekHasSaturday]);

            const currentYear = new Date().getFullYear();
            const displayAcademicSession = useMemo(() => {
                if (academicSession === 'Oktober - Mac') return `Oktober ${currentYear} - Mac ${currentYear + 1}`;
                return `${academicSession} ${currentYear}`;
            }, [academicSession, currentYear]);

            const [formData, setFormData] = useState({ id: '', day: '', timeSlotIndex: 0, courseCode: 'MTBT 2114', customCourseCode: '', topic: '', type: 'Kuliah', instructor: '', semester: '', duration: 1, sessionNumber: '' });

            // FIREBASE REALTIME SYNC
            useEffect(() => {
                if (!isAuthorized || !isCloudEnabled || !user) return;
                const db = firebase.firestore();
                setIsSyncing(true);
                const unsubEvents = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_cycle_${academicCycle}`)
                    .onSnapshot((snap) => {
                        const data = {}; snap.forEach(doc => { data[doc.id] = doc.data(); });
                        setEvents(data); setIsSyncing(false);
                    }, () => setIsSyncing(false));
                
                const unsubReq = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('change_requests')
                    .onSnapshot((snap) => {
                        const data = {}; snap.forEach(doc => { data[doc.id] = doc.data(); });
                        setChangeRequests(data);
                    });

                const unsubFooter = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_meta_${academicCycle}`).doc('signatures')
                    .onSnapshot((doc) => { if (doc.exists) setFooterData(doc.data()); });
                
                const unsubSat = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('jadual_meta_shared').doc('saturday_configs')
                    .onSnapshot((doc) => { if (doc.exists) setSaturdayConfigs(doc.data()); });

                const unsubLimits = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('jadual_meta_shared').doc('course_limits')
                    .onSnapshot((doc) => { if (doc.exists) setCourseLimits(doc.data()); });

                return () => { unsubEvents(); unsubReq(); unsubFooter(); unsubSat(); unsubLimits(); };
            }, [user, isAuthorized, isCloudEnabled, appId, academicCycle]);

            useEffect(() => {
                const initFirebase = async () => {
                    if (!firebase.apps.length) {
                        try {
                            firebase.initializeApp(firebaseConfig);
                            const cred = await firebase.auth().signInAnonymously();
                            setUser(cred.user); setIsCloudEnabled(true);
                        } catch (e) { loadLocalData(); }
                    }
                };
                initFirebase();
            }, []);

            const isLocked = (event) => {
                if (!event || !event.lastUpdate) return false;
                const ONE_DAY = 24 * 60 * 60 * 1000;
                return (Date.now() - event.lastUpdate) > ONE_DAY;
            };

            const getCourseSemesterCount = (courseCode) => {
                const cleanCode = courseCode === 'Lain-lain' ? formData.customCourseCode : courseCode;
                if (!cleanCode) return 0;
                return Object.values(events).filter(ev => 
                    ev.courseCode === cleanCode && 
                    ev.session === academicSession && 
                    ev.cycle === academicCycle
                ).length;
            };

            // PENAMBAHBAIKAN: Logik Dashboard Analitik
            const dashboardData = useMemo(() => {
                const courseSummary = {};
                const instructorSummary = {};
                
                // Hanya proses data yang berada dalam Kitaran Akademik dan Sesi semasa
                const currentSessionEvents = Object.values(events).filter(ev => 
                    ev.session === academicSession && ev.cycle === academicCycle
                );

                currentSessionEvents.forEach(ev => {
                    const hours = parseInt(ev.duration || 1);
                    const type = ev.type || 'Lain-lain';
                    const course = ev.courseCode || 'Unknown';
                    const instructor = ev.instructor || 'Unknown';

                    // Aggregate per Course
                    if (!courseSummary[course]) {
                        courseSummary[course] = { total: 0, Kuliah: 0, Amali: 0, Tutorial: 0, CA: 0, Ulangkaji: 0, IL: 0, 'Lain-lain': 0 };
                    }
                    courseSummary[course].total += hours;
                    courseSummary[course][type] = (courseSummary[course][type] || 0) + hours;

                    // Aggregate per Instructor
                    if (!instructorSummary[instructor]) {
                        instructorSummary[instructor] = { total: 0, Kuliah: 0, Amali: 0, Tutorial: 0, CA: 0, Ulangkaji: 0, IL: 0, 'Lain-lain': 0 };
                    }
                    instructorSummary[instructor].total += hours;
                    instructorSummary[instructor][type] = (instructorSummary[instructor][type] || 0) + hours;
                });

                return { courseSummary, instructorSummary };
            }, [events, academicSession, academicCycle]);

            const handleSave = async () => {
                if (isSaving || userRole === 'viewer') return;
                const finalCode = formData.courseCode === 'Lain-lain' ? formData.customCourseCode : formData.courseCode;
                if (userRole === 'admin') {
                    const currentSemesterCount = Object.values(events).filter(ev => 
                        ev.courseCode === finalCode && ev.session === academicSession && ev.cycle === academicCycle && ev.id !== formData.id
                    ).length;
                    const limit = courseLimits[finalCode] || 999;
                    if (currentSemesterCount >= limit) {
                        alert(`Ralat: Agihan hari bagi kursus ${finalCode} telah mencapai had maksimum (${limit}) bagi SEMESTER ini.`);
                        return;
                    }
                }
                setIsSaving(true);
                const key = `${academicSession}-${selectedWeek}-${formData.day}-${formData.semester}-${formData.timeSlotIndex}`;
                const data = { ...formData, courseCode: finalCode, cycle: academicCycle, session: academicSession, lastUpdate: editingEvent?.lastUpdate || Date.now(), selectedWeek };
                try {
                    const db = firebase.firestore();
                    if (userRole === 'admin' && isLocked(editingEvent)) {
                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('change_requests').doc(key).set({...data, requestType: 'EDIT'});
                        alert("Slot terkunci (>24j). Permohonan pindaan dihantar kepada Pentadbir Sistem.");
                    } else {
                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_cycle_${academicCycle}`).doc(key).set(data);
                    }
                    setIsModalOpen(false);
                } catch (e) { alert("Ralat simpan."); } finally { setIsSaving(false); }
            };

            const handleDelete = async () => {
                if (isSaving || !editingEvent || userRole === 'viewer') return;
                const key = `${academicSession}-${selectedWeek}-${formData.day}-${formData.semester}-${formData.timeSlotIndex}`;
                const db = firebase.firestore();
                if (userRole === 'superuser') {
                    if (!confirm("Padam slot ini secara kekal?")) return;
                    try {
                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_cycle_${academicCycle}`).doc(key).delete();
                        setIsModalOpen(false);
                    } catch (e) { alert("Gagal memadam."); }
                } else if (userRole === 'admin') {
                    if (isLocked(editingEvent)) {
                        if (!confirm("Slot telah melebihi 24 jam. Hantar permohonan PADAM kepada Pentadbir?")) return;
                        try {
                            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('change_requests').doc(key).set({...editingEvent, requestType: 'DELETE'});
                            alert("Permohonan memadam telah dihantar.");
                            setIsModalOpen(false);
                        } catch (e) { alert("Ralat menghantar permohonan."); }
                    } else {
                        if (!confirm("Padam slot ini?")) { try { await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_cycle_${academicCycle}`).doc(key).delete(); setIsModalOpen(false); } catch (e) { alert("Gagal memadam."); } }
                    }
                }
            };

            const approveRequest = async (reqKey, reqData) => {
                const db = firebase.firestore();
                try {
                    if (reqData.requestType === 'DELETE') { await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_cycle_${reqData.cycle}`).doc(reqKey).delete(); }
                    else { const cleanData = { ...reqData }; delete cleanData.requestType; await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(`jadual_cycle_${reqData.cycle}`).doc(reqKey).set(cleanData); }
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('change_requests').doc(reqKey).delete();
                } catch (e) { alert("Gagal meluluskan."); }
            };

                                                                    const event = events[key];
                                                                    const isBreak = isSlotBreak(day, slotIdx);

                                                                    }

                                                            <td className="p-4 border-b border-slate-50">{dashboardData.instructorSummary[name].Tutorial} jam</td>
                                                            <td className="p-4 border-b border-slate-50">{dashboardData.instructorSummary[name].CA} jam</td>
                                                            <td className="p-4 border-b border-slate-50">{dashboardData.instructorSummary[name]['Lain-lain']} jam</td>
                                                            <td className="p-4 border-b border-slate-50 font-black text-emerald-700 bg-emerald-50/30">{dashboardData.instructorSummary[name].total} JAM</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </section>
                                </div>
                                <div className="p-6 bg-slate-50 border-t border-slate-100 text-center">
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">** Analitik ini dijana secara automatik berdasarkan data kitaran semasa sahaja **</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL LAIN (LIMIT & EDITOR) TETAP SAMA */}
                    {isModalOpen && (userRole === 'admin' || userRole === 'superuser') && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm no-print animate-in fade-in duration-300 font-sans text-black">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-xl max-h-[95vh] overflow-hidden border-4 border-blue-600 flex flex-col scale-100">
                                <div className="bg-white px-10 py-6 border-b-2 border-slate-100 flex justify-between items-center shrink-0">
                                    <h3 className="font-black text-lg uppercase text-slate-800 tracking-tight leading-none font-sans text-black">KEMAS KINI SLOT</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="bg-red-600 text-white p-3 rounded-2xl hover:rotate-90 transition-all shadow-md active:scale-75"><Icons.X /></button>
                                </div>
                                <div className="p-10 space-y-6 overflow-y-auto flex-1 bg-white">
                                    {userRole === 'admin' && isLocked(editingEvent) && (
                                        <div className="bg-amber-50 p-4 rounded-2xl border-2 border-amber-200 text-amber-800 text-xs font-bold flex items-center gap-3">
                                            <Icons.Lock /> Slot ini telah dikunci (>24j). Sebarang simpanan/padam akan dihantar sebagai permohonan kepada Pentadbir.
                                        </div>
                                    )}
                                    <div className="grid grid-cols-2 gap-6 text-black font-bold">
                                        <div className="space-y-1">
                                            <label className="text-[11px] font-black text-slate-400 uppercase leading-none">Kod Kursus</label>
                                            <select className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-black text-sm outline-none cursor-pointer text-black" value={formData.courseCode} onChange={(e) => setFormData({...formData, courseCode: e.target.value})}>
                                                {courseCodes.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                            {formData.courseCode !== 'Lain-lain' && (
                                                <div className={`mt-2 flex items-center gap-2 px-3 py-1.5 rounded-xl border ${getCourseSemesterCount(formData.courseCode) >= (courseLimits[formData.courseCode] || 999) ? 'bg-red-50 border-red-200 text-red-600' : 'bg-indigo-50 border-indigo-200 text-indigo-700'}`}>
                                                    <Icons.Info /> <span className="text-[9px] font-black uppercase tracking-tighter text-black">Agihan Semester: {getCourseSemesterCount(formData.courseCode)} / {courseLimits[formData.courseCode] || '∞'}</span>
                                                </div>
                                            )}
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[11px] font-black text-slate-400 uppercase leading-none font-sans">Bilangan Slot</label>
                                            <select className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-black text-sm outline-none cursor-pointer text-black" value={formData.duration} onChange={(e) => setFormData({...formData, duration: parseInt(e.target.value)})}>
                                                <option value="1">1 Slot</option><option value="2">2 Slot</option><option value="3">3 Slot</option><option value="4">4 Slot</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="space-y-3 font-sans">
                                        <label className="text-[11px] font-black uppercase text-slate-400 leading-none tracking-widest text-black">Jenis Sesi</label>
                                        <div className="flex flex-wrap gap-2">
                                            {sessionTypes.map(t => ( <button key={t.value} onClick={() => setFormData({...formData, type: t.value})} className={`px-5 py-2 rounded-2xl text-[10px] font-black border-2 transition-all ${formData.type === t.value ? t.color + ' border-blue-600 shadow-md scale-105' : 'bg-white border-slate-100 text-slate-400 hover:bg-slate-50'}`}> {t.label} </button> ))}
                                        </div>
                                    </div>
                                    {(formData.type === 'Kuliah' || formData.type === 'Amali') && (
                                        <div className="space-y-1 animate-in slide-in-from-top-2 duration-300">
                                            <label className="text-[11px] font-black text-slate-400 uppercase leading-none text-black">Bilangan {formData.type}</label>
                                            <input type="number" min="1" className="w-full px-6 py-4 bg-blue-50/30 border border-blue-200 rounded-2xl font-black text-sm outline-none focus:border-blue-600 text-black font-bold" placeholder="Cth: 1" value={formData.sessionNumber || ''} onChange={(e) => setFormData({...formData, sessionNumber: e.target.value})} />
                                        </div>
                                    )}
                                    <div className="space-y-1">
                                        <label className="text-[11px] font-black text-slate-400 uppercase tracking-widest leading-none font-sans text-black">Tajuk Pembelajaran</label>
                                        <textarea rows="3" className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-bold text-sm shadow-sm text-black" placeholder="Topik..." value={formData.topic} onChange={(e) => setFormData({...formData, topic: e.target.value})}></textarea>
                                    </div>
                                    <div className="space-y-1 text-black">
                                        <label className="text-[11px] font-black text-slate-400 uppercase tracking-widest leading-none text-black">Nama Pengajar</label>
                                        <select className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-black text-sm shadow-sm cursor-pointer text-black font-bold" value={formData.instructor} onChange={(e) => setFormData({...formData, instructor: e.target.value})}>
                                            <option value="">Sila Pilih Pengajar</option>
                                            {instructorList.map(name => <option key={name} value={name}>{name}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="p-10 bg-slate-50 border-t-2 border-slate-100 flex gap-4 shrink-0 shadow-inner">
                                    <button onClick={() => setFormData(prev => ({...prev, topic: '', instructor: '', sessionNumber: ''}))} className="flex-1 py-5 bg-white text-slate-600 text-xs font-black rounded-2xl border border-slate-200 active:scale-90 shadow-sm uppercase leading-none font-sans"><Icons.Undo /> Undo</button>
                                    {editingEvent && ( <button onClick={handleDelete} className={`p-5 rounded-2xl transition-all border-2 flex items-center justify-center shadow-sm ${ (userRole === 'superuser' || !isLocked(editingEvent)) ? 'bg-white text-red-600 border-red-100 hover:bg-red-600 hover:text-white' : 'bg-orange-50 text-orange-600 border-orange-200' }`} title={(userRole === 'admin' && isLocked(editingEvent)) ? "Mohon Padam" : "Padam"}> {userRole === 'admin' && isLocked(editingEvent) ? <span className="text-[8px] font-black">MOHON PADAM</span> : <Icons.Trash />} </button> )}
                                    <button onClick={handleSave} disabled={isSaving} className={`flex-[3] py-5 bg-blue-600 text-white rounded-2xl text-sm font-black hover:bg-blue-700 active:scale-95 transition-all shadow-xl leading-none uppercase tracking-widest font-sans text-black`}>{isSaving ? 'Menyimpan...' : (userRole === 'admin' && isLocked(editingEvent) ? 'MOHON PINDAAN' : 'SIMPAN REKOD')}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL PEMBERITAHUAN PENTADBIR */}
                    {isRequestModalOpen && userRole === 'superuser' && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm no-print animate-in fade-in duration-300">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden border-4 border-red-600 flex flex-col font-sans text-black">
                                <div className="bg-red-50 px-10 py-6 border-b-2 border-red-100 flex justify-between items-center text-black">
                                    <div className="flex items-center gap-4 text-black"> <Icons.Bell className="text-red-600" /> <h3 className="font-black text-lg uppercase text-red-800">Senarai Permohonan Pindaan Slot</h3> </div>
                                    <button onClick={() => setIsRequestModalOpen(false)} className="bg-white text-red-600 p-2 rounded-xl shadow-md hover:bg-red-600 hover:text-white transition-all"><Icons.X /></button>
                                </div>
                                <div className="p-8 overflow-y-auto flex-1 space-y-4 text-black font-sans">
                                    {Object.keys(changeRequests).length === 0 ? ( <p className="text-center font-bold text-slate-400 py-10 font-sans">Tiada permohonan baru buat masa ini.</p> ) : ( Object.entries(changeRequests).map(([key, data]) => ( <div key={key} className="bg-white border-2 border-slate-100 p-6 rounded-3xl shadow-sm flex items-center justify-between gap-6 hover:border-blue-200 transition-all text-black font-sans"> <div className="flex-1"> <div className="flex items-center gap-2 mb-2"> <span className="px-2 py-0.5 bg-blue-100 text-blue-800 rounded text-[9px] font-black uppercase">M{data.selectedWeek}</span> <span className="px-2 py-0.5 bg-slate-100 text-slate-800 rounded text-[9px] font-black uppercase font-sans text-black">{data.day} • {data.semester}</span> <span className={`px-2 py-0.5 rounded text-[9px] font-black uppercase ${data.requestType === 'DELETE' ? 'bg-red-100 text-red-600' : 'bg-orange-100 text-orange-600'}`}>{data.requestType}</span> </div> <p className="text-[11px] font-black text-slate-800 uppercase mb-1">{data.courseCode} ({data.type}{data.sessionNumber ? data.sessionNumber : ''})</p> <p className="text-xs font-bold text-slate-500 line-clamp-1 mb-1 italic">"{data.topic}"</p> <p className="text-[10px] font-bold text-blue-600 uppercase">Oleh: {data.instructor}</p> </div> <div className="flex gap-2"> <button onClick={() => rejectRequest(key)} className="p-4 bg-slate-100 text-slate-400 hover:bg-red-50 hover:text-red-600 rounded-2xl transition-all" title="Tolak"><Icons.Trash /></button> <button onClick={() => approveRequest(key, data)} className="px-6 py-4 bg-green-600 text-white font-black text-xs rounded-2xl hover:bg-green-700 shadow-md flex items-center gap-2 transition-all font-sans"><Icons.Check /> LULUSKAN</button> </div> </div> )) )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL HAD AGIHAN KURSUS (Superuser Only) */}
                    {isLimitModalOpen && userRole === 'superuser' && (
                        <div className="fixed inset-0 z-[400] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm no-print animate-in fade-in duration-300">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden border-4 border-indigo-600 flex flex-col font-sans text-black">
                                <div className="bg-indigo-50 px-10 py-6 border-b-2 border-indigo-100 flex justify-between items-center">
                                    <div className="flex items-center gap-4 text-black"> <Icons.Settings className="text-indigo-600" /> <h3 className="font-black text-lg uppercase text-indigo-800">Had Agihan Semester (Setiap Kursus)</h3> </div>
                                    <button onClick={() => setIsLimitModalOpen(false)} className="bg-white text-indigo-600 p-2 rounded-xl shadow-md hover:bg-indigo-600 hover:text-white transition-all"><Icons.X /></button>
                                </div>
                                <div className="p-8 overflow-y-auto flex-1 space-y-3">
                                    <div className="bg-amber-50 p-4 rounded-2xl text-[10px] font-bold text-amber-800 border border-amber-200 mb-4 font-sans text-black"> Tetapkan bilangan hari/slot maksimum bagi setiap kod kursus merentasi SATU SEMESTER (semua minggu). </div>
                                    <div className="grid grid-cols-2 gap-4 text-black">
                                        {courseCodes.filter(c => c !== 'Lain-lain').map(code => ( <div key={code} className="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100 text-black"> <span className="text-[11px] font-black text-slate-700">{code}</span> <input type="number" min="0" className="w-16 px-3 py-2 rounded-xl border border-slate-200 font-black text-center text-sm text-black font-bold" value={courseLimits[code] || 0} onChange={(e) => setCourseLimits({...courseLimits, [code]: parseInt(e.target.value) || 0})} /> </div> ))}
                                    </div>
                                </div>
                                <div className="p-8 bg-slate-50 border-t border-slate-100">
                                    <button onClick={() => saveLimits(courseLimits)} className="w-full py-5 bg-indigo-600 text-white rounded-[2rem] font-black uppercase tracking-widest shadow-xl hover:bg-indigo-700 active:scale-95 transition-all font-sans" > SIMPAN HAD SEMESTER </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
