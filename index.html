<html lang="ms">
<head>
    <meta charset="UTF-8">

    <title>Jadual Waktu Mingguan TMP Digital v11.3</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @media print {
            @page { size: landscape; margin: 0.5cm; }
            .no-print { display: none !important; }
            body { background: white !important; padding: 0; margin: 0; font-family: 'Times New Roman', serif; color: black !important; }

            .freeze-container { overflow: visible !important; max-height: none !important; border: none !important; display: block !important; }

            th, td { border: 1px solid black !important; background: white !important; color: black !important; }
            .rounded-3xl, .rounded-[3.5rem], .rounded-2xl { border-radius: 0 !important; }
            input, select, textarea { border: none !important; background: transparent !important; color: black !important; appearance: none; }
            thead, .table-to-scroll thead th { position: static !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        
        .vertical-text { writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg); display: inline-block; }
        @keyframes high-visibility-flash { 0% { background-color: #3b82f6; color: white; } 100% { background-color: transparent; } }
        .highlight-new { animation: high-visibility-flash 2.5s ease-out forwards; }
        
        @keyframes search-pulse {
            0% { box-shadow: 0 0 0 0px rgba(59, 130, 246, 0.7); border-color: #3b82f6; }
            50% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); border-color: #2563eb; }
            100% { box-shadow: 0 0 0 0px rgba(59, 130, 246, 0); border-color: #3b82f6; }

        .search-match { 
            animation: search-pulse 2s infinite; 
            border: 3px solid #3b82f6 !important;
            background-color: #eff6ff !important;
        }

        .sync-scroll-container { 
            overflow-x: auto; 
            overflow-y: hidden; 
            height: 14px; 
            background: #f1f5f9;
            border-radius: 10px;
            margin-bottom: 4px;
        }
        .sync-scroll-container::-webkit-scrollbar { height: 8px; }
        .sync-scroll-container::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }

        .table-to-scroll thead th { position: sticky; top: 0; z-index: 50; background: #f8fafc !important; box-shadow: inset 0 -2px 0 #000; }
        .freeze-container { max-height: calc(100vh - 280px); overflow: auto; border: 2px solid black; background: white; }
    </style>
</head>
<body class="bg-white min-h-screen text-black">
    <div id="root"></div>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (Empty strings will be filled by the environment)
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tmp-jadual-v26-master';

        window.TMP_DB = { db, auth, appId, setDoc, doc, collection, onSnapshot, onAuthStateChanged, signInAnonymously, signOut, query };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icons = {
            Plus: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            X: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Undo: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-15 9 9 0 0 0-8.31 5.5"></path></svg>,
            Save: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1-2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
            Lock: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            External: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1-2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>,
            User: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
            Bell: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>,
            Check: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Settings: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1-2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Info: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>,
            Chart: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>,
            Printer: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>,
            Search: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        };

        const App = () => {
            // --- 1. STATES ---
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [userRole, setUserRole] = useState(null);
            const [user, setUser] = useState(null);
            const [accessCode, setAccessCode] = useState("");
            const [loginError, setLoginError] = useState("");
            const [academicCycle, setAcademicCycle] = useState('A'); 
            const [selectedWeek, setSelectedWeek] = useState(1);
            const [sessionStartDate, setSessionStartDate] = useState('2026-01-05');
            const [academicSession, setAcademicSession] = useState('Januari - Jun');
            const [events, setEvents] = useState({});
            const [courseLimits, setCourseLimits] = useState({}); 
            const [changeRequests, setChangeRequests] = useState({});
            const [footerData, setFooterData] = useState({ preparedName: '', preparedDate: '', verifiedName: '', verifiedDate: '' });
            const [filterSemester, setFilterSemester] = useState('SEMUA');
            const [saturdayConfigs, setSaturdayConfigs] = useState({});
            const [searchTerm, setSearchTerm] = useState("");
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isDashboardOpen, setIsDashboardOpen] = useState(false);
            const [isLimitModalOpen, setIsLimitModalOpen] = useState(false);
            const [isRequestModalOpen, setIsRequestModalOpen] = useState(false);
            const [editingEvent, setEditingEvent] = useState(null);
            const [lastUpdatedKey, setLastUpdatedKey] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [formData, setFormData] = useState({ id: '', day: '', timeSlotIndex: 0, courseCode: 'MTBT 2114', customCourseCode: '', topic: '', type: 'Kuliah', instructor: '', semester: '', duration: 1, sessionNumber: '' });
            const [tableWidth, setTableWidth] = useState(0);

            const topScrollRef = useRef(null);
            const tableContainerRef = useRef(null);
            const tableElementRef = useRef(null);

            // --- 2. CONSTANTS ---
            const timeSlots = ['8.00 - 9.00', '9.00 - 10.00', '10.00 - 10.30', '10.30 - 11.30', '11.30 - 12.30', '12.30 - 1.00', '1.00 - 2.00', '2.00 - 3.00', '3.00 - 4.00', '4.00 - 5.00'];
            const semesters = ['T1SI', 'T1SII', 'T2SI', 'T2SII'];
            const instructorList = ["HAROLD CRISO ANAK AJIN", "MAXSION BIN BATUT", "ADELINE BONG HUI FEN", "MOHD SYAHID HARRIS ABDULLAH", "INDRAWATI BINTI AMBO", "HAZLIANA BINTI HAZALI", "HARNIYATIE BINTI MOHAMAD", "AHMAD FAIZAL BIN OTHMAN", "ISSYATUL SOFEA ABDULLAH", "JOCELYN CHAN YUNN NING", "NOOR AYUNIE BINTI MOHAMAD", "LING SIEW LING", "WONG SUK CHIE", "TERRYIE BIN EDDIE", "TERRY ANSLEM RIMPA", "MUHAMMAD IQBAL NA’IM BIN ZAMRI", "NURUL NADIAH BINTI MAZLAN", "HANNA ATHIRAH BINTI AMREE", "RAJA NURUL AMIRAH BINTI RAJA ZAMRI", "NUR AMIESHA BINTI ABDULLAH", "NURHIDATUN BINTI ANNUAR RIGOS", "LESAH BINTI ISMAIL", "LEE GIAP BENG", "JAYANTHI A/P MARIMUTHU", "Lain-lain"];
            const courseCodes = ["MTBT 2114", "MTIM 2013", "MTIB 2022", "MTPE 2064", "MTMM 2043", "MTMM 2053", "MTMM 2153", "MTBC 2032", "MTBC 2114", "MTGC 2074", "MTHE 2103", "MTMS 2082", "MTPC 2133", "MTPC 2122", "MTBT 2193", "MTPC 2203", "MTNF 2162", "MTHE 2182", "MTVS 2142", "GCLE 2042", "CCPS 2012", "CCEH 2022", "GCMP 2022", "CCRM 2013", "GCSF 2013", "Lain-lain"];
            const sessionInitials = { 'Kuliah': '(L)', 'Amali': '(P)', 'IL': '(IL)', 'Tutorial': '(T)', 'CA': '(CA)', 'Ulangkaji': '(UK)', 'Lain-lain': '(LL)' };
            const semesterLabels = { 'T1SI': 'Tahun 1 Semester I', 'T1SII': 'Tahun 1 Semester II', 'T2SI': 'Tahun 2 Semester I', 'T2SII': 'Tahun 2 Semester II' };
            const sessionTypes = [
                { label: 'Kuliah (L)', value: 'Kuliah', color: 'bg-blue-50 border-blue-500 text-blue-700' },
                { label: 'Amali (P)', value: 'Amali', color: 'bg-emerald-50 border-emerald-500 text-emerald-700' },
                { label: 'IL (Self Learning)', value: 'IL', color: 'bg-amber-50 border-amber-500 text-amber-700' },
                { label: 'Tutorial (T)', value: 'Tutorial', color: 'bg-purple-50 border-purple-400 text-purple-700' },
                { label: 'CA (Assessment)', value: 'CA', color: 'bg-red-50 border-red-400 text-red-700' },
                { label: 'Ulangkaji', value: 'Ulangkaji', color: 'bg-orange-50 border-orange-400 text-orange-700' },
                { label: 'Lain-lain (LL)', value: 'Lain-lain', color: 'bg-slate-50 border-slate-400 text-slate-700' }
            ];
            const days = ['Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];

            // --- 3. LOGIC FUNCTIONS ---

            const isSlotBreak = (day, slotIdx) => {
                const slot = timeSlots[slotIdx];
                if (slot === '10.00 - 10.30') return true; 
                if (day !== 'Jumaat' && slot === '1.00 - 2.00') return true; 
                if (day === 'Jumaat') return [4, 5, 6].includes(slotIdx); 
                return false;
            };

            const isLocked = (event) => {
                if (!event || !event.lastUpdate) return false;
                return (Date.now() - event.lastUpdate) > (24 * 60 * 60 * 1000);
            };

            const handleLogout = () => {
                sessionStorage.clear();
                localStorage.clear();
                if (window.TMP_DB) window.TMP_DB.signOut(window.TMP_DB.auth).catch(() => {});
                setIsAuthorized(false);
                setUserRole(null);
                window.location.reload(); 
            };

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                setLoginError("");
                const code = accessCode.trim();
                if(code === "ADMIN2026"){ 
                    setIsAuthorized(true); setUserRole('superuser'); 
                    sessionStorage.setItem('tmp_auth', 'true'); sessionStorage.setItem('tmp_role', 'superuser');
                } else if (code === "DTMP2026") {
                    setIsAuthorized(true); setUserRole('admin'); 
                    sessionStorage.setItem('tmp_auth', 'true'); sessionStorage.setItem('tmp_role', 'admin');
                } else if (code === "JTMP2026") {
                    setIsAuthorized(true); setUserRole('viewer'); 
                    sessionStorage.setItem('tmp_auth', 'true'); sessionStorage.setItem('tmp_role', 'viewer');
                } else { 
                    setLoginError("Kod Akses Salah");
                }
            };

            const getCourseSemesterCount = (courseCode) => {
                if (!courseCode) return 0;
                return Object.values(events).filter(ev => 
                    ev.courseCode === courseCode && ev.session === academicSession && ev.cycle === academicCycle
                ).length;
            };

            const handleSave = async () => {
                if (isSaving || userRole === 'viewer' || !window.TMP_DB) return;
                const finalCode = formData.courseCode === 'Lain-lain' ? formData.customCourseCode : formData.courseCode;
                if (userRole === 'admin') {
                    const currentCount = getCourseSemesterCount(finalCode);
                    const limit = courseLimits[finalCode] || 999;
                    if (currentCount >= limit && !editingEvent) {
                        alert(`Ralat: Had agihan (${limit}) semester bagi ${finalCode} telah dicapai.`);
                        return;
                    }
                }
                setIsSaving(true);
                const key = `${academicSession}-${selectedWeek}-${formData.day}-${formData.semester}-${formData.timeSlotIndex}`;
                const data = { ...formData, courseCode: finalCode, cycle: academicCycle, session: academicSession, lastUpdate: editingEvent?.lastUpdate || Date.now(), selectedWeek };
                try {
                    const { db, appId, doc, setDoc } = window.TMP_DB;
                    if (userRole === 'admin' && isLocked(editingEvent)) {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'change_requests', key), {...data, requestType: 'EDIT'});
                        alert("Slot terkunci (>24j). Permohonan pindaan dihantar.");
                    } else {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', `jadual_cycle_${academicCycle}`, key), data);
                    }
                    setIsModalOpen(false);
                } catch (e) { alert("Ralat simpan."); } finally { setIsSaving(false); }
            };

            const handleOpenModal = (day, sem, slotIdx, event = null) => {
                if (isSlotBreak(day, slotIdx) || userRole === 'viewer') return;
                if (event) {
                    setFormData({ ...event, customCourseCode: courseCodes.includes(event.courseCode) ? '' : event.courseCode });
                    setEditingEvent(event);
                } else {
                    setFormData({ id: Math.random().toString(36).substr(2, 9), day, semester: sem, timeSlotIndex: slotIdx, courseCode: courseCodes[0], customCourseCode: '', topic: '', type: 'Kuliah', instructor: '', duration: 1 });
                    setEditingEvent(null);
                }
                setIsModalOpen(true);
            };

            const handleFooterChange = async (field, val) => {
                if (userRole === 'viewer' || !window.TMP_DB) return;
                const next = { ...footerData, [field]: val };
                setFooterData(next);
                const { db, appId, doc, setDoc } = window.TMP_DB;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', `jadual_meta_${academicCycle}`, 'signatures'), next);
            };

            // --- 4. MEMOIZED ---
            const currentSessionAcademic = useMemo(() => {
                const yr = new Date().getFullYear();
                return academicSession === 'Oktober - Mac' ? `Oktober ${yr} - Mac ${yr + 1}` : `${academicSession} ${yr}`;
            }, [academicSession]);

            const dashboardData = useMemo(() => {
                const courseSum = {}, instructorSum = {};
                Object.values(events).filter(ev => ev.session === academicSession && ev.cycle === academicCycle && ev.courseCode && ev.courseCode.trim() !== "" && ev.courseCode !== "Lain-lain").forEach(ev => {
                    const hours = parseInt(ev.duration || 1);
                    const course = ev.courseCode;
                    const instructor = ev.instructor || 'Tidak Dinamakan';
                    if(!courseSum[course]) courseSum[course] = { total: 0, Kuliah: 0, Amali: 0, Tutorial: 0 };
                    courseSum[course].total += hours; 
                    if(ev.type in courseSum[course]) courseSum[course][ev.type] += hours;
                    if(!instructorSum[instructor]) instructorSum[instructor] = { total: 0 };
                    instructorSum[instructor].total += hours;
                });
                return { courseSum, instructorSum };
            }, [events, academicSession, academicCycle]);

            // --- 5. EFFECTS ---
            useEffect(() => {
                const savedAuth = sessionStorage.getItem('tmp_auth');
                const savedRole = sessionStorage.getItem('tmp_role');
                if (savedAuth === 'true' && savedRole) { setIsAuthorized(true); setUserRole(savedRole); }
            }, []);

            useEffect(() => {
                if (!isAuthorized || !window.TMP_DB) return;
                const { db, auth, appId, collection, onSnapshot, onAuthStateChanged, signInAnonymously } = window.TMP_DB;
                const unsubAuth = onAuthStateChanged(auth, (u) => { if(!u) signInAnonymously(auth); setUser(u); });
                const unsubEv = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', `jadual_cycle_${academicCycle}`), (s) => {
                    const d = {}; s.forEach(doc => { d[doc.id] = doc.data(); }); setEvents(d);
                });
                const unsubLim = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'jadual_meta_shared', 'course_limits'), (d) => {
                    if(d.exists()) setCourseLimits(d.data());
                });
                const unsubSig = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', `jadual_meta_${academicCycle}`, 'signatures'), (d) => {
                    if(d.exists()) setFooterData(d.data());
                });
                const unsubSat = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'jadual_meta_shared', 'saturday_configs'), (d) => {
                    if(d.exists()) setSaturdayConfigs(d.data());
                });
                return () => { unsubAuth(); unsubEv(); unsubLim(); unsubSig(); unsubSat(); };
            }, [isAuthorized, academicCycle]);

            useEffect(() => {
                if (!tableElementRef.current) return;
                const updateWidth = () => setTableWidth(tableElementRef.current.scrollWidth);
                const ro = new ResizeObserver(updateWidth);
                ro.observe(tableElementRef.current);
                updateWidth();
                return () => ro.disconnect();
            }, [isAuthorized, filterSemester, saturdayConfigs]);

            // --- 6. RENDER LOGIC ---
            if (!isAuthorized) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-blue-900 p-6 text-black">
                        <div className="bg-white p-10 rounded-[3rem] shadow-2xl max-w-md w-full border-4 border-white">
                            <div className="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center text-white mx-auto mb-6 shadow-xl"><Icons.Lock /></div>
                            <h2 className="text-xl font-black mb-8 uppercase text-slate-800 text-center">Akses Sistem Jadual TMP</h2>
                            <form onSubmit={handleLogin}>
                                <input type="password" value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Kod Akses" className="w-full px-6 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black text-center mb-4 outline-none focus:border-blue-600 text-black" autoFocus />
                                <button className="w-full py-4 bg-blue-600 text-white rounded-2xl font-black uppercase hover:bg-blue-700 transition-all shadow-md">Masuk</button>
                                {loginError && <p className="mt-4 text-red-600 font-bold text-xs uppercase text-center">{loginError}</p>}
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="pb-20 bg-white min-h-screen text-black font-sans">
                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-[100] px-6 py-4 no-print shadow-sm flex items-center justify-between gap-4">
                        <div className="flex items-center gap-4">
                            <div className="bg-blue-700 p-2 rounded-xl text-white font-black italic shadow-lg">TMP</div>
                            <div>
                                <h1 className="font-black text-slate-800 text-lg leading-none uppercase">JWM MASTER</h1>
                                <div className="flex items-center gap-2 mt-1">
                                    <button onClick={() => setAcademicCycle('A')} className={`px-2 py-0.5 rounded text-[9px] font-black uppercase ${academicCycle === 'A' ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 text-slate-400'}`}>Kitaran A</button>
                                    <button onClick={() => setAcademicCycle('B')} className={`px-2 py-0.5 rounded text-[9px] font-black uppercase ${academicCycle === 'B' ? 'bg-orange-600 text-white shadow-md' : 'bg-slate-100 text-slate-400'}`}>Kitaran B</button>
                                    <span className="ml-2 px-2 py-0.5 bg-slate-800 text-white rounded text-[8px] font-black uppercase"><Icons.User /> {userRole}</span>
                                    {(userRole === 'admin' || userRole === 'superuser') && (
                                        <button onClick={() => setIsDashboardOpen(true)} className="px-2 py-0.5 bg-green-600 text-white rounded text-[8px] font-black uppercase flex items-center gap-1 shadow-sm hover:bg-green-700"><Icons.Chart /> Dashboard</button>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 max-w-sm relative">
                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><Icons.Search /></div>
                            <input type="text" placeholder="Cari slot..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl py-2 pl-11 pr-4 text-xs font-black outline-none focus:border-blue-600 transition-all text-black" />
                        </div>

                        <div className="flex items-center gap-3">
                            <select value={academicSession} onChange={e => setAcademicSession(e.target.value)} className="bg-blue-50 text-blue-800 text-[10px] font-black p-1.5 rounded-lg border border-blue-100 outline-none">
                                {academicCycle === 'A' ? ['Januari - Jun', 'Julai - Disember'].map(o => <option key={o}>{o}</option>) : ['Oktober - Mac', 'April - September'].map(o => <option key={o}>{o}</option>)}
                            </select>
                            <button onClick={() => window.print()} className="bg-slate-800 text-white px-5 py-2.5 rounded-xl text-[10px] font-black flex items-center gap-2 uppercase shadow-md hover:bg-black"><Icons.Printer /> Cetak</button>
                            <button onClick={handleLogout} className="p-3 bg-red-50 text-red-500 rounded-xl hover:bg-red-600 hover:text-white transition-all shadow-sm"><Icons.External /></button>
                        </div>
                    </nav>

                    <main className="max-w-[99%] mx-auto p-4 md:p-8 print:p-0">
                        <div className="relative mb-6 text-center border-b-2 border-black pb-4">
                            <div className="flex justify-center mb-1"><img src="JATA_NEGARA_MALAYSIA.jpg" alt="Jata" className="h-20 w-auto" onError={e => e.target.src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Coat_of_arms_of_Malaysia.svg/400px-Coat_of_arms_of_Malaysia.svg.png"} /></div>
                            <h1 className="text-xl font-black uppercase leading-tight">KEMENTERIAN KESIHATAN MALAYSIA</h1>
                            <h2 className="text-lg font-bold uppercase underline underline-offset-8">Jadual Waktu Mingguan</h2>
                            <div className="mt-8 flex justify-between items-end text-left text-sm font-bold">
                                <div>
                                    <p>INSTITUT LATIHAN KKM KUCHING, SARAWAK</p>
                                    <p>TARIKH: {autoWeekRange}</p>
                                    <div className="flex gap-2 items-center">
                                        <span>SEMESTER:</span>
                                        <select value={filterSemester} onChange={e => setFilterSemester(e.target.value)} className="no-print bg-slate-50 px-2 py-0.5 rounded">
                                            <option value="SEMUA">Semua Semester</option>
                                            {semesters.map(s => <option key={s} value={s}>{semesterLabels[s]}</option>)}
                                        </select>
                                    </div>
                                    <p>SESI: {currentSessionAcademic}</p>
                                </div>
                                <div className="text-right">
                                    <h2 className="text-lg font-black uppercase">MINGGU {selectedWeek}</h2>
                                    {weekStatus !== "NORMAL" && <p className="text-xs text-red-600 uppercase tracking-widest">{weekStatus}</p>}
                                </div>
                            </div>
                        </div>

                        <div ref={topScrollRef} className="sync-scroll-container no-print">
                            <div style={{ width: `${tableWidth}px`, height: '1px' }}></div>
                        </div>

                        <div ref={tableContainerRef} className="freeze-container table-to-scroll">
                            <div ref={tableElementRef}>
                                <table className="w-full border-collapse table-fixed min-w-[1500px] print:min-w-full">
                                    <thead>
                                        <tr className="bg-slate-50 border-b-2 border-black text-[13px] font-black uppercase">
                                            <th className="w-40 p-4 border-r border-black">Hari / Tarikh</th>
                                            <th className="w-16 border-r border-black">Sem</th>
                                            {timeSlots.map(slot => (<th key={slot} className="p-3 border-r border-black">{slot}</th>))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {visibleDays.map((day, dIdx) => {
                                            const vSems = filterSemester === 'SEMUA' ? semesters : [filterSemester];
                                            return vSems.map((sem, sIdx) => {
                                                const skips = [];
                                                return (
                                                    <tr key={`${day}-${sem}`} className={`border-b border-black/20 ${sIdx === vSems.length - 1 ? 'border-b-2 border-black' : ''}`}>
                                                        {sIdx === 0 && (
                                                            <td rowSpan={vSems.length} className="p-4 bg-white border-r border-black text-center align-middle">
                                                                <div className="font-black uppercase text-sm">{day}</div>
                                                                <div className="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-1 rounded inline-block mt-1">{getDisplayDateForDay(dIdx)}</div>
                                                            </td>
                                                        )}
                                                        <td className="p-2 bg-white text-center font-black text-xs border-r border-black">{sem}</td>
                                                        {timeSlots.map((slot, slotIdx) => {
                                                            if (skips.includes(slotIdx)) return null;
                                                            const key = `${academicSession}-${selectedWeek}-${day}-${sem}-${slotIdx}`;
                                                            const ev = events[key];
                                                            const isBreak = isSlotBreak(day, slotIdx);
                                                            if (isBreak) {
                                                                if (sIdx === 0) return (<td key={slotIdx} rowSpan={vSems.length} className="bg-slate-100 border-r border-black text-center align-middle"> <span className="text-sm font-black uppercase vertical-text tracking-[0.4em] opacity-30">REHAT</span> </td>);
                                                                return null;
                                                            }
                                                            let colSpan = 1;
                                                            if (ev && ev.duration > 1) { for(let i=1; i<ev.duration; i++) { if(!isSlotBreak(day, slotIdx+i)) { colSpan++; skips.push(slotIdx+i); } else break; } }
                                                            const isMatch = searchTerm && ev && (ev.courseCode?.toLowerCase().includes(searchTerm.toLowerCase()) || ev.instructor?.toLowerCase().includes(searchTerm.toLowerCase()));
                                                            return (
                                                                <td key={slotIdx} colSpan={colSpan} className="p-1 border-r border-black/20 h-28 align-top">
                                                                    <div onClick={() => handleOpenModal(day, sem, slotIdx, ev)} className={`h-full w-full rounded-xl p-2 text-[10px] overflow-hidden transition-all ${ev ? (sessionTypes.find(t => t.value === ev.type)?.color || 'bg-white border-l-4') : 'border-2 border-dashed border-slate-100 flex items-center justify-center text-slate-200'} ${isMatch ? 'search-match' : ''} ${userRole !== 'viewer' ? 'cursor-pointer active:scale-95' : ''}`}>
                                                                        {ev ? (
                                                                            <React.Fragment>
                                                                                <div className="font-black uppercase truncate border-b border-black/5 pb-1 mb-1">
                                                                                    {ev.courseCode} {sessionInitials[ev.type] || '(L)'}
                                                                                    {isLocked(ev) && <span className="ml-1 text-red-500"><Icons.Lock /></span>}
                                                                                </div>
                                                                                <div className="font-bold line-clamp-3 leading-tight mb-1">{ev.topic}</div>
                                                                                <div className="mt-auto font-black opacity-60 text-[8px] truncate uppercase">{ev.instructor}</div>
                                                                            </React.Fragment>
                                                                        ) : (userRole !== 'viewer' && <Icons.Plus />)}
                                                                    </div>
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                );
                                            });
                                        })}
                                    </tbody>
                                </table>
                            </div>
                            <div className="p-10 border-t-2 border-black grid grid-cols-2 gap-40 font-bold text-sm">
                                <div>
                                    <p>DISEDIAKAN OLEH:</p>
                                    <div className="mt-10 border-b border-black flex gap-2">NAMA: <input type="text" className="bg-transparent outline-none w-full" value={footerData.preparedName} onChange={e => handleFooterChange('preparedName', e.target.value)} /></div>
                                    <p className="mt-1">PENGAJAR PENYELARAS</p>
                                    <div className="mt-4 flex gap-2">TARIKH: <input type="date" className="bg-transparent outline-none" value={footerData.preparedDate} onChange={e => handleFooterChange('preparedDate', e.target.value)} /></div>
                                </div>
                                <div>
                                    <p>DISAHKAN OLEH:</p>
                                    <div className="mt-10 border-b border-black flex gap-2">NAMA: <input type="text" className="bg-transparent outline-none w-full" value={footerData.verifiedName} onChange={e => handleFooterChange('verifiedName', e.target.value)} /></div>
                                    <p className="mt-1">TIMBALAN PENGARAH AKADEMIK</p>
                                    <div className="mt-4 flex gap-2">TARIKH: <input type="date" className="bg-transparent outline-none" value={footerData.verifiedDate} onChange={e => handleFooterChange('verifiedDate', e.target.value)} /></div>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* MODAL EDITOR */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm no-print font-sans text-black">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-xl max-h-[95vh] overflow-hidden border-4 border-blue-600 flex flex-col">
                                <div className="px-10 py-6 border-b flex justify-between items-center">
                                    <h3 className="font-black text-lg uppercase">Kemas Kini Slot</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="bg-red-600 text-white p-2 rounded-xl"><Icons.X /></button>
                                </div>
                                <div className="p-10 space-y-6 overflow-y-auto flex-1 text-black">
                                    <div className="grid grid-cols-2 gap-6">
                                        <div>
                                            <label className="text-[11px] font-black uppercase opacity-50">Kod Kursus</label>
                                            <select className="w-full p-4 bg-slate-50 rounded-2xl font-black text-sm text-black" value={formData.courseCode} onChange={e => setFormData({...formData, courseCode: e.target.value})}>
                                                {courseCodes.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[11px] font-black uppercase opacity-50">Bilangan Slot</label>
                                            <select className="w-full p-4 bg-slate-50 rounded-2xl font-black text-sm text-black" value={formData.duration} onChange={e => setFormData({...formData, duration: parseInt(e.target.value)})}>
                                                {[1,2,3,4].map(n => <option key={n} value={n}>{n} Slot</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-black uppercase opacity-50">Tajuk Pembelajaran</label>
                                        <textarea rows="3" className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-sm text-black" value={formData.topic} onChange={e => setFormData({...formData, topic: e.target.value})}></textarea>
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-black uppercase opacity-50">Nama Pengajar</label>
                                        <select className="w-full p-4 bg-slate-50 rounded-2xl font-black text-sm text-black" value={formData.instructor} onChange={e => setFormData({...formData, instructor: e.target.value})}>
                                            <option value="">Pilih Pengajar</option>
                                            {instructorList.map(name => <option key={name} value={name}>{name}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="p-10 bg-slate-50 border-t flex gap-4">
                                    <button onClick={handleSave} disabled={isSaving} className="flex-1 py-5 bg-blue-600 text-white rounded-2xl font-black uppercase shadow-xl hover:bg-blue-700">
                                        {isSaving ? 'Menyimpan...' : 'Simpan Rekod'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DASHBOARD ANALITIK */}
                    {isDashboardOpen && (
                        <div className="fixed inset-0 z-[500] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm no-print font-sans text-black">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-6xl max-h-[90vh] overflow-hidden border-4 border-green-600 flex flex-col">
                                <div className="bg-green-50 px-10 py-6 flex justify-between items-center border-b-2 border-green-100">
                                    <h3 className="font-black text-lg uppercase flex items-center gap-2"><Icons.Chart /> Analitik Jam: {academicSession}</h3>
                                    <button onClick={() => setIsDashboardOpen(false)} className="bg-white text-green-600 p-2 rounded-xl shadow-md"><Icons.X /></button>
                                </div>
                                <div className="p-8 overflow-y-auto flex-1 space-y-10 text-black">
                                    <div className="overflow-x-auto rounded-3xl border border-slate-100">
                                        <table className="w-full text-left text-black">
                                            <thead>
                                                <tr className="bg-slate-50 text-[10px] font-black uppercase">
                                                    <th className="p-4">Kod Kursus</th>
                                                    <th className="p-4">Kuliah</th>
                                                    <th className="p-4">Amali</th>
                                                    <th className="p-4">Tutorial</th>
                                                    <th className="p-4 text-blue-600">Jumlah</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {Object.entries(dashboardData.courseSum).sort().map(([code, data]) => (
                                                    <tr key={code} className="text-xs border-t font-bold hover:bg-slate-50 text-black">
                                                        <td className="p-4 font-black">{code}</td>
                                                        <td className="p-4">{data.Kuliah} j</td>
                                                        <td className="p-4">{data.Amali} j</td>
                                                        <td className="p-4">{data.Tutorial} j</td>
                                                        <td className="p-4 text-blue-700 bg-blue-50/30">{data.total} j</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div>
                                        <h4 className="text-[12px] font-black uppercase mb-4 flex items-center gap-2"><div className="w-2 h-2 bg-emerald-600 rounded-full"></div> Rumusan Pengajar</h4>
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                            {Object.entries(dashboardData.instructorSum).sort().map(([name, data]) => (
                                                <div key={name} className="p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 flex flex-col justify-center">
                                                    <p className="text-[10px] font-black uppercase text-slate-400 leading-tight mb-1">{name}</p>
                                                    <p className="text-lg font-black text-emerald-700 leading-none">{data.total} <span className="text-[10px] uppercase opacity-50">jam</span></p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
