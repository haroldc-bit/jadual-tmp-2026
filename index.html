<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadual Waktu Mingguan TMP Digital v7.0</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @media print {
            @page { size: landscape; margin: 0.5cm; }
            .no-print { display: none !important; }
            body { background: white !important; padding: 0; margin: 0; font-family: 'Times New Roman', serif; color: black !important; }
            main { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            .overflow-x-auto { overflow: visible !important; }
            table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse; border: 1px solid black !important; }
            th, td { border: 1px solid black !important; background: white !important; color: black !important; }
            .rounded-3xl, .rounded-[3.5rem], .rounded-2xl { border-radius: 0 !important; }
            input, select, textarea { border: none !important; background: transparent !important; color: black !important; appearance: none; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        .vertical-text { writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg); display: inline-block; }
        @keyframes high-visibility-flash {
            0% { background-color: #3b82f6; color: white; transform: scale(1.02); }
            100% { background-color: transparent; transform: scale(1); }
        }
        .highlight-new { animation: high-visibility-flash 2.5s ease-out forwards; }
        
        .week-scrollbar::-webkit-scrollbar { height: 8px; display: block; }
        .week-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .week-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Sync Scrollbar Styles */
        .sync-scroll-container { overflow-x: auto; overflow-y: hidden; }
        .sync-scroll-container::-webkit-scrollbar { height: 12px; }
        .sync-scroll-container::-webkit-scrollbar-track { background: #f8fafc; }
        .sync-scroll-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 3px solid #f8fafc; }
        .sync-scroll-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* PENAMBAHBAIKAN: Sticky Horizontal Scroll */
        .sticky-top-scroll {
            position: sticky;
            top: 72px; /* Menyesuaikan dengan ketinggian nav */
            z-index: 40;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        .font-table-content { font-size: 14px !important; }
    </style>
</head>
<body class="bg-white min-h-screen text-black font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icons = {
            Plus: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            X: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Undo: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-15 9 9 0 0 0-8.31 5.5"></path></svg>,
            Save: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
            Lock: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            External: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        };

        const App = () => {
            // FIREBASE CONFIG (Dikekalkan sepenuhnya)
            const firebaseConfig = {
                apiKey: "AIzaSyBOCPBrZ-xkwEgi4OnkBwDB8YqGgWEuMVE",
                authDomain: "jadual-tmp-digital.firebaseapp.com",
                projectId: "jadual-tmp-digital",
                storageBucket: "jadual-tmp-digital.firebasestorage.app",
                messagingSenderId: "716895729119",
                appId: "1:716895729119:web:ca75d33c6e07a177ef006a",
                measurementId: "G-THMTY1YPX8"
            };

            const [user, setUser] = useState(null);
            const [isAuthorized, setIsAuthorized] = useState(() => sessionStorage.getItem('tmp_auth') === 'true');
            const [accessCode, setAccessCode] = useState("");
            const [isCloudEnabled, setIsCloudEnabled] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [appId] = useState('tmp-jadual-v26-master');

            const [selectedWeek, setSelectedWeek] = useState(1);
            const [sessionStartDate, setSessionStartDate] = useState('2026-01-05');
            const [academicSession, setAcademicSession] = useState('Januari - Jun');
            const [events, setEvents] = useState({});
            const [footerData, setFooterData] = useState({ preparedName: '', preparedDate: '', verifiedName: '', verifiedDate: '' });
            const [filterSemester, setFilterSemester] = useState('SEMUA');
            const [saturdayConfigs, setSaturdayConfigs] = useState({});

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingEvent, setEditingEvent] = useState(null);
            const [lastUpdatedKey, setLastUpdatedKey] = useState(null);
            const [isSaving, setIsSaving] = useState(false);

            const topScrollRef = useRef(null);
            const tableContainerRef = useRef(null);
            const tableElementRef = useRef(null);
            const [tableWidth, setTableWidth] = useState(0);

            const semesters = ['T1SI', 'T1SII', 'T2SI', 'T2SII'];
            const courseCodes = ["MTBT 2114", "MTIM 2013", "MTIB 2022", "MTPE 2064", "MTMM 2043", "MTMM 2053", "MTBC 2032", "MTGC 2074", "MTHE 2103", "MTMS 2082", "MTPC 2133", "MTPC 2122", "MTBT 2193", "MTPC 2203", "MTNF 2162", "MTHE 2182", "MTVS 2142", "GCLE 2042", "CCPS 2012", "CCEH 2022", "GCMP 2022", "CCRM 2013", "GCSF 2013", "Lain-lain"];
            const days = ['Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
            const timeSlots = ['8.00 - 9.00', '9.00 - 10.00', '10.00 - 10.30', '10.30 - 11.30', '11.30 - 12.30', '12.30 - 1.00', '1.00 - 2.00', '2.00 - 3.00', '3.00 - 4.00', '4.00 - 5.00'];

            const semesterLabels = {
                'T1SI': 'Tahun 1 Semester I',
                'T1SII': 'Tahun 1 Semester II',
                'T2SI': 'Tahun 2 Semester I',
                'T2SII': 'Tahun 2 Semester II'
            };

            const sessionInitials = {
                'Kuliah': '(L)', 'Amali': '(P)', 'IL': '(IL)', 'Tutorial': '(T)', 'CA': '(CA)', 'Ulangkaji': '(UK)'
            };

            const sessionTypes = [
                { label: 'Kuliah (L)', value: 'Kuliah', color: 'bg-blue-50 border-blue-500 text-blue-700' },
                { label: 'Amali (P)', value: 'Amali', color: 'bg-emerald-50 border-emerald-500 text-emerald-700' },
                { label: 'IL (Self Learning)', value: 'IL', color: 'bg-amber-50 border-amber-500 text-amber-700' },
                { label: 'Tutorial (T)', value: 'Tutorial', color: 'bg-purple-50 border-purple-400 text-purple-700' },
                { label: 'CA (Assessment)', value: 'CA', color: 'bg-red-50 border-red-400 text-red-700' },
                { label: 'Ulangkaji', value: 'Ulangkaji', color: 'bg-orange-50 border-orange-400 text-orange-700' }
            ];

            const weekStatus = useMemo(() => {
                const w = parseInt(selectedWeek);
                if (w === 10) return "CUTI PERTENGAHAN SEMESTER";
                if ([21, 22, 23].includes(w)) return "MINGGU PEPERIKSAAN";
                if ([24, 25, 26].includes(w)) return "CUTI AKHIR SEMESTER";
                return "NORMAL";
            }, [selectedWeek]);

            const currentWeekHasSaturday = useMemo(() => saturdayConfigs[selectedWeek] === true, [saturdayConfigs, selectedWeek]);
            const visibleDays = useMemo(() => currentWeekHasSaturday ? days : days.slice(0, 5), [currentWeekHasSaturday]);

            // PENAMBAHBAIKAN: Tarikh Sabtu Automatik
            const autoWeekRange = useMemo(() => {
                const start = new Date(sessionStartDate);
                start.setDate(start.getDate() + (selectedWeek - 1) * 7);
                const end = new Date(start);
                // Jika Sabtu ada, tambah 5 hari dari Isnin. Jika tiada, tambah 4 hari (Jumaat).
                end.setDate(start.getDate() + (currentWeekHasSaturday ? 5 : 4));
                return `${start.toLocaleDateString('en-GB')} - ${end.toLocaleDateString('en-GB')}`;
            }, [sessionStartDate, selectedWeek, currentWeekHasSaturday]);

            const currentYear = new Date().getFullYear();
            const [formData, setFormData] = useState({ id: '', day: '', timeSlotIndex: 0, courseCode: 'MTBT 2114', customCourseCode: '', topic: '', type: 'Kuliah', instructor: '', semester: '', duration: 1 });

            // SYNC SCROLLBARS LOGIC
            useEffect(() => {
                const top = topScrollRef.current;
                const bottom = tableContainerRef.current;
                if (!top || !bottom) return;

                let isSyncing = false;
                const syncTop = () => {
                    if (!isSyncing) {
                        isSyncing = true;
                        bottom.scrollLeft = top.scrollLeft;
                        setTimeout(() => { isSyncing = false; }, 10);
                    }
                };
                const syncBottom = () => {
                    if (!isSyncing) {
                        isSyncing = true;
                        top.scrollLeft = bottom.scrollLeft;
                        setTimeout(() => { isSyncing = false; }, 10);
                    }
                };

                top.addEventListener('scroll', syncTop);
                bottom.addEventListener('scroll', syncBottom);
                
                const resizeObserver = new ResizeObserver(() => {
                    if (tableElementRef.current) setTableWidth(tableElementRef.current.scrollWidth);
                });
                if (tableElementRef.current) resizeObserver.observe(tableElementRef.current);

                return () => {
                    top.removeEventListener('scroll', syncTop);
                    bottom.removeEventListener('scroll', syncBottom);
                    resizeObserver.disconnect();
                };
            }, [isAuthorized, selectedWeek, filterSemester, currentWeekHasSaturday, appId]);

            useEffect(() => {
                const initFirebase = async () => {
                    if (!firebase.apps.length) {
                        try {
                            firebase.initializeApp(firebaseConfig);
                            const cred = await firebase.auth().signInAnonymously();
                            setUser(cred.user);
                            setIsCloudEnabled(true);
                        } catch (e) { 
                            console.error("Firebase Auth Error:", e);
                            loadLocalData(); 
                        }
                    }
                };
                initFirebase();
            }, []);

            useEffect(() => {
                if (!isAuthorized || !isCloudEnabled || !user) {
                    if (isAuthorized) loadLocalData();
                    return;
                }
                const db = firebase.firestore();
                setIsSyncing(true);
                const unsubEvents = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('jadual_master')
                    .onSnapshot((snap) => {
                        const data = {};
                        snap.forEach(doc => data[doc.id] = doc.data());
                        setEvents(data);
                        setIsSyncing(false);
                    }, (err) => {
                        console.error("Firestore Error:", err);
                        setIsSyncing(false);
                    });
                
                const unsubFooter = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('jadual_meta').doc('signatures')
                    .onSnapshot((doc) => { if (doc.exists) setFooterData(doc.data()); });
                
                const unsubSat = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('jadual_meta').doc('saturday_configs')
                    .onSnapshot((doc) => { if (doc.exists) setSaturdayConfigs(doc.data()); });

                return () => { unsubEvents(); unsubFooter(); unsubSat(); };
            }, [user, isAuthorized, isCloudEnabled, appId]);

            const loadLocalData = () => {
                const saved = localStorage.getItem('tmp_v6.9_local');
                if (saved) {
                    const p = JSON.parse(saved);
                    setEvents(p.events || {}); setFooterData(p.footer || {}); setSaturdayConfigs(p.saturdayConfigs || {}); setSessionStartDate(p.start || '2026-01-05'); setAcademicSession(p.academicSession || 'Januari - Jun');
                }
            };

            const handleSave = async () => {
                if (isSaving) return;
                setIsSaving(true);
                const finalCode = formData.courseCode === 'Lain-lain' ? formData.customCourseCode : formData.courseCode;
                const key = `${selectedWeek}-${formData.day}-${formData.semester}-${formData.timeSlotIndex}`;
                const data = { ...formData, courseCode: finalCode };
                try {
                    if (isCloudEnabled && user) {
                        await firebase.firestore().collection('artifacts').doc(appId).collection('public').doc('data').collection('jadual_master').doc(key).set(data);
                    } else {
                        setEvents(prev => ({ ...prev, [key]: data }));
                    }
                    setLastUpdatedKey(key); setIsModalOpen(false); setTimeout(() => setLastUpdatedKey(null), 3000);
                } catch (e) { alert("Ralat menyimpan."); } finally { setIsSaving(false); }
            };

            const handleFooterChange = async (field, val) => {
                const next = { ...footerData, [field]: val };
                setFooterData(next);
                if (isCloudEnabled && user) await firebase.firestore().collection('artifacts').doc(appId).collection('public').doc('data').collection('jadual_meta').doc('signatures').set(next);
            };

            const getDisplayDateForDay = (dayIdx) => {
                const start = new Date(sessionStartDate);
                start.setDate(start.getDate() + (selectedWeek - 1) * 7 + dayIdx);
                return start.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
            };

            const isSlotBreak = (day, slotIdx) => {
                const slot = timeSlots[slotIdx];
                if (slot === '10.00 - 10.30') return true;
                if (day !== 'Jumaat' && slot === '1.00 - 2.00') return true;
                if (day === 'Jumaat') return [5, 6].includes(slotIdx); 
                return false;
            };

            const handleOpenModal = (day, sem, slotIdx, event = null) => {
                if (isSlotBreak(day, slotIdx) || weekStatus.includes("CUTI")) return;
                if (event) {
                    setFormData({ ...event, customCourseCode: courseCodes.includes(event.courseCode) ? '' : event.courseCode });
                    setEditingEvent({...event});
                } else {
                    setFormData({ id: Math.random().toString(36).substr(2, 9), day, semester: sem, timeSlotIndex: slotIdx, courseCode: courseCodes[0], customCourseCode: '', topic: '', type: 'Kuliah', instructor: '', duration: 1 });
                    setEditingEvent(null);
                }
                setIsModalOpen(true);
            };

            if (!isAuthorized) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-blue-900 p-6">
                        <div className="bg-white p-10 rounded-[3rem] shadow-2xl text-center max-w-md w-full border-4 border-white">
                            <div className="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center text-white mx-auto mb-6 shadow-xl"><Icons.Lock /></div>
                            <h2 className="text-xl font-black mb-8 uppercase text-slate-800 tracking-tight">Log Masuk Jadual</h2>
                            <form onSubmit={(e) => { e.preventDefault(); if(accessCode === "TMP2026"){ setIsAuthorized(true); sessionStorage.setItem('tmp_auth', 'true'); } else { alert("Kod Akses Salah"); } }}>
                                <input type="password" value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Kod Akses" className="w-full px-6 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black text-center mb-4 outline-none focus:border-blue-600 transition-all" autoFocus />
                                <button className="w-full py-4 bg-blue-600 text-white rounded-2xl font-black uppercase hover:bg-blue-700 transition-all">Sahkan</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="pb-20 bg-white">
                    <nav className="bg-white border-b-2 border-slate-100 sticky top-0 z-50 px-6 py-4 no-print shadow-sm flex flex-col gap-4">
                        <div className="max-w-[98%] mx-auto w-full flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center gap-4">
                                <div className="bg-blue-700 p-2 rounded-xl text-white font-black italic shadow-lg">TMP</div>
                                <div>
                                    <h1 className="font-black text-slate-800 text-lg leading-none uppercase">JWM MASTER</h1>
                                    <p className="text-[10px] font-black text-blue-600 uppercase mt-1">Versi 7.0 Pro</p>
                                </div>
                            </div>

                            <div className="flex-1 max-w-2xl bg-slate-50 p-2 rounded-2xl border border-slate-200 shadow-inner overflow-hidden">
                                <div className="week-scrollbar flex gap-2 overflow-x-auto pb-2 px-1">
                                    {Array.from({length: 26}, (_, i) => i + 1).map(w => (
                                        <button key={w} onClick={() => setSelectedWeek(w)} className={`shrink-0 min-w-[45px] py-2 rounded-xl font-black text-xs transition-all ${selectedWeek === w ? 'bg-blue-600 text-white' : 'bg-white text-slate-400 hover:bg-slate-100'}`}>M{w}</button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-3">
                                <div className="flex flex-col gap-1 border-r pr-3 border-slate-100">
                                    <label className="text-[8px] font-black uppercase text-slate-400">Sesi Akademik</label>
                                    <select value={academicSession} onChange={e => setAcademicSession(e.target.value)} className="bg-blue-50 text-blue-800 text-[10px] font-black p-1.5 rounded-lg border border-blue-100">
                                        <option value="Januari - Jun">Januari - Jun</option>
                                        <option value="Julai - Disember">Julai - Disember</option>
                                    </select>
                                </div>
                                <div className="flex flex-col gap-1 border-r pr-3 border-slate-100">
                                    <label className="text-[8px] font-black uppercase text-slate-400">Mula M1</label>
                                    <input type="date" value={sessionStartDate} onChange={e => setSessionStartDate(e.target.value)} className="bg-slate-100 text-slate-800 text-[10px] font-black p-1 rounded outline-none" />
                                </div>
                                <div className="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200">
                                    <span className="text-[9px] font-black uppercase text-slate-400">Sabtu:</span>
                                    <button onClick={() => {
                                        const next = !currentWeekHasSaturday;
                                        const nextConfigs = {...saturdayConfigs, [selectedWeek]: next};
                                        setSaturdayConfigs(nextConfigs);
                                        if(isCloudEnabled) firebase.firestore().collection('artifacts').doc(appId).collection('public').doc('data').collection('jadual_meta').doc('saturday_configs').set(nextConfigs);
                                    }} className={`w-8 h-4 rounded-full relative transition-all ${currentWeekHasSaturday ? 'bg-green-500' : 'bg-slate-300'}`}>
                                        <div className={`absolute top-0.5 w-3 h-3 bg-white rounded-full transition-all ${currentWeekHasSaturday ? 'left-4' : 'left-0.5'}`}></div>
                                    </button>
                                </div>
                                <button onClick={() => window.print()} className="bg-slate-800 text-white px-5 py-2 rounded-xl text-[10px] font-black hover:bg-black flex items-center gap-2 uppercase">
                                    <Icons.Save /> Cetak
                                </button>
                                <button onClick={() => {setIsAuthorized(false); sessionStorage.removeItem('tmp_auth');}} className="p-2.5 bg-red-50 text-red-500 rounded-xl hover:bg-red-600 hover:text-white transition-all shadow-sm"><Icons.External /></button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-[99%] mx-auto p-4 md:p-10 print:p-0 bg-white">
                        <div className="relative mb-6 text-center border-b-2 border-black pb-4 bg-white">
                            <div className="absolute top-0 right-0 text-[12px] font-bold text-right text-black uppercase tracking-tighter">BPL.KKM.PK(T) 048B/17</div>

                            <div className="flex justify-center mb-1">
                                <img src="JATA_NEGARA_MALAYSIA.jpg" alt="Jata Negara" className="h-24 w-auto object-contain" 
                                    onError={(e) => { e.target.onerror = null; e.target.src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Coat_of_arms_of_Malaysia.svg/400px-Coat_of_arms_of_Malaysia.svg.png"; }} />
                            </div>
                            
                            <h1 className="text-xl font-black text-black uppercase">KEMENTERIAN KESIHATAN MALAYSIA</h1>
                            <h2 className="text-lg font-bold text-black mt-1 uppercase underline underline-offset-8">Jadual Waktu Mingguan</h2>
                            
                            <div className="mt-8 flex flex-col md:flex-row justify-between items-start md:items-end text-left gap-4">
                                <div className="space-y-1 flex-1">
                                    <div className="flex gap-2">
                                        <span className="font-black text-[12px] uppercase shrink-0 text-black">NAMA INSTITUSI:</span>
                                        <span className="font-bold text-[12px] uppercase text-black">INSTITUT LATIHAN KEMENTERIAN KESIHATAN MALAYSIA KUCHING, SARAWAK</span>
                                    </div>
                                    <div className="flex flex-wrap items-center gap-10">
                                        <div className="flex items-center gap-2">
                                            <span className="font-black text-[12px] uppercase text-black">TARIKH:</span>
                                            <span className="font-bold text-[12px] text-black uppercase">{autoWeekRange}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="font-black text-[12px] uppercase text-black">SEMESTER:</span>
                                            <select value={filterSemester} onChange={e => setFilterSemester(e.target.value)} className="font-bold text-[12px] uppercase text-black bg-slate-50 px-2 py-0.5 rounded no-print">
                                                <option value="SEMUA">Pilihan Semester (Semua)</option>
                                                {semesters.map(s => <option key={s} value={s}>{semesterLabels[s]}</option>)}
                                            </select>
                                            <span className="hidden print:inline font-bold text-[12px] uppercase">
                                                {filterSemester === 'SEMUA' ? 'Tahun 1 Sem II, Tahun 2 Sem I & II' : semesterLabels[filterSemester]}
                                            </span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="font-black text-[12px] uppercase text-black">SESI AKADEMIK:</span>
                                            <span className="font-bold text-[12px] uppercase text-black">{academicSession} {currentYear}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="text-right">
                                    <h2 className="text-[16px] font-black text-black uppercase tracking-tighter leading-none">MINGGU {selectedWeek}</h2>
                                    {weekStatus !== "NORMAL" && <div className="text-[11px] font-black text-red-600 mt-1 uppercase">{weekStatus}</div>}
                                </div>
                            </div>
                        </div>

                        {/* SYNCED TOP SCROLLBAR (STICKY) */}
                        <div ref={topScrollRef} className="sync-scroll-container no-print sticky-top-scroll">
                            <div style={{ width: `${tableWidth}px`, height: '1px' }}></div>
                        </div>

                        <div ref={tableContainerRef} className="sync-scroll-container bg-white border-2 border-black print:overflow-visible relative shadow-sm">
                            <div ref={tableElementRef}>
                                <table className="w-full border-collapse table-fixed min-w-[1600px] print:min-w-full">
                                    <thead>
                                        <tr className="bg-white border-b-2 border-black text-center text-black font-black text-[14px] uppercase">
                                            <th className="w-40 p-4 border-r border-black font-table-content">Hari / Tarikh</th>
                                            <th className="w-20 border-r border-black font-table-content">Sem</th>
                                            {timeSlots.map(slot => (<th key={slot} className="p-3 border-r border-black last:border-0 font-table-content">{slot}</th>))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {visibleDays.map((day, dayIdx) => {
                                            const visibleSemesters = filterSemester === 'SEMUA' ? semesters : [filterSemester];
                                            const displayDate = getDisplayDateForDay(dayIdx);
                                            return (
                                                <React.Fragment key={day}>
                                                    {visibleSemesters.map((sem, semIdx) => {
                                                        const skips = [];
                                                        return (
                                                            <tr key={`${day}-${sem}`} className={`border-b border-black/20 ${semIdx === visibleSemesters.length - 1 ? 'border-b-2 border-black' : ''}`}>
                                                                {semIdx === 0 && (
                                                                    <td rowSpan={visibleSemesters.length} className="p-4 bg-white border-r border-black text-center align-middle">
                                                                        <div className="font-black text-black text-[14px] uppercase mb-1 font-table-content">{day}</div>
                                                                        <div className="text-[12px] font-black text-blue-700 bg-blue-50/20 px-2 py-1 rounded border border-blue-100 inline-block">
                                                                            {displayDate}
                                                                        </div>
                                                                    </td>
                                                                )}
                                                                <td className="p-2 bg-white text-center font-black text-[14px] text-slate-500 border-r border-black uppercase font-table-content">{sem}</td>
                                                                {timeSlots.map((slot, slotIdx) => {
                                                                    if (skips.includes(slotIdx)) return null;
                                                                    const key = `${selectedWeek}-${day}-${sem}-${slotIdx}`;
                                                                    const event = events[key];
                                                                    const isBreak = isSlotBreak(day, slotIdx);
                                                                    if (weekStatus !== 'NORMAL' || isBreak) {
                                                                        if (semIdx === 0) return (
                                                                            <td key={slotIdx} rowSpan={visibleSemesters.length} className="bg-slate-50 border-r border-black p-2 text-center align-middle">
                                                                                <span className="text-[14px] font-black uppercase vertical-text tracking-[0.4em] opacity-30 text-black font-table-content">{isBreak ? 'REHAT' : weekStatus}</span>
                                                                            </td>
                                                                        );
                                                                        return null;
                                                                    }
                                                                    let colSpan = 1;
                                                                    if (event && event.duration > 1) {
                                                                        for(let i=1; i<event.duration; i++) { 
                                                                            if(!((slotIdx+i) < timeSlots.length) || isSlotBreak(day, slotIdx+i)) break; 
                                                                            colSpan++; skips.push(slotIdx+i); 
                                                                        }
                                                                    }
                                                                    return (
                                                                        <td key={slotIdx} colSpan={colSpan} className={`p-1 border-r border-black/20 h-32 align-top transition-all ${key === lastUpdatedKey ? 'highlight-new' : ''}`}>
                                                                            {event ? (
                                                                                <div onClick={() => handleOpenModal(day, sem, slotIdx, event)} className={`h-full w-full rounded border-l-[4px] p-3 text-[10px] cursor-pointer flex flex-col gap-1 overflow-hidden active:scale-95 ${sessionTypes.find(t => t.value === event.type)?.color || 'bg-white'}`}>
                                                                                    <div className="font-black truncate uppercase text-black border-b border-black/5 pb-1 mb-1 leading-tight text-[11px]">
                                                                                        {event.courseCode} {sessionInitials[event.type] || ''}
                                                                                    </div>
                                                                                    <div className="font-bold line-clamp-3 leading-snug text-slate-800 flex-1">{event.topic}</div>
                                                                                    <div className="mt-2 font-black opacity-60 text-[8px] truncate bg-white/60 rounded px-1.5 py-0.5 uppercase text-black">{event.instructor}</div>
                                                                                </div>
                                                                            ) : (
                                                                                <button onClick={() => handleOpenModal(day, sem, slotIdx)} className="w-full h-full rounded border border-dashed border-slate-200 hover:border-blue-400 flex items-center justify-center text-slate-200 transition-all no-print"><Icons.Plus /></button>
                                                                            )}
                                                                        </td>
                                                                    );
                                                                })}
                                                            </tr>
                                                        );
                                                    })}
                                                </React.Fragment>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>

                            <div className="p-12 border-t-2 border-black grid grid-cols-2 gap-40 bg-white relative">
                                <div className="space-y-1">
                                    <h4 className="text-[12px] font-black text-black uppercase tracking-[0.2em]">DISEDIAKAN OLEH:</h4>
                                    <div className="pt-10 pb-2 border-b border-black flex items-center gap-2">
                                        <span className="text-[11px] font-black text-black uppercase shrink-0">NAMA:</span>
                                        <input type="text" value={footerData.preparedName || ''} onChange={e => handleFooterChange('preparedName', e.target.value)} className="w-full bg-transparent font-black text-sm outline-none text-black uppercase" />
                                    </div>
                                    <p className="text-[11px] font-black text-black uppercase mt-1 tracking-tight">PENGAJAR PENYELARAS</p>
                                    <div className="flex items-center gap-2 pt-4">
                                        <span className="text-[11px] font-black text-black uppercase">TARIKH:</span>
                                        <input type="date" value={footerData.preparedDate || ''} onChange={e => handleFooterChange('preparedDate', e.target.value)} className="bg-transparent font-bold text-[11px] outline-none cursor-pointer text-black" />
                                    </div>
                                </div>
                                <div className="space-y-1 text-left">
                                    <h4 className="text-[12px] font-black text-black uppercase tracking-[0.2em]">DISAHKAN OLEH:</h4>
                                    <div className="pt-10 pb-2 border-b border-black flex items-center gap-2">
                                        <span className="text-[11px] font-black text-black uppercase shrink-0">NAMA:</span>
                                        <input type="text" value={footerData.verifiedName || ''} onChange={e => handleFooterChange('verifiedName', e.target.value)} className="w-full bg-transparent font-black text-sm outline-none text-black uppercase" />
                                    </div>
                                    <p className="text-[11px] font-black text-black uppercase mt-1 leading-tight tracking-tight uppercase">TIMBALAN PENGARAH AKADEMIK / KETUA PROGRAM</p>
                                    <div className="flex items-center gap-2 pt-4">
                                        <span className="text-[11px] font-black text-black uppercase">TARIKH:</span>
                                        <input type="date" value={footerData.verifiedDate || ''} onChange={e => handleFooterChange('verifiedDate', e.target.value)} className="bg-transparent font-bold text-[11px] outline-none cursor-pointer text-black" />
                                    </div>
                                </div>
                                <div className="absolute bottom-4 right-8 text-[10px] text-black">
                                    <span className="font-black italic">**Harold Criso Anak Ajin**</span>
                                </div>
                            </div>
                        </div>
                    </main>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm no-print animate-in fade-in duration-300">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-xl max-h-[90vh] overflow-hidden border-4 border-blue-600 flex flex-col scale-100">
                                <div className="bg-white px-10 py-6 border-b-2 border-slate-100 flex justify-between items-center shrink-0">
                                    <h3 className="font-black text-lg uppercase text-slate-800">KEMAS KINI SLOT</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="bg-red-600 text-white p-3 rounded-2xl hover:rotate-90 transition-all shadow-md"><Icons.X /></button>
                                </div>
                                <div className="p-10 space-y-6 overflow-y-auto flex-1 bg-white">
                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="space-y-1">
                                            <label className="text-[11px] font-black uppercase text-slate-400">Kod Kursus</label>
                                            <select className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-black text-sm outline-none" value={formData.courseCode} onChange={e => setFormData({...formData, courseCode: e.target.value})}>
                                                {courseCodes.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[11px] font-black uppercase text-slate-400">Bilangan Slot</label>
                                            <select className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl font-black text-sm outline-none" value={formData.duration} onChange={e => setFormData({...formData, duration: parseInt(e.target.value)})}>
                                                {[1,2,3,4].map(n => <option key={n} value={n}>{n} Slot</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    {formData.courseCode === 'Lain-lain' && <input type="text" className="w-full px-6 py-4 bg-blue-50 border border-blue-200 rounded-2xl font-black text-sm outline-none shadow-inner" value={formData.customCourseCode} onChange={e => setFormData({...formData, customCourseCode: e.target.value})} placeholder="Sila taip kod..." />}
                                    <div className="space-y-3">
                                        <label className="text-[11px] font-black uppercase text-slate-400">Jenis Sesi</label>
                                        <div className="flex flex-wrap gap-2">
                                            {sessionTypes.map(t => (
                                                <button key={t.value} onClick={() => setFormData({...formData, type: t.value})} className={`px-5 py-2 rounded-2xl text-[10px] font-black border-2 transition-all ${formData.type === t.value ? t.color + ' border-blue-600' : 'bg-white border-slate-100 text-slate-400'}`}>
                                                    {t.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[11px] font-black uppercase text-slate-400">Tajuk Pembelajaran</label>
                                        <textarea rows="3" className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-bold text-sm" placeholder="Topik..." value={formData.topic} onChange={e => setFormData({...formData, topic: e.target.value})}></textarea>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[11px] font-black uppercase text-slate-400">Nama Pengajar</label>
                                        <input type="text" className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-black text-sm" placeholder="Nama..." value={formData.instructor} onChange={(e) => setFormData({...formData, instructor: e.target.value})} />
                                    </div>
                                </div>
                                <div className="p-10 bg-slate-50 border-t border-slate-100 flex gap-4 shrink-0">
                                    <button onClick={() => { if(editingEvent) setFormData({...editingEvent}); else setFormData(prev => ({...prev, topic: '', instructor: ''})); }} className="flex-1 py-5 bg-white text-slate-600 text-xs font-black rounded-2xl border border-slate-200 active:scale-90 shadow-sm uppercase"><Icons.Undo /> Undo</button>
                                    {editingEvent && <button onClick={async () => { if(confirm("Padam?")) { const key = `${selectedWeek}-${formData.day}-${formData.semester}-${formData.timeSlotIndex}`; if(isCloudEnabled) await firebase.firestore().collection('artifacts').doc(appId).collection('public').doc('data').collection('jadual_master').doc(key).delete(); else { const n = {...events}; delete n[key]; setEvents(n); } setIsModalOpen(false); } }} className="p-5 bg-white text-red-600 border border-red-100 border rounded-2xl hover:bg-red-600 hover:text-white transition-all shadow-sm"><Icons.Trash /></button>}
                                    <button onClick={handleSave} disabled={isSaving} className="flex-[3] py-5 bg-blue-600 text-white rounded-2xl text-sm font-black hover:bg-blue-700 active:scale-95 transition-all shadow-xl">{isSaving ? 'Menyimpan...' : 'SIMPAN REKOD'}</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
