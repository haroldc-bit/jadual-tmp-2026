                setLoginError("");
                const code = accessCode.trim().toUpperCase();
                
                if(code === "ADMIN2026"){ 
                    setIsAuthorized(true); setUserRole('superuser'); 
                    sessionStorage.setItem('tmp_auth', 'true'); sessionStorage.setItem('tmp_role', 'superuser');
                } else if (code === "DTMP2026") {
                    setIsAuthorized(true); setUserRole('admin'); 
                    sessionStorage.setItem('tmp_auth', 'true'); sessionStorage.setItem('tmp_role', 'admin');
                } else if (code === "JTMP2026") {
                    setIsAuthorized(true); setUserRole('viewer'); 
                    sessionStorage.setItem('tmp_auth', 'true'); sessionStorage.setItem('tmp_role', 'viewer');
                } else { 
                    setLoginError("Kod Akses Salah");
                }
            };

            const handleLogout = () => {
                try {
                    sessionStorage.removeItem('tmp_auth');
                    sessionStorage.removeItem('tmp_role');
                    sessionStorage.clear();
                    localStorage.clear();
                    if (window.TMP_DB) window.TMP_DB.signOut(window.TMP_DB.auth).catch(() => {});
                } catch (e) {}
                setIsAuthorized(false);
                setUserRole(null);
                window.location.reload(); 
            };

            const isSlotBreak = (day, slotIdx) => {
                const slot = timeSlots[slotIdx];
                if (slot === '10.00 - 10.30') return true; 
                if (day !== 'Jumaat' && slot === '1.00 - 2.00') return true; 
                if (day === 'Jumaat') return [4, 5, 6].includes(slotIdx); 
                return false;
            };

            const isLocked = (event) => {
                if (!event || !event.lastUpdate) return false;
                return (Date.now() - event.lastUpdate) > (24 * 60 * 60 * 1000);
            };

            const getDisplayDateForDay = (dayIdx) => {
                const start = new Date(sessionStartDate);
                start.setDate(start.getDate() + (selectedWeek - 1) * 7 + dayIdx);
                return start.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
            };

            const getCourseSemesterCount = (courseCode) => {
                if (!courseCode) return 0;
                return Object.values(events).filter(ev => 
                    ev && ev.courseCode && typeof ev.courseCode === 'string' && ev.courseCode.trim() === courseCode.trim() && ev.session === academicSession && ev.cycle === academicCycle
                ).length;
            };

            const handleSave = async (e) => {
                if (e) e.preventDefault();
                if (userRole === 'viewer') return;
                setModalError(""); 

                // Halang admin daripada mengubah slot yang telah disimpan
                if (userRole === 'admin' && editingEvent) {
                    setModalError("Ralat: Slot yang telah disimpan tidak boleh diubah. Sila hubungi Supervisor.");
                    return;
                }

                const finalCode = formData.type === 'Lain-lain' ? 'Lain-Lain' : formData.courseCode;
                
                if (userRole === 'admin' && formData.type !== 'Lain-lain') {
                    let currentCount = getCourseSemesterCount(finalCode);
                    if (editingEvent && editingEvent.courseCode === finalCode) {
                        currentCount -= 1; 
                    }
                    const limit = courseLimits[finalCode] || 999;
                    if (currentCount >= limit) {
                        setModalError(`Ralat: Had agihan (${limit}) semester bagi kursus ${finalCode} telah dicapai.`);
                        return;
                    }
                }

                if (formData.instructor && formData.instructor.trim() !== "" && formData.instructor !== "Lain-lain") {
                    const isConflict = Object.values(events).some(ev => {
                        if (!ev || ev.instructor !== formData.instructor) return false;
                        if (ev.session !== academicSession || ev.cycle !== academicCycle || ev.selectedWeek !== selectedWeek || ev.day !== formData.day) return false;
                        if (ev.semester === formData.semester) return false;

                        const exStart = parseInt(ev.timeSlotIndex);
                        const exEnd = exStart + parseInt(ev.duration) - 1;
                        const newStart = parseInt(formData.timeSlotIndex);
                        const newEnd = newStart + parseInt(formData.duration) - 1;

                        return (newStart <= exEnd && newEnd >= exStart);
                    });

                    if (isConflict) {
                        setModalError(`Peringatan: Pengajar ${formData.instructor} telah dijadualkan pada masa yang sama untuk semester lain pada hari ini. Sila pilih waktu atau pengajar lain.`);
                        return;
                    }
                }
                
                const key = `${academicSession}-${selectedWeek}-${formData.day}-${formData.semester}-${formData.timeSlotIndex}`;
                const dataToSave = {
                    id: formData.id || Math.random().toString(36).substr(2, 9),
                    day: formData.day,
                    timeSlotIndex: formData.timeSlotIndex,
                    courseCode: finalCode || '',
                    topic: formData.topic || '',
                    type: formData.type || 'Kuliah',
                    instructor: formData.instructor || '',
                    semester: formData.semester,
                    duration: parseInt(formData.duration) || 1,
                    sessionNumber: formData.sessionNumber || '',
                    cycle: academicCycle,
                    session: academicSession,
                    lastUpdate: Date.now(),
                    selectedWeek: selectedWeek
                };

                // Kemas kini UI serta-merta tanpa menunggu awan (Optimistic Update)
                setEvents(prev => ({ ...prev, [key]: dataToSave }));
                setIsModalOpen(false);

                // Proses penghantaran ke awan dibuat di latar belakang
                if (window.TMP_DB) {
                    const { db, appId, doc, setDoc } = window.TMP_DB;
                    setDoc(doc(db, 'artifacts', appId, 'public', 'data', `jadual_cycle_${academicCycle}`, key), dataToSave)
                        .catch(error => console.error("Firestore Error:", error));
                }
            };

            const handleDelete = async (e) => {
                if (e) e.preventDefault();
                // Hanya superuser (Supervisor) sahaja boleh memadam slot
                if (userRole === 'viewer' || userRole === 'admin') return;
                const key = `${academicSession}-${selectedWeek}-${formData.day}-${formData.semester}-${formData.timeSlotIndex}`;
                
                if (userRole === 'superuser') {
                    // Padam dari UI serta-merta
                    setEvents(prev => { const next = {...prev}; delete next[key]; return next; });
                    setIsModalOpen(false); 
                    
                    if (window.TMP_DB) {
                        const { db, appId, doc, deleteDoc } = window.TMP_DB;
                        deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', `jadual_cycle_${academicCycle}`, key))
                            .catch(error => console.error("Firestore Error:", error));
                    }
                }
            };

            const handleExportPDF = () => {
                const element = printAreaRef.current;
                const container = tableContainerRef.current;
                
                const originalOverflow = container.style.overflow;
                const originalMaxHeight = container.style.maxHeight;
                const originalBorder = container.style.border;
                
                const noPrintElements = element.querySelectorAll('.no-print');
                const originalDisplays = [];
                noPrintElements.forEach(el => {
                    originalDisplays.push(el.style.display);
                    el.style.display = 'none';
                });

                container.style.overflow = 'visible';
                container.style.maxHeight = 'none';
                container.style.border = 'none';

                const fullWidth = container.scrollWidth;

                const opt = {
                    margin: [0.3, 0.3, 0.3, 0.3], 
                    filename: `JWM_TMP_Minggu_${selectedWeek}_Versi_${academicCycle}.pdf`,
                    image: { type: 'jpeg', quality: 1 },
                    html2canvas: { 
                        scale: 2, 
                        useCORS: true, 
                        logging: false,
                        windowWidth: fullWidth + 50,
                        width: fullWidth,
                        scrollY: 0
                    },
                    jsPDF: { unit: 'in', format: 'a3', orientation: 'landscape' } 
                };

                html2pdf().set(opt).from(element).save().then(() => {
                    container.style.overflow = originalOverflow;
                    container.style.maxHeight = originalMaxHeight;
                    container.style.border = originalBorder;
                    
                    noPrintElements.forEach((el, index) => {
                        el.style.display = originalDisplays[index];
                    });
                });
            };

            // --- 4. MEMOIZED DATA ---
            const currentWeekHasSaturday = useMemo(() => saturdayConfigs[`${academicCycle}-${selectedWeek}`] === true, [saturdayConfigs, selectedWeek, academicCycle]);
            const visibleDays = useMemo(() => currentWeekHasSaturday ? days : days.slice(0, 5), [currentWeekHasSaturday]);

            // Status Minggu (TERMASUK PEPERIKSAAN AKHIR SEMESTER)
            const weekStatus = useMemo(() => {
                let customStatus = weekStatuses[`${academicCycle}-${selectedWeek}`];
                if (customStatus === "PEPERIKSAAN") customStatus = "PEPERIKSAAN AKHIR SEMESTER"; // Kemas kini status lama
                if (customStatus && customStatus !== "NORMAL") return customStatus;
                if (customStatus === "NORMAL") return "NORMAL";

                if (selectedWeek === 10) return "CUTI PERTENGAHAN SEMESTER";
                if ([21, 22, 23].includes(selectedWeek)) return "PEPERIKSAAN AKHIR SEMESTER";
                if ([24, 25, 26].includes(selectedWeek)) return "CUTI AKHIR SEMESTER";
                return "NORMAL";
            }, [selectedWeek, weekStatuses, academicCycle]);

            const handleOpenModalInternal = (day, sem, slotIdx, event = null) => {
                // BLOK PENGISIAN PADA MINGGU CUTI/PEPERIKSAAN
                if (weekStatus !== "NORMAL") return;
                
                if (isSlotBreak(day, slotIdx) || userRole === 'viewer') return;
                setModalError(""); 
                if (event) {
                    setFormData({ ...event, customCourseCode: courseCodes.includes(event.courseCode) ? '' : event.courseCode });
                    setEditingEvent(event);
                } else {
                    setFormData({ id: Math.random().toString(36).substr(2, 9), day, semester: sem, timeSlotIndex: slotIdx, courseCode: courseCodes[0], customCourseCode: '', topic: '', type: 'Kuliah', instructor: '', duration: 1, sessionNumber: '' });
                    setEditingEvent(null);
                }
                setIsModalOpen(true);
            };

            const handleFooterChange = async (field, val) => {
                if (userRole === 'viewer' || !window.TMP_DB) return;
                const next = { ...footerData, [field]: val };
                setFooterData(next);
                const { db, appId, doc, setDoc } = window.TMP_DB;
                try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', `jadual_meta_${academicCycle}`, 'signatures'), next); } catch(e) {}
            };

            const saveLimits = async (newLimits) => {
                const { db, appId, doc, setDoc } = window.TMP_DB;
                try { 
                    const cleanLimits = {};
                    Object.keys(newLimits).forEach(k => { cleanLimits[k] = parseInt(newLimits[k]) || 0; });
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'jadual_meta_shared', 'course_limits'), cleanLimits); 
                    setIsLimitModalOpen(false); 
                } catch (e) { console.error("Gagal menyimpan agihan."); }
            };

            const autoWeekRange = useMemo(() => {
                const start = new Date(sessionStartDate);
                start.setDate(start.getDate() + (selectedWeek - 1) * 7);
                const end = new Date(start);
                end.setDate(start.getDate() + (currentWeekHasSaturday ? 5 : 4));
                return `${start.toLocaleDateString('en-GB')} - ${end.toLocaleDateString('en-GB')}`;
            }, [sessionStartDate, selectedWeek, currentWeekHasSaturday]);

            const currentSessionAcademic = useMemo(() => {
                const yr = new Date().getFullYear();
                return academicSession === 'Oktober - Mac' ? `Oktober ${yr} - Mac ${yr + 1}` : `${academicSession} ${yr}`;
            }, [academicSession]);

            const dashboardData = useMemo(() => {
                const courseSum = {}, instructorSum = {};
                Object.values(events).filter(ev => 
                    ev && ev.session === academicSession && ev.cycle === academicCycle && 
                    ev.courseCode && typeof ev.courseCode === 'string' && ev.courseCode.trim() !== "" && ev.courseCode !== "Lain-lain"
                ).forEach(ev => {
                    const hours = parseInt(ev.duration || 1);
                    const course = ev.courseCode;
                    const instructor = ev.instructor && ev.instructor.trim() !== "" ? ev.instructor : 'Tidak Dinamakan';
                    if(!courseSum[course]) courseSum[course] = { total: 0, Kuliah: 0, Amali: 0, Tutorial: 0 };
                    courseSum[course].total += hours; 
                    if(ev.type in courseSum[course]) courseSum[course][ev.type] += hours;
                    if(!instructorSum[instructor]) instructorSum[instructor] = { total: 0 };
                    instructorSum[instructor].total += hours;
                });
                return { courseSum, instructorSum };
            }, [events, academicSession, academicCycle]);

            // --- 5. EFFECTS ---
            useEffect(() => {
                const interval = setInterval(() => { if (window.TMP_DB) { setDbReady(true); clearInterval(interval); } }, 50);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                const savedAuth = sessionStorage.getItem('tmp_auth');
                const savedRole = sessionStorage.getItem('tmp_role');
                if (savedAuth === 'true' && savedRole) { setIsAuthorized(true); setUserRole(savedRole); }
            }, []);

            useEffect(() => {
                if (!dbReady || !window.TMP_DB) return;
                const { auth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } = window.TMP_DB;
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { 
                            try {
                                await signInWithCustomToken(auth, __initial_auth_token); 
                            } catch (err) {
                                console.warn("Fallback ke anonymous auth kerana token tidak sepadan:", err);
                                await signInAnonymously(auth);
                            }
                        } else { 
                            await signInAnonymously(auth); 
                        }
                    } catch (e) { console.error("Auth init err:", e); }
                };
                
                initAuth();
                const unsubAuth = onAuthStateChanged(auth, setUser);
                return () => unsubAuth();
            }, [dbReady]);

            useEffect(() => {
                if (!dbReady || !isAuthorized || !window.TMP_DB || !user) return;
                const { db, appId, collection, onSnapshot, doc } = window.TMP_DB;
                const unsubEv = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', `jadual_cycle_${academicCycle}`), 
                    (s) => { const d = {}; s.forEach(doc => { d[doc.id] = doc.data(); }); setEvents(d); },
                    (err) => console.error("Error events:", err)
                );
                const unsubLim = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'jadual_meta_shared', 'course_limits'), 
                    (d) => { if(d.exists()) setCourseLimits(d.data()); },
                    (err) => console.error("Error limits:", err)
                );
                const unsubSig = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', `jadual_meta_${academicCycle}`, 'signatures'), 
                    (d) => { if(d.exists()) setFooterData(d.data()); },
                    (err) => console.error("Error sigs:", err)
                );
                const unsubSat = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'jadual_meta_shared', 'saturday_configs'), 
                    (d) => { if(d.exists()) setSaturdayConfigs(d.data()); },
                    (err) => console.error("Error sat:", err)
                );
                const unsubHol = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'jadual_meta_shared', 'holidays'), 
                    (d) => { if(d.exists()) setHolidays(d.data()); },
                    (err) => console.error("Error hol:", err)
                );
                const unsubWeekStat = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'jadual_meta_shared', 'week_statuses'), 
                    (d) => { if(d.exists()) setWeekStatuses(d.data()); },
                    (err) => console.error("Error week_stat:", err)
                );
                const unsubSemSig = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', `jadual_meta_${academicCycle}`, 'signatures_by_sem'), 
                    (d) => { if(d.exists()) setSemSignatures(d.data()); },
                    (err) => console.error("Error sem sigs:", err)
                );
                return () => { unsubEv(); unsubLim(); unsubSig(); unsubSat(); unsubHol(); unsubWeekStat(); unsubSemSig(); };
            }, [dbReady, isAuthorized, user, academicCycle]);

            useEffect(() => {
                if (!tableElementRef.current) return;
                const updateWidth = () => setTableWidth(tableElementRef.current.scrollWidth);
                const ro = new ResizeObserver(updateWidth);
                ro.observe(tableElementRef.current);
                updateWidth();
                return () => ro.disconnect();
            }, [isAuthorized, filterSemester, saturdayConfigs]);

            useEffect(() => {
                if (filterSemester && filterSemester !== 'SEMUA') {
                    setActiveSigSemester(filterSemester);
                }
            }, [filterSemester]);

            const handleLocalSigChange = (field, value) => {
                setSemSignatures(prev => ({
                    ...prev,
                    [activeSigSemester]: {
                        ...(prev[activeSigSemester] || { preparedName: '', preparedDate: '' }),
                        [field]: value
                    }
                }));
                setSigSaveStatus('');
            };

            const handleSaveSemSignature = async () => {
                if (userRole === 'viewer' || !window.TMP_DB) return;
                const { db, appId, doc, setDoc } = window.TMP_DB;
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', `jadual_meta_${academicCycle}`, 'signatures_by_sem'), semSignatures);
                    setSigSaveStatus('Berjaya Disimpan!');
                    setTimeout(() => setSigSaveStatus(''), 3000);
                } catch (e) {
                    console.error("Gagal menyimpan penyelaras:", e);
                    setSigSaveStatus('Ralat Menyimpan');
                }
            };

            // --- 6. UI RENDER ---
            if (!isAuthorized) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-blue-900 p-6 text-black">
                        <div className="bg-white p-10 rounded-[3rem] shadow-2xl max-w-md w-full border-4 border-white text-black text-center">
                            <div className="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center text-white mx-auto mb-6 shadow-xl"><Icons.Lock /></div>
                            <h2 className="text-xl font-black mb-8 uppercase text-slate-800 leading-tight">Akses Jadual TMP Digital</h2>
                            <form onSubmit={handleLogin}>
                                <input type="password" value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="Kod Akses" className="w-full px-6 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black text-center mb-4 outline-none focus:border-blue-600 text-black font-bold" autoFocus />
                                <button type="submit" className="w-full py-4 bg-blue-600 text-white rounded-2xl font-black uppercase hover:bg-blue-700 transition-all shadow-md">Masuk</button>
                                {loginError && <p className="mt-4 text-red-600 font-bold text-xs uppercase">Kod Akses Salah</p>}
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="pb-20 bg-white min-h-screen text-black font-sans">
                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-[100] px-6 py-4 no-print shadow-sm flex flex-col gap-4">
                        <div className="max-w-[98%] mx-auto w-full flex flex-col gap-4">
                            <div className="flex flex-wrap items-center justify-between gap-4">
                                <div className="flex items-center gap-4">
                                    <div className="bg-blue-700 p-2 rounded-xl text-white font-black italic shadow-lg">TMP</div>
                                    <div className="flex flex-col">
                                        <h1 className="font-black text-slate-800 text-lg leading-none uppercase tracking-tight">JWM MASTER</h1>
                                        <div className="flex items-center gap-2 mt-1">
                                            <button onClick={() => setAcademicCycle('A')} className={`px-2 py-0.5 rounded text-[9px] font-black uppercase ${academicCycle === 'A' ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 text-slate-400'}`}>Versi A</button>
                                            <button onClick={() => setAcademicCycle('B')} className={`px-2 py-0.5 rounded text-[9px] font-black uppercase ${academicCycle === 'B' ? 'bg-orange-600 text-white shadow-md' : 'bg-slate-100 text-slate-400'}`}>Versi B</button>
                                            <span className="ml-2 px-2 py-0.5 bg-slate-800 text-white rounded text-[8px] font-black uppercase tracking-widest"><Icons.User /> {userRole}</span>
                                            {(userRole === 'admin' || userRole === 'superuser') && (
                                                <button onClick={() => setIsDashboardOpen(true)} className="ml-2 px-2 py-0.5 bg-green-600 text-white rounded text-[8px] font-black uppercase flex items-center gap-1 shadow-sm hover:bg-green-700 transition-all text-white"><Icons.Chart /> Dashboard</button>
                                            )}
                                            {userRole === 'superuser' && (
                                                <button onClick={() => setIsLimitModalOpen(true)} className="ml-2 px-2 py-0.5 bg-indigo-600 text-white rounded text-[8px] font-black uppercase flex items-center gap-1 shadow-sm hover:bg-indigo-700 transition-all text-white"><Icons.Settings /> Agihan</button>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex flex-wrap items-center gap-3">
                                    <div className="relative group no-print">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><Icons.Search /></div>
                                        <input type="text" placeholder="Cari..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-xl py-2 pl-9 pr-4 text-xs font-black outline-none focus:border-blue-600 transition-all text-black w-40" />
                                    </div>
                                    
                                    {userRole !== 'viewer' && (
                                        <div className="flex items-center gap-1 bg-slate-50 px-2 py-1.5 rounded-xl border border-slate-200 h-[34px]">
                                            <span className="text-[9px] font-black uppercase text-rose-500 mr-1">Cuti HKA/CT:</span>
                                            {visibleDays.map(d => {
                                                const holKey = `${academicCycle}-${selectedWeek}-${d}`;
                                                const isHol = holidays[holKey];
                                                return (
                                                    <button key={d} onClick={() => {
                                                        const next = !isHol;
                                                        setHolidays({...holidays, [holKey]: next});
                                                        if(window.TMP_DB) window.TMP_DB.setDoc(window.TMP_DB.doc(window.TMP_DB.db, 'artifacts', window.TMP_DB.appId, 'public', 'data', 'jadual_meta_shared', 'holidays'), {...holidays, [holKey]: next}).catch(e=>console.error(e));
                                                    }} className={`w-6 h-6 rounded-md text-[10px] font-black transition-all flex items-center justify-center ${isHol ? 'bg-rose-500 text-white shadow-sm' : 'bg-white text-slate-400 border border-slate-200 hover:bg-slate-100'}`}>
                                                        {d.substring(0, 1)}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    )}

                                    {userRole !== 'viewer' && (
                                        <div className="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 h-[34px]">
                                            <span className="text-[9px] font-black uppercase text-slate-400">Sabtu</span>
                                            <button onClick={() => {
                                                const satKey = `${academicCycle}-${selectedWeek}`;
                                                const next = !currentWeekHasSaturday;
                                                setSaturdayConfigs({...saturdayConfigs, [satKey]: next});
                                                if(window.TMP_DB) window.TMP_DB.setDoc(window.TMP_DB.doc(window.TMP_DB.db, 'artifacts', window.TMP_DB.appId, 'public', 'data', 'jadual_meta_shared', 'saturday_configs'), {...saturdayConfigs, [satKey]: next}).catch(e=>console.error(e));
                                            }} className={`w-8 h-4 rounded-full relative transition-all ${currentWeekHasSaturday ? 'bg-green-500' : 'bg-slate-300'}`}>
                                                <div className={`absolute top-0.5 w-3 h-3 bg-white rounded-full transition-all ${currentWeekHasSaturday ? 'left-4' : 'left-0.5'}`}></div>
                                            </button>
                                        </div>
                                    )}

                                    {userRole === 'superuser' && (
                                        <div className="flex items-center gap-1 bg-purple-50 px-2 py-1.5 rounded-xl border border-purple-200 h-[34px] no-print">
                                            <span className="text-[9px] font-black uppercase text-purple-600 mr-1">Status M{selectedWeek}:</span>
                                            <select 
                                                value={weekStatuses[`${academicCycle}-${selectedWeek}`] || (weekStatus === "NORMAL" ? "NORMAL" : weekStatus)}
                                                onChange={(e) => {
                                                    const statKey = `${academicCycle}-${selectedWeek}`;
                                                    const nextStat = e.target.value;
                                                    setWeekStatuses({...weekStatuses, [statKey]: nextStat});
                                                    if(window.TMP_DB) window.TMP_DB.setDoc(window.TMP_DB.doc(window.TMP_DB.db, 'artifacts', window.TMP_DB.appId, 'public', 'data', 'jadual_meta_shared', 'week_statuses'), {...weekStatuses, [statKey]: nextStat}).catch(err=>console.error(err));
                                                }}
                                                className="bg-transparent text-purple-800 text-[10px] font-black outline-none cursor-pointer uppercase"
                                            >
                                                <option value="NORMAL">Biasa (Normal)</option>
                                                <option value="CUTI PERTENGAHAN SEMESTER">Cuti Pertengahan Sem</option>

                                        <button key={w} onClick={() => setSelectedWeek(w)} className={`shrink-0 min-w-[42px] py-1.5 rounded-xl font-black text-xs transition-all ${selectedWeek === w ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-400 hover:bg-slate-100'}`}>M{w}</button>

                    <main ref={printAreaRef} className="max-w-[99%] mx-auto p-4 md:p-8 print:p-0">
                        <div className="relative mb-6 text-center border-b-2 border-black pb-4 text-black">
                            <div className="absolute top-0 right-0 text-[10px] md:text-[12px] font-bold text-black uppercase tracking-tighter">BPL.KKM.PK(T) 048B/17</div>
                            <div className="flex justify-center mb-1 mt-4" style={{ minHeight: '90px', alignItems: 'center', justifyContent: 'center' }}>
                                <img 
                                    src="https://upload.wikimedia.org/wikipedia/commons/2/26/Coat_of_arms_of_Malaysia.svg" 
                                    alt="Jata Negara" 
                                    style={{ width: '90px', height: '90px', objectFit: 'contain', display: 'block' }}
                                    crossOrigin="anonymous"
                                    referrerPolicy="no-referrer"
                                    onError={(e) => { e.target.style.display = 'none'; }} 
                                />
                            </div>
                            <h1 className="text-lg font-black uppercase leading-tight mt-3">KEMENTERIAN KESIHATAN MALAYSIA</h1>
                            <h2 className="text-base font-bold uppercase underline underline-offset-4 tracking-wide">Jadual Waktu Mingguan</h2>
                            
                            <div className="mt-6 flex flex-col text-left gap-2 font-sans">
                                <div className="flex items-center gap-2">
                                    <span className="font-black text-[12px] uppercase shrink-0">NAMA INSTITUSI:</span>
                                    <span className="font-bold text-[12px] uppercase">INSTITUT LATIHAN KEMENTERIAN KESIHATAN MALAYSIA KUCHING, SARAWAK</span>
                                </div>
                                <div className="flex justify-between items-end">
                                    <div className="flex items-center gap-8">
                                        <div className="flex items-center gap-2">
                                            <span className="font-black text-[12px] uppercase">TARIKH:</span>
                                            <span className="font-bold text-[12px] text-blue-700 uppercase tracking-tight">{autoWeekRange}</span>
                                        </div>
                                        <div className="flex items-center gap-2 text-black">
                                            <span className="font-black text-[12px] uppercase">SEMESTER:</span>
                                            <select value={filterSemester} onChange={e => setFilterSemester(e.target.value)} className="font-bold text-[12px] uppercase text-black bg-slate-100 px-2 py-0.5 rounded no-print outline-none cursor-pointer border border-slate-200">
                                                <option value="SEMUA">Semua Semester</option>
                                                {semesters.map(s => <option key={s} value={s}>{semesterLabels[s]}</option>)}
                                            </select>
                                            <span className="hidden print:inline font-bold text-[12px] uppercase">{filterSemester === 'SEMUA' ? 'Semua' : semesterLabels[filterSemester]}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="font-black text-[12px] uppercase">SESI AKADEMIK:</span>
                                            <span className="font-bold text-[12px] uppercase">{currentSessionAcademic}</span>
                                        </div>
                                    </div>
                                    <div className="text-right pr-8">
                                        <h2 className="text-xl font-black uppercase leading-none">MINGGU {selectedWeek}</h2>
                                        {weekStatus !== "NORMAL" && <p className="text-[10px] text-red-600 uppercase font-black tracking-widest mt-1">{weekStatus}</p>}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div ref={topScrollRef} className="sync-scroll-container no-print">
                            <div style={{ width: `${tableWidth}px`, height: '1px' }}></div>
                        </div>

                        <div ref={tableContainerRef} className="freeze-container table-to-scroll">
                            <div ref={tableElementRef}>
                                <table className="w-full border-collapse table-fixed min-w-[1500px] print:min-w-full text-black">
                                    <thead>
                                        <tr className="bg-slate-50 border-b-2 border-black text-[12px] font-black uppercase">
                                            <th className="w-36 p-4 border-r border-black">Hari / Tarikh</th>
                                            <th className="w-16 border-r border-black text-center">Sem</th>
                                            {timeSlots.map(slot => (<th key={slot} className="p-3 border-r border-black text-center">{slot}</th>))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {visibleDays.map((day, dIdx) => {
                                            const vSems = filterSemester === 'SEMUA' ? semesters : [filterSemester];
                                            return vSems.map((sem, sIdx) => {
                                                const skips = [];
                                                return (
                                                    <tr key={`${day}-${sem}`} className={`border-b border-black/20 ${sIdx === vSems.length - 1 ? 'border-b-2 border-black' : ''}`}>
                                                        {sIdx === 0 && (
                                                            <td rowSpan={vSems.length} className="p-4 bg-white border-r border-black text-center align-middle">
                                                                <div className="font-black uppercase text-xs">{day}</div>
                                                                <div className="text-[10px] font-black text-blue-700 bg-blue-50 px-2 py-1 rounded inline-block mt-1">{getDisplayDateForDay(dIdx)}</div>
                                                            </td>
                                                        )}
                                                        <td className="p-2 bg-white text-center font-black text-[11px] border-r border-black">{sem}</td>
                                                        
                                                        {weekStatus !== "NORMAL" ? (
                                                            sIdx === 0 ? (
                                                                <td colSpan={timeSlots.length} rowSpan={vSems.length} className="bg-slate-200 border-r border-black p-4 text-center align-middle relative overflow-hidden">
                                                                    <div className="absolute inset-0 opacity-10" style={{ backgroundImage: 'repeating-linear-gradient(45deg, #000 0, #000 2px, transparent 2px, transparent 8px)' }}></div>
                                                                    <span className="relative z-10 text-xl md:text-2xl font-black uppercase tracking-[0.3em] text-slate-600 opacity-90">
                                                                        {weekStatus}
                                                                    </span>
                                                                </td>
                                                            ) : null
                                                        ) : (
                                                            timeSlots.map((slot, slotIdx) => {
                                                                if (skips.includes(slotIdx)) return null;
                                                                const key = `${academicSession}-${selectedWeek}-${day}-${sem}-${slotIdx}`;
                                                                const ev = events[key];
                                                                const isBreak = isSlotBreak(day, slotIdx);
                                                                const isHoliday = holidays[`${academicCycle}-${selectedWeek}-${day}`];
                                                                
                                                                if (isHoliday) {
                                                                    if (sIdx === 0) return (<td key={slotIdx} rowSpan={vSems.length} className="bg-rose-50/60 border-r border-black p-2 text-center align-middle"> <span className="text-[10px] font-black uppercase vertical-text tracking-[0.4em] text-rose-500 opacity-80">CUTI (HKA / CT)</span> </td>);
                                                                    return null;
                                                                }
                                                                if (isBreak) {
                                                                    if (sIdx === 0) return (<td key={slotIdx} rowSpan={vSems.length} className="bg-slate-100 border-r border-black text-center align-middle"> <span className="text-[10px] font-black uppercase vertical-text tracking-[0.4em] opacity-30">REHAT</span> </td>);
                                                                    return null;
                                                                }

                                                                let colSpan = 1;
                                                                if (ev && ev.duration > 1) { for(let i=1; i<ev.duration; i++) { if(!isSlotBreak(day, slotIdx+i)) { colSpan++; skips.push(slotIdx+i); } else break; } }
                                                                
                                                                const isMatch = searchTerm && searchTerm.trim() !== "" && ev && ev.courseCode && (
                                                                    ev.courseCode.toLowerCase().includes(searchTerm.toLowerCase()) || (ev.instructor && ev.instructor.toLowerCase().includes(searchTerm.toLowerCase()))
                                                                );

                                                                return (
                                                                    <td key={slotIdx} colSpan={colSpan} className={`p-1 border-r border-black/20 h-32 align-top ${key === lastUpdatedKey ? 'highlight-new' : ''}`}>
                                                                        <div onClick={() => handleOpenModalInternal(day, sem, slotIdx, ev)} className={`h-full w-full rounded-xl p-2 text-[10px] overflow-hidden transition-all ${ev && ev.courseCode ? `flex flex-col ${sessionTypes.find(t => t.value === ev.type)?.color || 'bg-white border-l-4'}` : 'border-2 border-dashed border-slate-100 flex items-center justify-center text-slate-200'} ${isMatch ? 'search-match' : ''} ${userRole !== 'viewer' ? 'cursor-pointer active:scale-95' : ''}`}>
                                                                            {ev && ev.courseCode ? (
                                                                                <React.Fragment>
                                                                                    <div className="font-black uppercase truncate border-b border-black/5 pb-1 mb-1 leading-tight shrink-0">
                                                                                        {ev.courseCode} {ev.sessionNumber ? `${sessionInitials[ev.type].replace(')', ev.sessionNumber + ')')}` : sessionInitials[ev.type] || '(L)'}
                                                                                        {isLocked(ev) && <span className="ml-1 text-red-500"><Icons.Lock /></span>}
                                                                                    </div>
                                                                                    <div className="font-bold leading-tight mb-1 flex-1 overflow-y-auto" style={{ scrollbarWidth: 'none', msOverflowStyle: 'none' }}>{ev.topic}</div>
                                                                                    <div className="mt-auto font-black opacity-60 text-[8px] uppercase leading-tight break-words pt-1 shrink-0">{ev.instructor}</div>
                                                                                </React.Fragment>
                                                                            ) : (userRole !== 'viewer' && <Icons.Plus />)}
                                                                        </div>
                                                                    </td>
                                                                );
                                                            })
                                                        )}
                                                    </tr>
                                                );
                                            });
                                        })}
                                    </tbody>
                                </table>
                            </div>
                            
                            <div className="p-10 border-t-2 border-black grid grid-cols-2 gap-40 font-bold text-[11px]">
                                <div>
                                    <p className="uppercase text-slate-800 tracking-wider">DISEDIAKAN OLEH:</p>
                                    
                                    {/* Pemilihan Semester Penyelaras (no-print) */}
                                    <div className="mt-4 flex flex-wrap items-center gap-2 no-print">
                                        <span className="text-[10px] text-slate-400 font-black uppercase">Untuk Semester:</span>
                                        <select 
                                            value={activeSigSemester} 
                                            onChange={e => { setActiveSigSemester(e.target.value); setSigSaveStatus(''); }}
                                            className="bg-slate-50 border border-slate-200 rounded-lg p-1 text-[10px] font-black cursor-pointer text-black"
                                        >
                                            {semesters.map(s => <option key={s} value={s}>{semesterLabels[s]}</option>)}
                                        </select>
                                    </div>

                                    {/* Dropdown Senarai Pengajar (no-print) */}
                                    <div className="mt-3 flex flex-wrap items-center gap-2 no-print">
                                        <span className="text-[10px] text-slate-400 font-black uppercase">Pilih Penyelaras:</span>
                                        <select 
                                            value={semSignatures[activeSigSemester]?.preparedName || ''} 
                                            onChange={e => handleLocalSigChange('preparedName', e.target.value)}
                                            className="bg-emerald-50 border border-emerald-200 rounded-lg p-1 text-[10px] font-black cursor-pointer text-emerald-900 w-56"
                                            disabled={userRole === 'viewer'}
                                        >
                                            <option value="">-- Pilih Pengajar --</option>
                                            {instructorList.map(name => <option key={name} value={name}>{name}</option>)}
                                        </select>
                                    </div>

                                    <div className="mt-8 border-b border-black flex items-center gap-2">
                                        <span className="shrink-0">NAMA:</span>
                                        <input 
                                            type="text" 
                                            className="bg-transparent outline-none w-full font-black uppercase" 
                                            value={semSignatures[activeSigSemester]?.preparedName || ''} 
                                            onChange={e => handleLocalSigChange('preparedName', e.target.value)}
                                            placeholder="NAMA PENYELARAS AMBILAN"
                                            disabled={userRole === 'viewer'}
                                        />
                                        {semSignatures[activeSigSemester]?.preparedName && userRole !== 'viewer' && (
                                            <button 
                                                onClick={() => handleLocalSigChange('preparedName', '')}
                                                className="no-print p-1 text-slate-400 hover:text-red-600 transition-all"
                                                title="Padam Nama"
                                            >
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3">
                                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                                </svg>
                                            </button>
                                        )}
                                    </div>
                                    <p className="mt-1 font-bold uppercase text-slate-500">PENGAJAR PENYELARAS ({semesterLabels[activeSigSemester]})</p>
                                    
                                    <div className="mt-4 flex items-center gap-2">
                                        <span className="shrink-0">TARIKH:</span> 
                                        <input 
                                            type="date" 
                                            className="bg-transparent outline-none font-bold" 
                                            value={semSignatures[activeSigSemester]?.preparedDate || ''} 
                                            onChange={e => handleLocalSigChange('preparedDate', e.target.value)}
                                            disabled={userRole === 'viewer'}
                                        />
                                        {semSignatures[activeSigSemester]?.preparedDate && userRole !== 'viewer' && (
                                            <button 
                                                onClick={() => handleLocalSigChange('preparedDate', '')}
                                                className="no-print p-1 text-slate-400 hover:text-red-600 transition-all"
                                                title="Padam Tarikh"
                                            >
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3">
                                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                                </svg>
                                            </button>
                                        )}
                                    </div>

                                    {/* Butang Simpan Penyelaras */}
                                    {userRole !== 'viewer' && (
                                        <div className="mt-4 flex items-center gap-2 no-print">
                                            <button 
                                                onClick={handleSaveSemSignature}
                                                className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-[10px] font-black uppercase tracking-wider flex items-center gap-1 shadow-md transition-all active:scale-95"
                                            >
                                                <Icons.Save /> Simpan Penyelaras
                                            </button>
                                            {(semSignatures[activeSigSemester]?.preparedName || semSignatures[activeSigSemester]?.preparedDate) && (
                                                <button 
                                                    onClick={() => {
                                                        handleLocalSigChange('preparedName', '');
                                                        handleLocalSigChange('preparedDate', '');
                                                    }}
                                                    className="px-3 py-1.5 bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 rounded-xl text-[10px] font-black uppercase tracking-wider flex items-center gap-1 transition-all active:scale-95"
                                                    title="Padam Semua Info Penyelaras"
                                                >
                                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" className="mr-0.5">
                                                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
                                                    </svg>
                                                    Kosongkan
                                                </button>
                                            )}
                                            {sigSaveStatus && (
                                                <span className={`text-[10px] font-black uppercase px-2 py-1 rounded-md ${sigSaveStatus.includes('Ralat') ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                                    {sigSaveStatus}
                                                </span>
                                            )}
                                        </div>
                                    )}
                                </div>
                                <div>
                                    <p>DISAHKAN OLEH:</p>
                                    <div className="mt-8 border-b border-black flex gap-2">NAMA: <input type="text" className="bg-transparent outline-none w-full font-black uppercase" value={footerData.verifiedName || ''} onChange={e => handleFooterChange('verifiedName', e.target.value)} /></div>
                                    <p className="mt-1 font-bold uppercase">TIMBALAN PENGARAH AKADEMIK / KETUA PROGRAM</p>
                                    <div className="mt-4 flex gap-2">TARIKH: <input type="date" className="bg-transparent outline-none font-bold" value={footerData.verifiedDate || ''} onChange={e => handleFooterChange('verifiedDate', e.target.value)} /></div>
                                </div>
                                <div className="col-span-2 text-center pt-8 opacity-40 text-[9px] italic">** Harold Criso Anak Ajin **</div>
                            </div>
                        </div>
                    </main>

                    {/* MODAL EDITOR KEMAS KINI SLOT */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm no-print animate-in fade-in duration-300 text-black">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-xl max-h-[95vh] overflow-hidden border-4 border-blue-600 flex flex-col scale-100">
                                <div className="bg-slate-50 px-10 py-6 border-b-2 flex justify-between items-center text-black">
                                    <h3 className="font-black text-lg uppercase">Kemas Kini Slot</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="bg-red-600 text-white p-2 rounded-xl shadow-lg hover:rotate-90 transition-all"><Icons.X /></button>
                                </div>
                                <div className="p-10 space-y-6 overflow-y-auto flex-1 bg-white text-black">
                                    {modalError && (
                                        <div className="bg-red-100 p-4 rounded-2xl border-2 border-red-300 text-red-800 text-xs font-bold flex items-center gap-3">
                                            ⚠️ {modalError}
                                        </div>
                                    )}
                                    {userRole === 'admin' && editingEvent && (
                                        <div className="bg-red-50 p-4 rounded-2xl border-2 border-red-200 text-red-800 text-xs font-bold flex items-center gap-3"><Icons.Lock /> Slot Terkunci. Hanya Supervisor boleh mengubah atau memadam slot yang telah disimpan.</div>
                                    )}
                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="space-y-1">
                                            <label className="text-[11px] font-black text-slate-400 uppercase">Kod Kursus</label>
                                            <select 
                                                className={`w-full p-4 bg-slate-50 border-2 rounded-2xl font-black text-sm text-black ${formData.type === 'Lain-lain' ? 'opacity-50 cursor-not-allowed' : ''}`} 
                                                value={formData.type === 'Lain-lain' ? '' : formData.courseCode} 
                                                onChange={(e) => setFormData({...formData, courseCode: e.target.value})}
                                                disabled={formData.type === 'Lain-lain'}
                                            >
                                                {formData.type === 'Lain-lain' && <option value="">- Aktiviti Berasingan -</option>}
                                                {courseCodes.filter(c => c !== 'Lain-lain').map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                            {formData.type !== 'Lain-lain' && (
                                                <div className="mt-2 text-[10px] font-black text-blue-600 uppercase">Sem: {getCourseSemesterCount(formData.courseCode)} / {courseLimits[formData.courseCode] || '∞'}</div>

                                        <div className="space-y-1">
                                            <label className="text-[11px] font-black text-slate-400 uppercase">Bilangan Slot</label>
                                            <select className="w-full p-4 bg-slate-50 border-2 rounded-2xl font-black text-sm text-black" value={formData.duration} onChange={(e) => setFormData({...formData, duration: parseInt(e.target.value)})}>
                                                {[1,2,3,4].map(n => <option key={n} value={n}>{n} Slot</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="pt-1">
                                        <button 
                                            onClick={(e) => { e.preventDefault(); setFormData(prev => ({ ...prev, type: prev.type === 'Lain-lain' ? 'Kuliah' : 'Lain-lain' })); }} 
                                            className={`w-full py-4 rounded-2xl text-xs font-black uppercase tracking-widest transition-all border-2 ${formData.type === 'Lain-lain' ? 'bg-slate-800 border-slate-900 text-white shadow-lg' : 'bg-slate-50 border-slate-200 text-slate-400 hover:bg-slate-100 hover:text-slate-600'}`}>
                                            {formData.type === 'Lain-lain' ? 'AKTIVITI LAIN-LAIN (LL) AKTIF' : 'KLIK UNTUK PENGISIAN LAIN-LAIN (LL)'}
                                        </button>
                                    </div>
                                    
                                    {formData.type !== 'Lain-lain' && (
                                        <div className="space-y-3 animate-in fade-in duration-300">

                                                    <button key={t.value} onClick={(e) => { e.preventDefault(); setFormData({...formData, type: t.value}); }} className={`px-4 py-2 rounded-xl text-[10px] font-black transition-all border-2 ${formData.type === t.value ? t.color + ' border-blue-600 shadow-md scale-105' : 'bg-white border-slate-200 text-slate-400 hover:bg-slate-50'}`}> {t.label} </button>
                                                ))}
                                            </div>

                                    {(formData.type === 'Kuliah' || formData.type === 'Amali') && (

                                        </div>
                                    )}

                                            <select 
                                                className="w-full p-3 mb-2 bg-emerald-50 border-2 border-emerald-400 rounded-xl font-black text-[11px] text-emerald-900 shadow-sm outline-none cursor-pointer"
                                                onChange={(e) => {
                                                    if(e.target.value) setFormData({...formData, topic: e.target.value});
                                                    e.target.value = ""; 
                                                }}
                                            >
                                                <option value="">⬇️ KLIK SINI UNTUK SENARAI TAJUK SILIBUS ⬇️</option>
                                                {formData.courseCode && courseTopics[formData.courseCode] && courseTopics[formData.courseCode].map((tajuk, idx) => (
                                                    <option key={idx} value={tajuk}>{tajuk}</option>
                                                ))}
                                                {(!formData.courseCode || !courseTopics[formData.courseCode] || courseTopics[formData.courseCode].length === 0) && (
                                                    <option value="" disabled>-- Tiada senarai tajuk dimasukkan untuk kursus ini --</option>
                                                )}
                                            </select>
                                        )}

                                        <textarea rows="3" className="w-full p-4 bg-slate-50 border-2 rounded-2xl outline-none font-bold text-sm text-black shadow-sm" placeholder={formData.type === 'Lain-lain' ? "Sila catat maklumat aktiviti..." : "Taip secara manual atau pilih dari senarai dropdown di atas..."} value={formData.topic || ''} onChange={(e) => setFormData({...formData, topic: e.target.value})}></textarea>
                                    </div>
                                    <div className="space-y-1 text-black">
                                        <label className="text-[11px] font-black text-slate-400 uppercase">Nama Pengajar / Pegawai Bertanggungjawab</label>
                                        <select className="w-full p-4 bg-slate-50 border-2 rounded-2xl font-black text-sm text-black shadow-sm" value={formData.instructor || ''} onChange={(e) => setFormData({...formData, instructor: e.target.value})}>
                                            <option value="">Pilih Pengajar / Pegawai</option>
                                            {instructorList.map(name => <option key={name} value={name}>{name}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="p-10 bg-slate-50 border-t-2 flex gap-4">
                                    {!(userRole === 'admin' && editingEvent) && (
                                        <button onClick={(e) => { e.preventDefault(); setFormData(p => ({...p, topic: '', instructor: '', sessionNumber: ''}))}} className="flex-1 py-5 bg-white text-slate-600 text-xs font-black rounded-2xl border-2 active:scale-90 transition-all uppercase tracking-widest"><Icons.Undo /> Undo</button>
                                    )}
                                    {editingEvent && userRole === 'superuser' && ( <button onClick={handleDelete} className="p-5 bg-white text-red-600 border-2 border-red-100 rounded-2xl hover:bg-red-600 hover:text-white transition-all"><Icons.Trash /></button> )}
                                    {!(userRole === 'admin' && editingEvent) && (
                                        <button onClick={handleSave} className="flex-[3] py-5 bg-blue-600 text-white rounded-2xl text-sm font-black hover:bg-blue-700 shadow-xl uppercase tracking-widest transition-all flex items-center justify-center gap-2"> <Icons.Save /> Simpan Rekod </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DASHBOARD ANALITIK MODAL */}
                    {isDashboardOpen && (
                        <div className="fixed inset-0 z-[700] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm no-print animate-in fade-in text-black">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-5xl max-h-[90vh] overflow-hidden border-4 border-green-600 flex flex-col text-black">
                                <div className="bg-green-50 px-10 py-6 flex justify-between items-center border-b-2 border-green-100">
                                    <h3 className="font-black text-lg uppercase flex items-center gap-2 text-green-800"><Icons.Chart /> Analitik Jam: {academicSession}</h3>
                                    <button onClick={() => setIsDashboardOpen(false)} className="bg-white text-green-600 p-2 rounded-xl shadow-md"><Icons.X /></button>
                                </div>
                                <div className="p-10 overflow-y-auto flex-1 space-y-10">
                                    <div className="overflow-x-auto rounded-3xl border border-slate-100">
                                        <table className="w-full text-left">
                                            <thead>
                                                <tr className="bg-slate-50 text-[10px] font-black uppercase text-slate-400">
                                                    <th className="p-4">Kod Kursus</th>
                                                    <th className="p-4">Kuliah</th>
                                                    <th className="p-4">Amali</th>
                                                    <th className="p-4 text-blue-600">Jumlah Jam</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {Object.entries(dashboardData.courseSum).sort().map(([code, data]) => (
                                                    <tr key={code} className="text-xs border-t font-bold hover:bg-slate-50">
                                                        <td className="p-4 font-black text-slate-800">{code}</td>
                                                        <td className="p-4 text-slate-600">{data.Kuliah} j</td>
                                                        <td className="p-4 text-slate-600">{data.Amali} j</td>
                                                        <td className="p-4 text-blue-700 bg-blue-50/20 font-black">{data.total} j</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div>
                                        <h4 className="text-[12px] font-black uppercase mb-4 flex items-center gap-2 text-slate-400 tracking-widest"><div className="w-2 h-2 bg-emerald-600 rounded-full"></div> Jam Pengajar</h4>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {Object.entries(dashboardData.instructorSum).sort().map(([name, data]) => (
                                                <div key={name} className="p-4 bg-slate-50 rounded-2xl border-2 border-slate-100">
                                                    <p className="text-[10px] font-black uppercase text-slate-400 mb-1">{name}</p>
                                                    <p className="text-2xl font-black text-emerald-700">{data.total} <span className="text-[10px] uppercase opacity-50 font-black text-black">JAM</span></p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL SET AGIHAN (Superuser Only) */}
                    {isLimitModalOpen && (
                        <div className="fixed inset-0 z-[800] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm no-print animate-in fade-in">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-xl max-h-[90vh] overflow-hidden border-4 border-indigo-600 flex flex-col text-black">
                                <div className="bg-indigo-50 px-10 py-6 border-b-2 border-indigo-100 flex justify-between items-center">
                                    <h3 className="font-black text-lg uppercase flex items-center gap-2 text-indigo-800"><Icons.Settings /> Had Agihan Semester</h3>
                                    <button onClick={() => setIsLimitModalOpen(false)} className="bg-white text-indigo-600 p-2 rounded-xl shadow-md"><Icons.X /></button>
                                </div>
                                <div className="p-8 overflow-y-auto flex-1 grid grid-cols-2 gap-4 bg-white text-black">
                                    {courseCodes.filter(c => c !== 'Lain-lain').map(code => (
                                        <div key={code} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border-2 border-slate-100">
                                            <span className="text-[10px] font-black uppercase">{code}</span>
                                            <input type="number" min="0" className="w-16 p-2 rounded-lg border-2 border-slate-200 text-center font-black text-sm text-black" value={courseLimits[code] || 0} onChange={(e) => setCourseLimits({...courseLimits, [code]: e.target.value})} />
                                        </div>
                                    ))}
                                </div>
                                <div className="p-8 bg-slate-50 border-t-2">
                                    <button onClick={() => saveLimits(courseLimits)} className="w-full py-5 bg-indigo-600 text-white rounded-2xl font-black uppercase shadow-xl hover:bg-indigo-700 tracking-widest transition-all">Simpan Had Agihan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
