                const unsubEv = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', `jadual_cycle_${academicCycle}`), (s) => {
                    const d = {}; s.forEach(doc => { d[doc.id] = doc.data(); }); setEvents(d);
                });
                const unsubLim = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'jadual_meta_shared', 'course_limits'), (d) => { if(d.exists()) setCourseLimits(d.data()); });
                const unsubSig = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', `jadual_meta_${academicCycle}`, 'signatures'), (d) => { if(d.exists()) setFooterData(d.data()); });
                const unsubSat = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'jadual_meta_shared', 'saturday_configs'), (d) => { if(d.exists()) setSaturdayConfigs(d.data()); });
                const unsubHol = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'jadual_meta_shared', 'holidays'), (d) => { if(d.exists()) setHolidays(d.data()); });
                const unsubLock = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'jadual_meta_shared', 'global_lock'), (d) => {
                    if (d.exists()) setIsTimetableLocked(!!d.data().locked);
                });
                
                // Mendengar tarikh 'sessionStartDate' masa nyata (Firebase) untuk diselaraskan kepada Pelatih (viewer)
                const unsubStartDate = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'jadual_meta_shared', 'session_start_date'), (d) => {
                    if (d.exists() && d.data().date) {
                        setSessionStartDate(d.data().date);
                    }
                });

                return () => { unsubEv(); unsubLim(); unsubSig(); unsubSat(); unsubHol(); unsubLock(); unsubStartDate(); };
            }, [dbReady, isAuthorized, user, academicCycle]);

            useEffect(() => {
                if (!tableElementRef.current) return;
                const updateWidth = (entries) => {
                    for (let entry of entries) {
                        const newWidth = entry.target.scrollWidth;
                        setTableWidth(prev => { return Math.abs(prev - newWidth) > 10 ? newWidth : prev; });
                    }
                };
                const ro = new ResizeObserver(updateWidth);
                ro.observe(tableElementRef.current);
                return () => ro.disconnect();
            }, [isAuthorized, filterSemester, saturdayConfigs]);

            if (!isAuthorized) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-blue-900 p-6 text-black">

                                    >
                                        <option value="">-- SILA PILIH PROFIL AKSES --</option>

                                        value={accessCode} 
                                        onChange={e => setAccessCode(e.target.value)} 
                                        placeholder="••••••••" 
                                        className="w-full px-6 py-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-black text-center outline-none focus:border-blue-600 text-black font-bold text-lg"

                                <button type="submit" className="w-full py-4 bg-blue-600 text-white rounded-2xl font-black uppercase hover:bg-blue-700 transition-all shadow-md">Masuk</button>
                                {loginError && <p className="text-red-600 font-black text-xs uppercase bg-red-50 p-2 rounded-xl border border-red-100">{loginError}</p>}
                            </form>
                        </div>
                    </div>

            return (
                <div className="pb-20 bg-white min-h-screen text-black font-sans">

                                        <div className="flex items-center gap-2 mt-1">
                                            <button onClick={() => setAcademicCycle('A')} className={`px-2 py-0.5 rounded text-[9px] font-black uppercase ${academicCycle === 'A' ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 text-slate-400'}`}>Versi A</button>
                                            <button onClick={() => setAcademicCycle('B')} className={`px-2 py-0.5 rounded text-[9px] font-black uppercase ${academicCycle === 'B' ? 'bg-orange-600 text-white shadow-md' : 'bg-slate-100 text-slate-400'}`}>Versi B</button>

                                            {(userRole === 'admin' || userRole === 'superuser') && (

                                    </div>
                                    
                                    {userRole !== 'viewer' && (
                                        <div className="flex items-center gap-1 bg-slate-50 px-2 py-1.5 rounded-xl border border-slate-200 h-[34px]">
                                            <span className="text-[9px] font-black uppercase text-rose-500 mr-1">Cuti HKA/CT:</span>
                                            {visibleDays.map(d => {
                                                const holKey = `${academicCycle}-${selectedWeek}-${d}`; const isHol = holidays[holKey];
                                                return (

                                                        if(window.TMP_DB) window.TMP_DB.setDoc(window.TMP_DB.doc(window.TMP_DB.db, 'artifacts', window.TMP_DB.appId, 'public', 'data', 'jadual_meta_shared', 'holidays'), {...holidays, [holKey]: next}).catch(e=>console.error(e));
                                                    }} className={`w-6 h-6 rounded-md text-[10px] font-black transition-all flex items-center justify-center ${isHol ? 'bg-rose-500 text-white shadow-sm' : 'bg-white text-slate-400 border border-slate-200 hover:bg-slate-100'}`}>{d.substring(0, 1)}</button>
                                                );
                                            })}
                                        </div>
                                    )}

                                    {userRole !== 'viewer' && (
                                        <div className="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 h-[34px]">
                                            <span className="text-[9px] font-black uppercase text-slate-400">Sabtu</span>
                                            <button onClick={() => {
                                                const satKey = `${academicCycle}-${selectedWeek}`; const next = !currentWeekHasSaturday;
                                                setSaturdayConfigs({...saturdayConfigs, [satKey]: next});
                                                if(window.TMP_DB) window.TMP_DB.setDoc(window.TMP_DB.doc(window.TMP_DB.db, 'artifacts', window.TMP_DB.appId, 'public', 'data', 'jadual_meta_shared', 'saturday_configs'), {...saturdayConfigs, [satKey]: next}).catch(e=>console.error(e));
                                            }} className={`w-8 h-4 rounded-full relative transition-all ${currentWeekHasSaturday ? 'bg-green-500' : 'bg-slate-300'}`}><div className={`absolute top-0.5 w-3 h-3 bg-white rounded-full transition-all ${currentWeekHasSaturday ? 'left-4' : 'left-0.5'}`}></div></button>
                                        </div>
                                    )}

                                    {userRole === 'superuser' && (
                                        <div className="flex items-center gap-1 bg-purple-50 px-2 py-1.5 rounded-xl border border-purple-200 h-[34px] no-print">
                                            <span className="text-[9px] font-black uppercase text-purple-600 mr-1">Status M{selectedWeek}:</span>
                                            <select 
                                                value={weekStatuses[`${academicCycle}-${selectedWeek}`] || (weekStatus === "NORMAL" ? "NORMAL" : weekStatus)}
                                                onChange={(e) => {
                                                    const statKey = `${academicCycle}-${selectedWeek}`; const nextStat = e.target.value;
                                                    setWeekStatuses({...weekStatuses, [statKey]: nextStat});
                                                    if(window.TMP_DB) window.TMP_DB.setDoc(window.TMP_DB.doc(window.TMP_DB.db, 'artifacts', window.TMP_DB.appId, 'public', 'data', 'jadual_meta_shared', 'week_statuses'), {...weekStatuses, [statKey]: nextStat}).catch(err=>console.error(err));
                                                }}
                                                className="bg-transparent text-purple-800 text-[10px] font-black outline-none cursor-pointer uppercase"
                                            >
                                                <option value="NORMAL">Biasa (Normal)</option>
                                                <option value="CUTI PERTENGAHAN SEMESTER">Cuti Pertengahan Sem</option>
                                                <option value="CUTI AKHIR SEMESTER">Cuti Akhir Sem</option>
                                                <option value="PEPERIKSAAN AKHIR SEMESTER">Peperiksaan Akhir Sem</option>
                                            </select>
                                        </div>
                                    )}

                                    <div className="flex flex-col gap-1 border-r pr-3 border-slate-100">

                                        <select value={academicSession} onChange={e => setAcademicSession(e.target.value)} className="bg-blue-50 text-blue-800 text-[10px] font-black p-1.5 rounded-lg border border-blue-100 outline-none cursor-pointer">
                                            {academicCycle === 'A' ? ['Januari - Jun', 'Julai - Disember'].map(o => <option key={o}>{o}</option>) : ['Oktober - Mac', 'April - September'].map(o => <option key={o}>{o}</option>)}
                                        </select>

                                    {/* PENAMBAHBAIKAN UTAMA: Menyegerakan pertukaran tarikh 'sessionStartDate' secara masa nyata (Firebase) */}
                                    {userRole !== 'viewer' ? (
                                        <div className="flex flex-col gap-1 pr-3 border-slate-100">
                                            <label className="text-[9px] font-black uppercase text-slate-400 leading-none">Mula M1</label>
                                            <input type="date" value={sessionStartDate} onChange={e => handleStartDateChange(e.target.value)} className="bg-slate-100 text-slate-800 text-[10px] font-black p-1 rounded outline-none border border-slate-200" />
                                        </div>
                                    ) : (
                                        <div className="flex flex-col gap-1 pr-3 border-slate-100">
                                            <label className="text-[9px] font-black uppercase text-slate-400 leading-none">Mula M1</label>
                                            <span className="text-[10px] font-black text-slate-800 p-1 bg-slate-50 border border-slate-200 rounded-lg">{formatDateDisplay(sessionStartDate)}</span>
                                        </div>
                                    )}

                                    <div className="flex items-center gap-1">
                                        <button onClick={() => window.print()} className="bg-slate-800 text-white px-3 py-2.5 rounded-xl text-[10px] font-black flex items-center gap-2 uppercase shadow-md hover:bg-black transition-all"><Icons.Printer /> Cetak</button>
                                        <button onClick={handleExportPDF} className="bg-blue-600 text-white px-3 py-2.5 rounded-xl text-[10px] font-black flex items-center gap-2 uppercase shadow-md hover:bg-blue-800 transition-all"><Icons.FileText /> PDF</button>
                                    </div>
                                    <button onClick={handleLogout} className="p-3 bg-red-50 text-red-500 rounded-xl hover:bg-red-600 hover:text-white transition-all shadow-sm"><Icons.External /></button>
                                </div>
                            </div>

                            <div className="w-full bg-slate-50 p-1.5 rounded-2xl border-2 border-slate-200 overflow-hidden no-print">
                                <div className="week-scrollbar flex gap-2 overflow-x-auto pb-1 px-1">
                                    {Array.from({length: 26}, (_, i) => i + 1).map(w => (
                                        <button key={w} onClick={() => setSelectedWeek(w)} className={`shrink-0 min-w-[42px] py-1.5 rounded-xl font-black text-xs transition-all ${selectedWeek === w ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-400 hover:bg-slate-100'}`}>M{w}</button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </nav>

                    {}
                    <main ref={printAreaRef} className="max-w-[99%] mx-auto p-4 md:p-8 print:p-0">
                        <div className="relative mb-6 text-center border-b-2 border-black pb-4 text-black">
                            <div className="absolute top-0 right-0 text-[10px] md:text-[12px] font-bold text-black uppercase tracking-tighter">BPLKKM.PK(T)04B/17</div>
                            <div className="flex justify-center mb-1">
                                <img 
                                    src={JATA_NEGARA_FILE_ID ? `https://lh3.googleusercontent.com/d/${JATA_NEGARA_FILE_ID}` : "https://www.parlimen.gov.my/images/webdev/logo/jata-negara.png"} 
                                    alt="Jata Negara" 
                                    className="h-20 w-auto object-contain mx-auto"
                                    crossOrigin="anonymous"
                                    referrerPolicy="no-referrer"
                                    onError={(e) => { 
                                        e.target.onerror = null; 
                                        e.target.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Coat_of_arms_of_Malaysia.svg/400px-Coat_of_arms_of_Malaysia.svg.png"; 
                                    }} 
                                />
                            </div>
                            <h1 className="text-lg font-black uppercase leading-tight">KEMENTERIAN KESIHATAN MALAYSIA</h1>
                            <h2 className="text-base font-bold uppercase underline underline-offset-4 tracking-wide">Jadual Waktu Mingguan</h2>
                            
                            <div className="mt-6 flex flex-col text-left gap-2 font-sans">
                                <div className="flex items-center gap-2">
                                    <span className="font-black text-[12px] uppercase shrink-0">NAMA INSTITUSI:</span>
                                    <span className="font-bold text-[12px] uppercase">INSTITUT LATIHAN KEMENTERIAN KESIHATAN MALAYSIA KUCHING, SARAWAK</span>
                                </div>
                                <div className="flex justify-between items-end">
                                    <div className="flex items-center gap-8">
                                        <div className="flex items-center gap-2">
                                            <span className="font-black text-[12px] uppercase">TARIKH:</span>
                                            <span className="font-bold text-[12px] text-blue-700 uppercase tracking-tight">{autoWeekRange}</span>
                                        </div>
                                        <div className="flex items-center gap-2 text-black">
                                            <span className="font-black text-[12px] uppercase">SEMESTER:</span>
                                            <select value={filterSemester} onChange={e => setFilterSemester(e.target.value)} className="font-bold text-[12px] uppercase text-black bg-slate-100 px-2 py-0.5 rounded no-print outline-none cursor-pointer border border-slate-200">
                                                <option value="SEMUA">Sm Semester</option>
                                                {semesters.map(s => <option key={s} value={s}>{semesterLabels[s]}</option>)}
                                            </select>
                                            <span className="hidden print:inline font-bold text-[12px] uppercase">{filterSemester === 'SEMUA' ? 'Semua' : semesterLabels[filterSemester]}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="font-black text-[12px] uppercase">SESI AKADEMIK:</span>
                                            <span className="font-bold text-[12px] uppercase">{currentSessionAcademic}</span>
                                        </div>
                                    </div>
                                    <div className="text-right pr-8">
                                        <h2 className="text-xl font-black uppercase leading-none">MINGGU {selectedWeek}</h2>
                                        {weekStatus !== "NORMAL" && <p className="text-[10px] text-red-600 uppercase font-black tracking-widest mt-1">{weekStatus}</p>}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div ref={topScrollRef} className="sync-scroll-container no-print">
                            <div style={{ width: `${tableWidth}px`, height: '1px' }}></div>
                        </div>

                        {}
                        <div ref={tableContainerRef} className="freeze-container table-to-scroll">
                            <div ref={tableElementRef}>
                                <table className="w-full border-collapse table-fixed min-w-[1500px] print:min-w-full text-black">
                                    <thead>
                                        <tr className="bg-slate-50 border-b-2 border-black text-[12px] font-black uppercase">
                                            <th className="w-36 p-4 border-r border-black">Hari / Tarikh</th>
                                            <th className="w-16 border-r border-black text-center">Sem</th>
                                            {timeSlots.map(slot => (<th key={slot} className="p-3 border-r border-black text-center">{slot}</th>))}
                                        </tr>
                                    </thead>

                                        {visibleDays.map((day, dIdx) => {
                                            const vSems = filterSemester === 'SEMUA' ? semesters : [filterSemester];
                                            return vSems.map((sem, sIdx) => {
                                                const skips = [];
                                                return (
                                                    <tr key={`${day}-${sem}`} className={`border-b border-black/20 ${sIdx === vSems.length - 1 ? 'border-b-2 border-black' : ''}`}>
                                                        {sIdx === 0 && (
                                                            <td rowSpan={vSems.length} className="p-4 bg-white border-r border-black text-center align-middle">
                                                                <div className="font-black uppercase text-xs">{day}</div>
                                                                <div className="text-[10px] font-black text-blue-700 bg-blue-50 px-2 py-1 rounded inline-block mt-1">{getDisplayDateForDay(dIdx)}</div>
                                                            </td>
                                                        )}
                                                        <td className="p-2 bg-white text-center font-black text-[11px] border-r border-black">{sem}</td>
                                                        {timeSlots.map((slot, slotIdx) => {
                                                            if (skips.includes(slotIdx)) return null;
                                                            const key = `${academicSession}-${selectedWeek}-${day}-${sem}-${slotIdx}`;
                                                            const ev = events[key];
                                                            const isBreak = isSlotBreak(day, slotIdx);
                                                            const isHoliday = holidays[`${academicCycle}-${selectedWeek}-${day}`];
                                                            
                                                            if (isHoliday) {
                                                                if (sIdx === 0) return (<td key={slotIdx} rowSpan={vSems.length} className="bg-rose-50/60 border-r border-black p-2 text-center align-middle"> <span className="text-[10px] font-black uppercase vertical-text tracking-[0.4em] text-rose-500 opacity-80">CUTI (HKA / CT)</span> </td>);
                                                                return null;
                                                            }
                                                            if (isBreak) {
                                                                if (sIdx === 0) return (<td key={slotIdx} rowSpan={vSems.length} className="bg-slate-100 border-r border-black text-center align-middle"> <span className="text-[10px] font-black uppercase vertical-text tracking-[0.4em] opacity-30">REHAT</span> </td>);
                                                                return null;
                                                            }

                                                            let colSpan = 1;
                                                            if (ev && ev.duration > 1) { for(let i=1; i<ev.duration; i++) { if(!isSlotBreak(day, slotIdx+i)) { colSpan++; skips.push(slotIdx+i); } else break; } }
                                                            
                                                            const isMatch = searchTerm && searchTerm.trim() !== "" && ev && ev.courseCode && (
                                                                ev.courseCode.toLowerCase().includes(searchTerm.toLowerCase()) || (ev.instructor && ev.instructor.toLowerCase().includes(searchTerm.toLowerCase()))
                                                            );

                                                            const canEdit = userRole === 'superuser' || (userRole === 'admin' && !isTimetableLocked);
                                                            
                                                            // PENAMBAHBAIKAN UTAMA: Transformasi warna merah muda untuk slot IL yang dibooking
                                                            let cardColorClass = sessionTypes.find(t => t.value === ev?.type)?.color || 'bg-white border-l-4';
                                                            if (ev && ev.type === 'IL' && ev.isBooked) {
                                                                cardColorClass = 'bg-rose-100 border-rose-500 text-rose-800 border-l-4'; // Latar belakang merah muda
                                                            }

                                                            return (
                                                                <td key={slotIdx} colSpan={colSpan} className={`p-1 border-r border-black/20 h-32 align-top ${key === lastUpdatedKey ? 'highlight-new' : ''}`}>
                                                                    <div onClick={() => handleOpenModalInternal(day, sem, slotIdx, ev)} className={`h-full w-full rounded-xl p-2 text-[10px] overflow-hidden transition-all ${ev && ev.courseCode ? `flex flex-col ${cardColorClass}` : 'border-2 border-dashed border-slate-100 flex items-center justify-center text-slate-200'} ${isMatch ? 'search-match' : ''} ${canEdit ? 'cursor-pointer active:scale-95' : 'cursor-default'}`}>

                                                                            <React.Fragment>
                                                                                <div className="font-black uppercase truncate border-b border-black/5 pb-1 mb-1 leading-tight shrink-0 min-h-[16px]">

                                    <button onClick={(e) => { e.preventDefault(); setFormData(p => ({...p, topic: '', instructor: '', benchTutors: '', sessionNumber: '', isBooked: false}))}} className="flex-1 py-5 bg-white text-slate-600 text-xs font-black rounded-2xl border-2 active:scale-90 transition-all uppercase tracking-widest"><Icons.Undo /> Undo</button>
                                    {editingEvent && ( <button onClick={handleDelete} className="p-5 bg-white text-red-600 border-2 border-red-100 rounded-2xl hover:bg-red-600 hover:text-white transition-all"><Icons.Trash /></button> )}
                                    <button onClick={handleSave} className="flex-[3] py-5 bg-blue-600 text-white rounded-2xl text-sm font-black hover:bg-blue-700 shadow-xl uppercase tracking-widest transition-all flex items-center justify-center gap-2"> <Icons.Save /> Simpan Rekod </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DASHBOARD ANALITIK MODAL */}
                    {isDashboardOpen && (
                        <div className="fixed inset-0 z-[700] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm no-print animate-in fade-in text-black">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-5xl max-h-[90vh] overflow-hidden border-4 border-green-600 flex flex-col text-black">
                                <div className="bg-green-50 px-10 py-6 flex justify-between items-center border-b-2 border-green-100">
                                    <h3 className="font-black text-lg uppercase flex items-center gap-2 text-green-800"><Icons.Chart /> Analitik Jam: {academicSession}</h3>
                                    <button onClick={() => setIsDashboardOpen(false)} className="bg-white text-green-600 p-2 rounded-xl shadow-md"><Icons.X /></button>
                                </div>
                                <div className="p-10 overflow-y-auto flex-1 space-y-10">
                                    <div className="overflow-x-auto rounded-3xl border border-slate-100">
                                        <table className="w-full text-left">
                                            <thead>
                                                <tr className="bg-slate-50 text-[10px] font-black uppercase text-slate-400">
                                                    <th className="p-4">Kod Kursus</th>
                                                    <th className="p-4">Kuliah</th>
                                                    <th className="p-4">Amali</th>
                                                    <th className="p-4 text-blue-600">Jumlah Jam</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {Object.entries(dashboardData.courseSum).sort().map(([code, data]) => (
                                                    <tr key={code} className="text-xs border-t font-bold hover:bg-slate-50">
                                                        <td className="p-4 font-black text-slate-800">{code}</td>
                                                        <td className="p-4 text-slate-600">{data.Kuliah} j</td>
                                                        <td className="p-4 text-slate-600">{data.Amali} j</td>
                                                        <td className="p-4 text-blue-700 bg-blue-50/20 font-black">{data.total} j</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div>
                                        <h4 className="text-[12px] font-black uppercase mb-4 flex items-center gap-2 text-slate-400 tracking-widest"><div className="w-2 h-2 bg-emerald-600 rounded-full"></div> Jam Pengajar</h4>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {Object.entries(dashboardData.instructorSum).sort().map(([name, data]) => (
                                                <div key={name} className="p-4 bg-slate-50 rounded-2xl border-2 border-slate-100">
                                                    <p className="text-[10px] font-black uppercase text-slate-400 mb-1">{name}</p>
                                                    <p className="text-2xl font-black text-emerald-700">{data.total} <span className="text-[10px] uppercase opacity-50 font-black text-black">JAM</span></p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL SET AGIHAN (Superuser Only) */}
                    {isLimitModalOpen && (
                        <div className="fixed inset-0 z-[800] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-sm no-print animate-in fade-in">
                            <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-xl max-h-[90vh] overflow-hidden border-4 border-indigo-600 flex flex-col text-black">
                                <div className="bg-indigo-50 px-10 py-6 border-b-2 border-indigo-100 flex justify-between items-center text-black">
                                    <h3 className="font-black text-lg uppercase flex items-center gap-2 text-indigo-800"><Icons.Settings /> Had Agihan Semester</h3>
                                    <button onClick={() => setIsLimitModalOpen(false)} className="bg-white text-indigo-600 p-2 rounded-xl shadow-md"><Icons.X /></button>
                                </div>
                                <div className="p-8 overflow-y-auto flex-1 grid grid-cols-2 gap-4 bg-white text-black">
                                    {courseCodes.filter(c => c !== 'Lain-lain').map(code => (
                                        <div key={code} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border-2 border-slate-100">
                                            <span className="text-[10px] font-black uppercase">{code}</span>
                                            <input type="number" min="0" className="w-16 p-2 rounded-lg border-2 border-slate-200 text-center font-black text-sm text-black" value={courseLimits[code] || 0} onChange={(e) => setCourseLimits({...courseLimits, [code]: e.target.value})} />
                                        </div>
                                    ))}
                                </div>
                                <div className="p-8 bg-slate-50 border-t-2">
                                    <button onClick={() => saveLimits(courseLimits)} className="w-full py-5 bg-indigo-600 text-white rounded-2xl font-black uppercase shadow-xl hover:bg-indigo-700 tracking-widest transition-all">Simpan Had Agihan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
